absolute threshold; baseline-relative design value."},{"indicator":"q_sleepiness","op":">=","threshold":7,"ref":"absolute","weight":15,"note":"KSS 7 = 'sleepy but no effort to keep awake' (anchor label); KSS rises with time awake and varies strongly with time of day (Akerstedt & Gillberg 1990)."},{"indicator":"q_sleep_hours","op":"<","threshold":7,"ref":"absolute","weight":10,"note":"Short sleep (<7 h; CDC); misalignment shortens sleep (Flynn-Evans 2016)."},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Misalignment reduces sleep quality when sleep falls in the biological day (local CNS file)."},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":7,"note":"Misalignment and long work hours are linked to attention deficits and errors (local CNS file)."},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Daytime fatigue."},{"indicator":"q_appetite_change","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Circadian disruption is linked to altered glucose regulation and metabolism (local CNS file)."},{"indicator":"q_med_change","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Misalignment is associated with increased medication use (Flynn-Evans 2016)."}],"questionnaire_triggers":["q_sleepiness>=7","q_sleep_hours<7","q_sleep_quality>=2","q_concentration>=2","q_low_energy>=2","q_appetite_change>=2","q_med_change>=1"],"probable_causes":["Shifted or rotating schedules (slam shifts, docking or EVA preparation)","Insufficient or mistimed light exposure","About 16 sunrises and sunsets per day in low Earth orbit","Absence of natural light-dark cues","Late-evening screen and work light"],"isolation_relevance":"On long-duration ISS missions, circadian misalignment occurred on roughly 20% of flight days with about one hour of sleep lost per night (local CNS file, citing Flynn-Evans et al. 2016). In Mars-500, two of six crew drifted to non-24 h or split sleep-wake patterns and were asleep while others were awake for about 20% of the mission (Basner 2013).","orientative_interpretation":"This session ran during the usual biological night and/or your answers and eye signals may indicate sleepiness and shortened sleep. This pattern may indicate that your body clock and schedule are out of step. Timed bright light at the start of your day, dim light before sleep and a consistent anchor sleep period may help.","countermeasure_ids":["cm_circadian_lighting_shift","cm_bright_light_morning","cm_evening_light_dimming","cm_sleep_schedule_anchor","cm_strategic_nap","cm_caffeine_timing"],"escalation_criteria":"Discuss with the flight surgeon and mission planners if misalignment is repeated over several days, before upcoming schedule shifts, if sleepiness affects safety-critical tasks, or if medication is being considered (NASA-STD-3001 V1 6001 circadian shifting and fatigue management).","red_flags":["KSS 8-9 during critical tasks","Microsleeps or nodding off","Repeated shifted schedules without recovery","Increasing hypnotic or stimulant use"],"camera_limits":"Clock time and eye signals cannot reveal a person's internal circadian phase; a night-time session may be a planned shift. Drowsiness signs are shared with sleep deprivation and insomnia. Sleep timing from the questionnaire or schedule is needed.","sources":[{"title":"Flynn-Evans E, Gregory K, Arsintescu L, Whitmire A. Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload (NASA JSC-CN-35774)","url":"https://ntrs.nasa.gov/citations/20160003864","year":2016},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null},{"title":"Basner M, Dinges DF, Mollicone D, et al. Mars 520-d mission simulation reveals protracted crew hypokinesis and alterations of sleep duration and timing. PNAS 2013;110(7):2635-2640","url":"https://www.med.upenn.edu/uep/assets/user-content/documents/PNAS2013Basner1212646110withSupportingAppendix.pdf","year":2013},{"title":"NASA: Risk from Inadequate Sleep and Irregular Schedules","url":"https://www.nasa.gov/reference/risk-from-inadequate-sleep-and-irregular-schedules/","year":2024},{"title":"Hilditch CJ, McHill AW. Sleep inertia: current insights. Nat Sci Sleep 2019;11:155-165","url":"https://www.dovepress.com/sleep-inertia-current-insights-peer-reviewed-fulltext-article-NSS","year":2019},{"title":"Akerstedt T, Gillberg M. Subjective and objective sleepiness in the active individual. Int J Neurosci 1990;52:29-37 (KSS chapter, UPenn CBT-I)","url":"https://www.med.upenn.edu/cbti/assets/user-content/documents/Karolinska Sleepiness Scale (KSS) Chapter.pdf","year":1990},{"title":"CDC FastStats: Sleep in Adults","url":"https://www.cdc.gov/sleep/data-and-statistics/Adults.html","year":2024},{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023}]},{"id":"sleep_deprivation","name":"Pattern consistent with sleep deprivation (acute or accumulated)","category":"sleep_circadian","summary":"Too little sleep over one or more nights, leading to sleepiness, slower reactions, lapses of attention and irritability. Deficits build up over consecutive short nights even when the person feels adapted.","indicator_rules":[{"indicator":"perclos_pct","op":">","threshold":30,"ref":"baseline_pct","weight":15,"note":"Eyelid closure (PERCLOS) above personal baseline consistent with drowsiness; no validated absolute threshold; baseline-relative design value (absolute PERCLOS ranges are defined by agent B reference_ranges)."},{"indicator":"yawn_per_10min","op":">","threshold":50,"ref":"baseline_pct","weight":10,"note":"More yawning than personal baseline consistent with sleepiness; no validated absolute threshold; baseline-relative design value."},{"indicator":"fatigue_level","op":">","threshold":25,"ref":"baseline_pct","weight":10,"note":"Composite fatigue index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"head_stability_pct","op":"<","threshold":-10,"ref":"baseline_pct","weight":5,"note":"Head stability more than 10% below baseline may reflect head nodding; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_sleep_hours","op":"<","threshold":6,"ref":"absolute","weight":20,"note":"Six hours per night for 14 days produced cumulative cognitive deficits (Van Dongen 2003); in-flight averages were about 6 h (Barger 2014)."},{"indicator":"q_sleep_hours","op":"<","threshold":7,"ref":"absolute","weight":10,"note":"Less than 7 h per day is short sleep for adults (CDC)."},{"indicator":"q_sleepiness","op":">=","threshold":7,"ref":"absolute","weight":15,"note":"KSS 7 = 'sleepy but no effort to keep awake' (anchor label; Akerstedt & Gillberg 1990)."},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Vigilant attention is the function most consistently affected by sleep loss (Lim & Dinges 2008)."},{"indicator":"q_irritability","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Sleep loss is linked to mood and team problems (NASA OCHMO sleep brief)."}],"questionnaire_triggers":["q_sleep_hours<6","q_sleep_hours<7","q_sleepiness>=7","q_concentration>=2","q_irritability>=2"],"probable_causes":["Shortened sleep opportunity due to workload or schedule","Environmental disruptions (noise, light, temperature, vibration)","Circadian misalignment","Late caffeine","Emergencies or night-time alarms"],"isolation_relevance":"Astronauts commonly experience sleep deprivation (NASA HRP sleep risk), averaging about 6 h per night in flight versus 8.5 h scheduled (Barger 2014). With chronic restriction, subjective sleepiness levels off while performance keeps declining, so people may underestimate their impairment (Van Dongen 2003).","orientative_interpretation":"You reported short sleep and your eyes and face may show signs of sleepiness compared with your baseline. This may indicate accumulated sleep loss. Because chronic sleep loss can impair attention even when you feel used to it, it is worth protecting your next sleep period and, if possible, taking a short strategic nap before critical tasks.","countermeasure_ids":["cm_strategic_nap","cm_sleep_schedule_anchor","cm_caffeine_timing","cm_workload_rebalance","cm_wind_down_routine","cm_noise_reduction"],"escalation_criteria":"Inform the flight surgeon and mission planning if sleep has been under 6 h for several consecutive nights, if KSS is 8-9 before critical tasks, or if microsleeps occur. Consider rescheduling safety-critical tasks (NASA-STD-3001 V1 4014 limits on workday and sleep periods).","red_flags":["Nodding off or microsleeps","Errors in critical tasks","Several consecutive nights under 6 h","Reliance on stimulants to stay awake"],"camera_limits":"PERCLOS, yawning and head nodding show drowsiness but cannot measure how much sleep was lost or why; illness, medication, boredom and low light can produce similar signals. Sleep hours must come from the user or a sleep tracker.","sources":[{"title":"Van Dongen HPA, Maislin G, Mullington JM, Dinges DF. The cumulative cost of additional wakefulness. Sleep 2003;26(2)","url":"https://ntrs.nasa.gov/citations/20040087752","year":2003},{"title":"Barger LK, Flynn-Evans EE, Kubey A, et al. Prevalence of sleep deficiency and use of hypnotic drugs in astronauts before, during, and after spaceflight: an observational study. Lancet Neurol 2014 (ScienceDaily summary)","url":"https://sciencedaily.com/releases/2014/08/140807215803.htm","year":2014},{"title":"CDC FastStats: Sleep in Adults","url":"https://www.cdc.gov/sleep/data-and-statistics/Adults.html","year":2024},{"title":"Akerstedt T, Gillberg M. Subjective and objective sleepiness in the active individual. Int J Neurosci 1990;52:29-37 (KSS chapter, UPenn CBT-I)","url":"https://www.med.upenn.edu/cbti/assets/user-content/documents/Karolinska Sleepiness Scale (KSS) Chapter.pdf","year":1990},{"title":"Lim J, Dinges DF. Sleep deprivation and vigilant attention. Ann N Y Acad Sci 2008;1129:305-322","url":"https://www.med.upenn.edu/uep/assets/user-content/documents/LimDinges2008VigilantAttention.pdf","year":2008},{"title":"NASA HRP: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload","url":"https://www.nasa.gov/directorates/esdmd/hhp/risk-of-performance-decrements-and-adverse-health-outcomes-resulting-from-sleep-loss-circadian-desynchronization-and-work-overload","year":2025},{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021}]},{"id":"sleep_inertia","name":"Pattern consistent with sleep inertia (grogginess after waking)","category":"sleep_circadian","summary":"A temporary period of grogginess and reduced performance right after waking, strongest in the first 30 minutes and worse after sleep loss or when waking during the biological night.","indicator_rules":[{"indicator":"perclos_pct","op":">","threshold":30,"ref":"baseline_pct","weight":12,"note":"Eyelid closure (PERCLOS) above personal baseline consistent with drowsiness; no validated absolute threshold; baseline-relative design value (absolute PERCLOS ranges are defined by agent B reference_ranges)."},{"indicator":"yawn_per_10min","op":">","threshold":50,"ref":"baseline_pct","weight":8,"note":"More yawning than personal baseline consistent with sleepiness; no validated absolute threshold; baseline-relative design value."},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":10,"note":"Composite fatigue index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"head_stability_pct","op":"<","threshold":-10,"ref":"baseline_pct","weight":5,"note":"Head stability more than 10% below baseline may reflect head nodding; no validated absolute threshold; baseline-relative design value."},{"indicator":"local_hour","op":"<=","threshold":6,"ref":"absolute","weight":10,"note":"Sleep inertia effects are greatest near the circadian low in core body temperature (Hilditch 2019); time window is a design choice, no validated absolute threshold. Ask whether the session is within 30 min of waking."},{"indicator":"q_sleepiness","op":">=","threshold":7,"ref":"absolute","weight":20,"note":"KSS 7 = 'sleepy but no effort to keep awake' (anchor label)."},{"indicator":"q_sleep_hours","op":"<","threshold":7,"ref":"absolute","weight":10,"note":"Prior sleep loss increases sleep inertia (Hilditch 2019)."},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Reduced alertness and performance after waking (Hilditch 2019)."},{"indicator":"q_med_change","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Sleep aids may prolong grogginess; review with the flight surgeon."},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Disturbed sleep before waking."}],"questionnaire_triggers":["q_sleepiness>=7","q_sleep_hours<7","q_concentration>=2","q_med_change>=1","q_sleep_quality>=2"],"probable_causes":["Waking from a long nap or deep sleep","Waking during the biological night","Prior sleep deprivation","Sedating medication or sleep aids","Sudden alarm-driven awakening"],"isolation_relevance":"Crews may be woken for alarms or off-nominal events and must act soon after waking; pilot-error accidents were most common in the first hour after waking, and the most significant inertia effects occur within 30 minutes (Hilditch 2019).","orientative_interpretation":"If you woke up recently, your signals may indicate normal post-waking grogginess. It is usually strongest in the first 30 minutes and fades over about an hour. If possible, allow a short buffer before critical tasks, use bright light and, if appropriate, caffeine.","countermeasure_ids":["cm_bright_light_morning","cm_caffeine_timing","cm_strategic_nap","cm_microbreaks","cm_sleep_schedule_anchor"],"escalation_criteria":"Inform the flight surgeon if grogginess regularly lasts beyond an hour after waking, if it follows new sleep medication, or if it has affected an emergency response.","red_flags":["Grogginess lasting more than an hour on repeated days","Confusion after waking","Errors during emergency awakenings"],"camera_limits":"The camera cannot know how long ago the user woke up, so this pattern relies on context (time of day, questionnaire). Drowsiness signs alone are shared with sleep deprivation and circadian misalignment.","sources":[{"title":"Hilditch CJ, McHill AW. Sleep inertia: current insights. Nat Sci Sleep 2019;11:155-165","url":"https://www.dovepress.com/sleep-inertia-current-insights-peer-reviewed-fulltext-article-NSS","year":2019},{"title":"Akerstedt T, Gillberg M. Subjective and objective sleepiness in the active individual. Int J Neurosci 1990;52:29-37 (KSS chapter, UPenn CBT-I)","url":"https://www.med.upenn.edu/cbti/assets/user-content/documents/Karolinska Sleepiness Scale (KSS) Chapter.pdf","year":1990},{"title":"Rosekind MR, et al. Alertness management: strategic naps in operational settings. J Sleep Res 1995;4(S2):62-66 (Sleep Foundation summary)","url":"https://www.sleepfoundation.org/sleep-hygiene/nasa-nap","year":1995},{"title":"NHLBI: Sleep Deprivation and Deficiency - Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits","year":2022}]},{"id":"cognitive_fatigue","name":"Pattern consistent with cognitive (mental) fatigue","category":"cognitive","summary":"A drop in alertness, attention and mental efficiency after prolonged or demanding cognitive work, often made worse by sleep loss.","indicator_rules":[{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":12,"note":"Composite fatigue index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"perclos_pct","op":">","threshold":20,"ref":"baseline_pct","weight":8,"note":"Eyelid closure (PERCLOS) above personal baseline consistent with drowsiness; no validated absolute threshold; baseline-relative design value (absolute PERCLOS ranges are defined by agent B reference_ranges)."},{"indicator":"yawn_per_10min","op":">","threshold":30,"ref":"baseline_pct","weight":5,"note":"More yawning than personal baseline consistent with sleepiness; no validated absolute threshold; baseline-relative design value."},{"indicator":"head_stability_pct","op":"<","threshold":-10,"ref":"baseline_pct","weight":5,"note":"Head stability more than 10% below baseline may reflect postural slumping or nodding; no validated absolute threshold; baseline-relative design value."},{"indicator":"affect_variability","op":"<","threshold":-15,"ref":"baseline_pct","weight":5,"note":"Reduced facial expressivity vs baseline; expression is culture- and person-dependent and cannot indicate mood alone; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Difficulty concentrating; vigilant attention declines with time on task, strongly amplified by sleep loss (Lim & Dinges 2008)."},{"indicator":"q_workload","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Work overload is part of the NASA sleep/work-overload risk."},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Feeling tired or having little energy."},{"indicator":"q_sleepiness","op":">=","threshold":6,"ref":"absolute","weight":5,"note":"KSS 6 = 'some signs of sleepiness' (anchor label)."},{"indicator":"q_sleep_hours","op":"<","threshold":7,"ref":"absolute","weight":10,"note":"Short sleep (<7 h; CDC) amplifies time-on-task decline (Lim & Dinges 2008)."},{"indicator":"q_irritability","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Irritability with mental fatigue."}],"questionnaire_triggers":["q_concentration>=2","q_workload>=2","q_low_energy>=2","q_sleepiness>=6","q_sleep_hours<7","q_irritability>=2"],"probable_causes":["Long continuous task blocks without breaks","High cognitive workload","Sleep loss","Monotonous monitoring tasks","Environmental factors (noise, CO2, heat)"],"isolation_relevance":"Astronauts must sustain high cognitive performance throughout a mission (NASA sleep risk), and stress and environmental factors degrade neurocognitive performance in space (local CNS file). NASA monitors cognition monthly against a preflight baseline (WinSCAT; OCHMO).","orientative_interpretation":"Your answers and signals may indicate mental fatigue: concentration feels harder and your eyes and face show more tiredness than your baseline. Short breaks, splitting tasks into smaller blocks and protecting sleep may help restore focus.","countermeasure_ids":["cm_microbreaks","cm_task_chunking","cm_cognitive_load_review","cm_strategic_nap","cm_caffeine_timing","cm_co2_ventilation_check","cm_screen_eye_rest"],"escalation_criteria":"Discuss with the flight surgeon if concentration problems persist for more than a few days despite rest, if errors occur in critical tasks, or if they are accompanied by headache, visual changes or confusion (which need medical review).","red_flags":["Errors in safety-critical tasks","Confusion or disorientation","New headache with visual changes","Concentration problems with low mood"],"camera_limits":"Fatigue indices and eye signals cannot measure cognitive performance directly; a reaction-time or cognitive test is needed. Elevated CO2, illness or medication can produce similar signs.","sources":[{"title":"Lim J, Dinges DF. Sleep deprivation and vigilant attention. Ann N Y Acad Sci 2008;1129:305-322","url":"https://www.med.upenn.edu/uep/assets/user-content/documents/LimDinges2008VigilantAttention.pdf","year":2008},{"title":"NASA HRP: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload","url":"https://www.nasa.gov/directorates/esdmd/hhp/risk-of-performance-decrements-and-adverse-health-outcomes-resulting-from-sleep-loss-circadian-desynchronization-and-work-overload","year":2025},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"CDC FastStats: Sleep in Adults","url":"https://www.cdc.gov/sleep/data-and-statistics/Adults.html","year":2024},{"title":"Akerstedt T, Gillberg M. Subjective and objective sleepiness in the active individual. Int J Neurosci 1990;52:29-37 (KSS chapter, UPenn CBT-I)","url":"https://www.med.upenn.edu/cbti/assets/user-content/documents/Karolinska Sleepiness Scale (KSS) Chapter.pdf","year":1990},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null},{"title":"Albulescu P, et al. 'Give me a break!' A systematic review and meta-analysis on the efficacy of micro-breaks for increasing well-being and performance. PLoS ONE 2022;17(8):e0272460","url":"https://www.eurekalert.org/news-releases/962663","year":2022}]},{"id":"burnout_overload","name":"Pattern consistent with work overload and burnout risk","category":"psychological","summary":"Exhaustion, growing mental distance or cynicism about work, and reduced sense of effectiveness resulting from chronic work stress that has not been successfully managed.","indicator_rules":[{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":8,"note":"Composite fatigue index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"stress_index","op":">","threshold":20,"ref":"baseline_pct","weight":8,"note":"Composite stress index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":6,"note":"Composite wellbeing index more than 15% below baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"rmssd_ms","op":"<","threshold":-15,"ref":"baseline_pct","weight":5,"note":"RMSSD more than 15% below baseline; stress is associated with reduced parasympathetic (vagal) HRV (Kim 2018 meta-analysis); no validated absolute threshold; baseline-relative design value."},{"indicator":"affect_variability","op":"<","threshold":-15,"ref":"baseline_pct","weight":5,"note":"Reduced facial expressivity vs baseline; expression is culture- and person-dependent and cannot indicate mood alone; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_workload","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Chronic workplace stress is the defining cause of burn-out (WHO ICD-11)."},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Energy depletion or exhaustion is the first ICD-11 burn-out dimension (WHO)."},{"indicator":"q_anhedonia","op":">=","threshold":1,"ref":"absolute","weight":8,"note":"Reduced interest may reflect mental distance from work (WHO dimension 2)."},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Reduced efficacy (WHO dimension 3)."},{"indicator":"q_irritability","op":">=","threshold":2,"ref":"absolute","weight":7,"note":"Negativism or cynicism related to the job (WHO dimension 2)."},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Sleep problems with chronic stress (MedlinePlus Stress)."},{"indicator":"q_mood_low","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Low mood overlapping with exhaustion."}],"questionnaire_triggers":["q_workload>=2","q_low_energy>=2","q_anhedonia>=1","q_concentration>=2","q_irritability>=2","q_sleep_quality>=2","q_mood_low>=1"],"probable_causes":["Sustained high workload without recovery","Low control over schedule","Long work hours and short sleep","Conflicting demands from ground","Lack of meaningful leisure"],"isolation_relevance":"Work overload is part of NASA's sleep and circadian risk, and NASA builds designated relaxation and self-care time into crew routines to help prevent burnout. On exploration missions, crews will need more autonomy over workload management (HRP evidence report).","orientative_interpretation":"Your answers suggest heavy workload together with tiredness or reduced engagement, and your signals may show more strain than your baseline. This may indicate a risk of overload. Reviewing priorities with the team, protecting off-duty time and having some say over your schedule may help.","countermeasure_ids":["cm_workload_rebalance","cm_autonomy_scheduling","cm_cognitive_load_review","cm_microbreaks","cm_leisure_hobby","cm_sleep_schedule_anchor","cm_bhp_consult"],"escalation_criteria":"If the safety item is answered yes at any time, the app's safety protocol takes priority over this orientation. Raise with the flight surgeon, behavioral health team and mission planning if exhaustion persists for 2 weeks or more, if work quality is slipping, or if low mood or anhedonia develop (PHQ-2 total of 3 or more).","red_flags":["Persistent exhaustion despite rest","Cynicism affecting crew relations","Errors due to fatigue","Emerging depressive symptoms"],"camera_limits":"Burn-out is defined by work-related experiences (exhaustion, cynicism, reduced efficacy) that a camera cannot observe; physiological strain and fatigue signals are non-specific.","sources":[{"title":"WHO: Burn-out an 'occupational phenomenon': International Classification of Diseases","url":"https://www.who.int/news-room/detail/28-05-2019-burn-out-an-occupational-phenomenon-international-classification-of-diseases","year":2019},{"title":"NASA HRP: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload","url":"https://www.nasa.gov/directorates/esdmd/hhp/risk-of-performance-decrements-and-adverse-health-outcomes-resulting-from-sleep-loss-circadian-desynchronization-and-work-overload","year":2025},{"title":"NASA: Risk from Inadequate Sleep and Irregular Schedules","url":"https://www.nasa.gov/reference/risk-from-inadequate-sleep-and-irregular-schedules/","year":2024},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"MedlinePlus: Stress","url":"https://medlineplus.gov/stress.html","year":2023},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}]},{"id":"social_isolation_loneliness","name":"Pattern consistent with loneliness or felt social isolation","category":"social","summary":"The distressing perception of being socially isolated, lacking companionship or feeling left out, which is different from simply being alone.","indicator_rules":[{"indicator":"affect_variability","op":"<","threshold":-20,"ref":"baseline_pct","weight":10,"note":"Reduced facial expressivity vs baseline; expression is culture- and person-dependent and cannot indicate mood alone; no validated absolute threshold; baseline-relative design value."},{"indicator":"emotion_happy_pct","op":"<","threshold":-30,"ref":"baseline_pct","weight":8,"note":"Fewer positive expressions than personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":8,"note":"Composite wellbeing index more than 15% below baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"emotion_sad_pct","op":">","threshold":30,"ref":"baseline_pct","weight":6,"note":"More sad-classified expressions than personal baseline; classifier output, not a mood measure; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_lonely","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Feeling isolated 'often'; adapted from the 3-item UCLA loneliness scale (Hughes 2004)."},{"indicator":"q_lonely","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Feeling isolated at least some of the time (Hughes 2004)."},{"indicator":"q_homesick","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Separation from family is a reported stressor in orbit (Kanas 2016)."},{"indicator":"q_mood_low","op":">=","threshold":1,"ref":"absolute","weight":7,"note":"Loneliness is associated with poorer mental health (Hawkley & Cacioppo 2010)."},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Loneliness is linked to poorer sleep quality (Hawkley & Cacioppo 2010)."},{"indicator":"q_conflict","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Interpersonal tension can increase felt isolation within a small crew."}],"questionnaire_triggers":["q_lonely>=2","q_lonely>=1","q_homesick>=2","q_mood_low>=1","q_sleep_quality>=2","q_conflict>=2"],"probable_causes":["Physical separation from family and friends","Communication delays and reduced contact with Earth","Small crew with limited social variety","Interpersonal tension or exclusion","Cultural or language differences within the crew"],"isolation_relevance":"Isolation and confinement are the defining exposures of NASA's behavioral health risk. Communication delays on Mars missions (up to 20 minutes one way) will limit real-time contact with family and support (HRP evidence report). Loneliness increases vigilance for social threat and is linked to poorer sleep and health (Hawkley & Cacioppo 2010).","orientative_interpretation":"Your answers suggest that you have often felt isolated or lacking companionship recently. This may indicate loneliness, which is common in long isolated missions and worth addressing early. Planned contact with family, shared crew activities and talking with a trusted crewmate may help.","countermeasure_ids":["cm_family_conference","cm_crew_social_meal","cm_peer_support_checkin","cm_leisure_hobby","cm_expressive_writing","cm_bhp_consult"],"escalation_criteria":"If the safety item is answered yes at any time, the app's safety protocol takes priority over this orientation. Discuss with the behavioral health team if loneliness is frequent for 2 weeks or more, is accompanied by low mood (PHQ-2 total of 3 or more), or leads to withdrawal from the crew.","red_flags":["Withdrawal from crew activities","Loneliness with depressive symptoms","Hopelessness","Thoughts of self-harm (safety protocol)"],"camera_limits":"Loneliness is a subjective perception; no facial or physiological signal can measure it. Reduced expressivity is shared with fatigue, concentration and low mood. Only the questionnaire can support this pattern.","sources":[{"title":"Hughes ME, Waite LJ, Hawkley LC, Cacioppo JT. A Short Scale for Measuring Loneliness in Large Surveys. Research on Aging 2004;26(6):655-672","url":"https://meps.ipums.org/meps/resources/Hughes_et_al2004.pdf","year":2004},{"title":"Hawkley LC, Cacioppo JT. Loneliness matters: a theoretical and empirical review of consequences and mechanisms. Ann Behav Med 2010;40(2):218-27","url":"https://hrs.isr.umich.edu/bibcite/reference/12341","year":2010},{"title":"NASA HRP: Risk of Adverse Cognitive or Behavioral Changes and Psychiatric Disorders Leading to In-mission Health and Performance and Long-term Health Effects (Behavioral Health Risk)","url":"https://www.nasa.gov/directorates/esdmd/hhp/risk-of-adverse-cognitive-or-behavioral-conditions-and-psychiatric-disorders","year":2025},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"Kanas N. Psychiatric Issues in Space. Psychiatric Times 33(6)","url":"https://www.psychiatrictimes.com/view/psychiatric-issues-space","year":2016},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023}]},{"id":"irritability_interpersonal_strain","name":"Pattern consistent with irritability and interpersonal strain","category":"social","summary":"Increased irritability, short temper or friction with crewmates or ground teams, often building up over long confinement and with sleep loss.","indicator_rules":[{"indicator":"emotion_angry_pct","op":">","threshold":50,"ref":"baseline_pct","weight":10,"note":"More anger-classified expressions than baseline; classifier output only; no validated absolute threshold; baseline-relative design value."},{"indicator":"emotion_disgust_pct","op":">","threshold":50,"ref":"baseline_pct","weight":5,"note":"More disgust-classified expressions than baseline; classifier output only; no validated absolute threshold; baseline-relative design value."},{"indicator":"facial_tension","op":">","threshold":20,"ref":"baseline_pct","weight":8,"note":"Facial muscle tension above baseline; NIMH lists muscle tension among anxiety/stress symptoms; no validated absolute threshold; baseline-relative design value."},{"indicator":"hr_bpm","op":">","threshold":10,"ref":"baseline_pct","weight":5,"note":"Heart rate above personal baseline may reflect sympathetic arousal (MedlinePlus Stress); no validated absolute threshold; baseline-relative design value."},{"indicator":"rmssd_ms","op":"<","threshold":-15,"ref":"baseline_pct","weight":5,"note":"RMSSD more than 15% below baseline; stress is associated with reduced parasympathetic (vagal) HRV (Kim 2018 meta-analysis); no validated absolute threshold; baseline-relative design value."},{"indicator":"stress_index","op":">","threshold":15,"ref":"baseline_pct","weight":5,"note":"Composite stress index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_irritability","op":">=","threshold":2,"ref":"absolute","weight":25,"note":"Irritability or feeling easily upset (MedlinePlus Stress; NIMH)."},{"indicator":"q_conflict","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Crew conflict occurs before and during flight (NASA Team Risk)."},{"indicator":"q_workload","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Overload increases tension."},{"indicator":"q_sleep_hours","op":"<","threshold":7,"ref":"absolute","weight":5,"note":"Sleep loss is linked to mood and team problems (NASA OCHMO sleep brief)."},{"indicator":"q_mission_phase","op":">=","threshold":3,"ref":"absolute","weight":7,"note":"HI-SEAS crews showed disruption of team dynamics in the third quarter (Rosenberg 2022)."}],"questionnaire_triggers":["q_irritability>=2","q_conflict>=2","q_workload>=2","q_sleep_hours<7","q_mission_phase>=3"],"probable_causes":["Prolonged confinement with the same people","Sleep loss and fatigue","Workload and coordination problems with ground","Cultural, language or management-style differences","Lack of privacy"],"isolation_relevance":"NASA's Team Risk notes occasional crew conflict before and during flight and the impact of communication delays on stress and cohesion. Studies found crews displacing tension onto mission control (Kanas 2016), and HI-SEAS crews showed rising interpersonal tension mid-mission (Rosenberg 2022).","orientative_interpretation":"Your answers suggest more irritability or friction than usual, and your expressions and tension may differ from your baseline. This pattern may indicate interpersonal strain, which is common in long confinement. A calm debrief, some private time and protecting sleep may help.","countermeasure_ids":["cm_conflict_debrief","cm_private_space_time","cm_box_breathing","cm_sleep_schedule_anchor","cm_crew_social_meal","cm_cognitive_reframing","cm_bhp_consult"],"escalation_criteria":"If the safety item is answered yes at any time, the app's safety protocol takes priority over this orientation. Involve the behavioral health team or a neutral mediator if conflicts recur, affect task coordination or safety, or if there is any risk of aggression.","red_flags":["Conflict affecting safety-critical coordination","Threats or aggression","Persistent withdrawal of a crewmember","Irritability with low mood or insomnia"],"camera_limits":"Expression classifiers frequently confuse concentration, glare or speech with anger; facial tension and heart rate also rise with effort. Interpersonal conflict cannot be observed by a single-person camera. Questionnaire answers are required.","sources":[{"title":"NASA HRP: Risk of In-Mission Performance and Behavioral Health Decrements Due to Inadequate Cooperation, Coordination, Communication, and Psychosocial Adaptation within a Team (Team Risk)","url":"https://www.nasa.gov/directorates/esdmd/hhp/team-risk/","year":2025},{"title":"NASA: Risk of inadequate teamwork","url":"https://www.nasa.gov/reference/risk-of-inadequate-teamwork","year":2024},{"title":"Kanas N. Psychiatric Issues in Space. Psychiatric Times 33(6)","url":"https://www.psychiatrictimes.com/view/psychiatric-issues-space","year":2016},{"title":"Rosenberg JD, Jannasch A, Binsted K, Landry S. Biobehavioral and psychosocial stress changes during three 8-12 month spaceflight analog missions with Mars-like conditions of isolation and confinement. Front Physiol 2022","url":"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2022.898841/pdf","year":2022},{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021},{"title":"MedlinePlus: Stress","url":"https://medlineplus.gov/stress.html","year":2023},{"title":"Landon LB, Miller JCW, Bell ST, Roma PG. When people start getting real: The Group Living Skills Survey for extreme work environments. Front Psychol 2024;15:1348119","url":"https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2024.1348119/pdf","year":2024}]},{"id":"apathy_anhedonia","name":"Pattern consistent with reduced interest and pleasure (anhedonia)","category":"psychological","summary":"Reduced interest, motivation or pleasure in activities that are usually enjoyable, sometimes with flattened expression and low energy.","indicator_rules":[{"indicator":"affect_variability","op":"<","threshold":-25,"ref":"baseline_pct","weight":12,"note":"Reduced facial expressivity vs baseline; expression is culture- and person-dependent and cannot indicate mood alone; no validated absolute threshold; baseline-relative design value."},{"indicator":"emotion_neutral_pct","op":">","threshold":25,"ref":"baseline_pct","weight":8,"note":"More neutral-classified frames than baseline; also normal during focused work; no validated absolute threshold; baseline-relative design value."},{"indicator":"emotion_happy_pct","op":"<","threshold":-40,"ref":"baseline_pct","weight":8,"note":"Fewer positive expressions than personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"microexpr_min","op":"<","threshold":-30,"ref":"baseline_pct","weight":5,"note":"Fewer micro-expressions than baseline; experimental signal; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_anhedonia","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"PHQ-2 item (0-3); PHQ-2 total >=3 is the validated screening cut-point (Kroenke 2003: sensitivity 82.9%, specificity 90.0% for major depression)."},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Fatigue or lack of energy (NIMH depression)."},{"indicator":"q_boredom","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Monotony can reduce activity and lead to more serious mood disturbance (HRP evidence report)."},{"indicator":"q_mood_low","op":">=","threshold":1,"ref":"absolute","weight":8,"note":"PHQ-2 item (0-3); PHQ-2 total >=3 is the validated screening cut-point (Kroenke 2003: sensitivity 82.9%, specificity 90.0% for major depression)."},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":4,"note":"Difficulty concentrating."},{"indicator":"q_appetite_change","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Appetite change (NIMH depression)."}],"questionnaire_triggers":["q_anhedonia>=2","q_low_energy>=2","q_boredom>=2","q_mood_low>=1","q_concentration>=2","q_appetite_change>=2"],"probable_causes":["Monotony and lack of novelty","Low mood or depression","Chronic fatigue or sleep loss","Reduced reward from routine tasks","Medical causes (e.g. thyroid, anemia) to be ruled out"],"isolation_relevance":"In ICE settings, monotony can reduce activity and social interaction, and chronic boredom could lead to more serious mood disturbances (HRP evidence report). Mars-500 crews showed progressive hypokinesis, with active wakefulness falling and rest time rising by 50.4% (Basner 2013).","orientative_interpretation":"Your answers suggest less interest or pleasure in things than usual, and your expressions appear less varied than your baseline. This may indicate anhedonia, which is worth discussing with your behavioral health team. Scheduling small rewarding activities, even when motivation is low, may help restart enjoyment.","countermeasure_ids":["cm_behavioral_activation","cm_pleasant_activity_schedule","cm_novelty_variety","cm_aerobic_session","cm_bright_light_morning","cm_bhp_consult"],"escalation_criteria":"If the safety item is answered yes at any time, the app's safety protocol takes priority over this orientation. A PHQ-2 total of 3 or more warrants follow-up with the PHQ-9 or a clinician (Kroenke 2003). Refer if loss of interest persists nearly every day for 2 weeks or more (NIMH).","red_flags":["Loss of interest nearly every day for 2 weeks or more","Withdrawal from crew and family contact","Hopelessness","Thoughts of self-harm (safety protocol)"],"camera_limits":"A neutral or flat face is normal during concentration and varies with personality and culture; it cannot indicate loss of pleasure without the user's answers.","sources":[{"title":"Kroenke K, Spitzer RL, Williams JB. The Patient Health Questionnaire-2: validity of a two-item depression screener. Med Care 2003;41:1284-92","url":"https://www.hiv.uw.edu/page/mental-health-screening/phq-2","year":2003},{"title":"NIMH: Depression (NIH Publication No. 24-MH-8079)","url":"https://www.nimh.nih.gov/health/publications/depression","year":2024},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"Basner M, Dinges DF, Mollicone D, et al. Mars 520-d mission simulation reveals protracted crew hypokinesis and alterations of sleep duration and timing. PNAS 2013;110(7):2635-2640","url":"https://www.med.upenn.edu/uep/assets/user-content/documents/PNAS2013Basner1212646110withSupportingAppendix.pdf","year":2013},{"title":"Kroenke K, Spitzer RL, Williams JB. The PHQ-9: validity of a brief depression severity measure. J Gen Intern Med 2001;16(9):606-13","url":"https://www.infontd.org/bibcite/export/ris/bibcite_reference/32168","year":2001}]},{"id":"confinement_distress","name":"Pattern consistent with confinement-related distress","category":"psychological","summary":"Restlessness, tension or a feeling of being trapped related to living and working in a small, enclosed habitat with limited privacy and few ways to change surroundings.","indicator_rules":[{"indicator":"stress_index","op":">","threshold":20,"ref":"baseline_pct","weight":10,"note":"Composite stress index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"hr_bpm","op":">","threshold":10,"ref":"baseline_pct","weight":6,"note":"Heart rate above personal baseline may reflect sympathetic arousal (MedlinePlus Stress); no validated absolute threshold; baseline-relative design value."},{"indicator":"rmssd_ms","op":"<","threshold":-15,"ref":"baseline_pct","weight":6,"note":"RMSSD more than 15% below baseline; stress is associated with reduced parasympathetic (vagal) HRV (Kim 2018 meta-analysis); no validated absolute threshold; baseline-relative design value."},{"indicator":"facial_tension","op":">","threshold":20,"ref":"baseline_pct","weight":6,"note":"Facial muscle tension above baseline; NIMH lists muscle tension among anxiety/stress symptoms; no validated absolute threshold; baseline-relative design value."},{"indicator":"head_stability_pct","op":"<","threshold":-10,"ref":"baseline_pct","weight":5,"note":"Head stability more than 10% below baseline may reflect restlessness; no validated absolute threshold; baseline-relative design value."},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":7,"note":"Composite wellbeing index more than 15% below baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_nervous","op":">=","threshold":2,"ref":"absolute","weight":12,"note":"GAD-2 item (0-3); GAD-2 total >=3 is the preferred cut-point (Kroenke 2007: sensitivity 86%, specificity 83% for GAD)."},{"indicator":"q_worry","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"GAD-2 item (0-3); GAD-2 total >=3 is the preferred cut-point (Kroenke 2007: sensitivity 86%, specificity 83% for GAD)."},{"indicator":"q_boredom","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Monotony is a frequent complaint in ICE environments (HRP evidence report)."},{"indicator":"q_irritability","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Irritability with confinement."},{"indicator":"q_lonely","op":">=","threshold":1,"ref":"absolute","weight":6,"note":"Felt isolation."},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":6,"note":"Habitat noise, light and temperature disrupt sleep (NASA sleep risk)."},{"indicator":"q_mission_phase","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Distress after the novelty of the first phase; HI-SEAS perceived stress rose in months 5-7 (Rosenberg 2022)."},{"indicator":"q_conflict","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Small crews cannot easily escape each other (Rosenberg 2022)."}],"questionnaire_triggers":["q_nervous>=2","q_worry>=2","q_boredom>=2","q_irritability>=2","q_lonely>=1","q_sleep_quality>=2","q_mission_phase>=2","q_conflict>=1"],"probable_causes":["Small habitable volume and lack of privacy","Monotonous environment and limited sensory variety","Noise, lighting, temperature and air-quality stressors","Inability to leave or change surroundings","Crowding with the same people"],"isolation_relevance":"NASA states that exposure to the isolation and confinement of spaceflight can result in decrements in cognitive and behavioral functioning. NASA-STD-3001 requires individual privacy facilities for missions longer than 30 days (OCHMO sleep brief, V2 7071). Mars missions will offer much smaller living space than the ISS (NASA teamwork risk).","orientative_interpretation":"Your answers and signals may indicate distress linked to the confined environment, such as restlessness, tension or feeling hemmed in. This is a recognized challenge of long missions. Private time, sensory variety such as nature scenes, and physical activity may help.","countermeasure_ids":["cm_private_space_time","cm_nature_vr_exposure","cm_novelty_variety","cm_aerobic_session","cm_paced_breathing_6","cm_noise_reduction","cm_bhp_consult"],"escalation_criteria":"If the safety item is answered yes at any time, the app's safety protocol takes priority over this orientation. Discuss with the behavioral health team if distress persists for 2 weeks or more, if GAD-2 total reaches 3 or more, or if it leads to avoidance, conflict or sleep problems.","red_flags":["Feeling trapped with panic-like episodes","Persistent sleep loss","Escalating conflict","Thoughts of self-harm (safety protocol)"],"camera_limits":"Physiological arousal and restlessness are non-specific; the camera cannot know that distress relates to confinement. Environmental causes (CO2, heat, noise) can produce similar signals and should be checked.","sources":[{"title":"NASA HRP: Risk of Adverse Cognitive or Behavioral Changes and Psychiatric Disorders Leading to In-mission Health and Performance and Long-term Health Effects (Behavioral Health Risk)","url":"https://www.nasa.gov/directorates/esdmd/hhp/risk-of-adverse-cognitive-or-behavioral-conditions-and-psychiatric-disorders","year":2025},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021},{"title":"NASA: Risk of inadequate teamwork","url":"https://www.nasa.gov/reference/risk-of-inadequate-teamwork","year":2024},{"title":"Rosenberg JD, Jannasch A, Binsted K, Landry S. Biobehavioral and psychosocial stress changes during three 8-12 month spaceflight analog missions with Mars-like conditions of isolation and confinement. Front Physiol 2022","url":"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2022.898841/pdf","year":2022},{"title":"NASA HRP: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload","url":"https://www.nasa.gov/directorates/esdmd/hhp/risk-of-performance-decrements-and-adverse-health-outcomes-resulting-from-sleep-loss-circadian-desynchronization-and-work-overload","year":2025},{"title":"Kroenke K, Spitzer RL, Williams JB, Monahan PO, Lowe B. Anxiety disorders in primary care: prevalence, impairment, comorbidity, and detection. Ann Intern Med 2007;146:317-25","url":"https://www.hiv.uw.edu/page/mental-health-screening/gad-2","year":2007}]},{"id":"psychosomatic_tension","name":"Pattern consistent with stress-related physical tension","category":"psychological","summary":"Physical symptoms such as headaches, jaw or neck tension and muscle aches that accompany stress or worry, without a clear physical cause.","indicator_rules":[{"indicator":"facial_tension","op":">","threshold":25,"ref":"baseline_pct","weight":15,"note":"Facial muscle tension above baseline; NIMH lists muscle tension among anxiety/stress symptoms; no validated absolute threshold; baseline-relative design value."},{"indicator":"stress_index","op":">","threshold":15,"ref":"baseline_pct","weight":8,"note":"Composite stress index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"rmssd_ms","op":"<","threshold":-15,"ref":"baseline_pct","weight":7,"note":"RMSSD more than 15% below baseline; stress is associated with reduced parasympathetic (vagal) HRV (Kim 2018 meta-analysis); no validated absolute threshold; baseline-relative design value."},{"indicator":"hr_bpm","op":">","threshold":10,"ref":"baseline_pct","weight":5,"note":"Heart rate above personal baseline may reflect sympathetic arousal (MedlinePlus Stress); no validated absolute threshold; baseline-relative design value."},{"indicator":"rr_rpm","op":">","threshold":10,"ref":"baseline_pct","weight":5,"note":"Breathing rate above baseline consistent with arousal (NIMH GAD: feeling out of breath); no validated absolute threshold; baseline-relative design value."},{"indicator":"q_headache","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Headaches and muscle aches are listed symptoms of stress and anxiety (NIMH; MedlinePlus Stress)."},{"indicator":"q_worry","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"GAD-2 item (0-3); GAD-2 total >=3 is the preferred cut-point (Kroenke 2007: sensitivity 86%, specificity 83% for GAD)."},{"indicator":"q_nervous","op":">=","threshold":1,"ref":"absolute","weight":8,"note":"GAD-2 item (0-3); GAD-2 total >=3 is the preferred cut-point (Kroenke 2007: sensitivity 86%, specificity 83% for GAD)."},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":7,"note":"Sleep loss accompanies stress (NIMH)."},{"indicator":"q_workload","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Sustained workload."},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Hard time concentrating (NIMH GAD)."},{"indicator":"q_med_change","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Medication changes can cause headache; review needed."}],"questionnaire_triggers":["q_headache>=2","q_worry>=2","q_nervous>=1","q_sleep_quality>=2","q_workload>=2","q_concentration>=1","q_med_change>=1"],"probable_causes":["Sustained stress or worry","Prolonged static posture at workstations","Jaw clenching","Short sleep","Physical causes to rule out: headache from CO2, fluid shift or medication"],"isolation_relevance":"Psychosomatic reactions such as toothache and recurrent dreams that generate anxiety have been reported in spaceflight (local CNS file). Headache is also a common in-flight complaint with physical causes, so it needs medical review if persistent.","orientative_interpretation":"Your facial tension appears higher than your baseline and you reported headaches or aches together with worry or stress. This pattern may indicate stress-related physical tension. Progressive muscle relaxation, jaw and neck release and slow breathing may help; persistent or unusual headaches should be checked with your flight surgeon.","countermeasure_ids":["cm_pmr","cm_body_scan","cm_jaw_relaxation","cm_neck_shoulder_release","cm_paced_breathing_6","cm_stretching_break","cm_flight_surgeon_review"],"escalation_criteria":"Contact the flight surgeon for headaches that are severe, new in character, persistent, or accompanied by visual changes, vomiting or confusion, since physical causes (CO2, fluid shifts, intracranial pressure) must be ruled out. Involve the behavioral health team if physical symptoms track with ongoing stress.","red_flags":["Severe or sudden headache","Headache with visual changes, vomiting or confusion","Chest pain","Symptoms that do not ease with relaxation"],"camera_limits":"Facial tension can reflect concentration, squinting, cold or speaking; the camera cannot detect headaches or pain and cannot distinguish stress-related from medical causes.","sources":[{"title":"NIMH: Generalized Anxiety Disorder: When Worry Gets Out of Control","url":"https://www.nimh.nih.gov/health/publications/generalized-anxiety-disorder-gad","year":2025},{"title":"NIMH: I'm So Stressed Out! Fact Sheet","url":"https://www.nimh.nih.gov/health/publications/so-stressed-out-fact-sheet/index.shtml","year":null},{"title":"MedlinePlus: Stress","url":"https://medlineplus.gov/stress.html","year":2023},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null},{"title":"VA Whole Health Library: Progressive Muscle Relaxation (Mirgain SA, Singles J)","url":"https://www.va.gov/WHOLEHEALTHLIBRARY/tools/progressive-muscle-relaxation.asp","year":2016},{"title":"Kim HG, Cheon EJ, Bai DS, Lee YH, Koo BH. Stress and Heart Rate Variability: A Meta-Analysis and Review of the Literature. Psychiatry Investig 2018;15(3):235-245","url":"https://pubmed.ncbi.nlm.nih.gov/29486547/","year":2018}]},{"id":"third_quarter_slump","name":"Pattern consistent with a third-quarter morale dip","category":"psychological","summary":"A dip in morale and mood that some crews report after the mission midpoint, especially in the third quarter, often improving as the end approaches. Evidence for a fixed timing is mixed.","indicator_rules":[{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":10,"note":"Composite wellbeing index more than 15% below baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"affect_variability","op":"<","threshold":-15,"ref":"baseline_pct","weight":8,"note":"Reduced facial expressivity vs baseline; expression is culture- and person-dependent and cannot indicate mood alone; no validated absolute threshold; baseline-relative design value."},{"indicator":"emotion_happy_pct","op":"<","threshold":-25,"ref":"baseline_pct","weight":7,"note":"Fewer positive expressions than personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"fatigue_level","op":">","threshold":15,"ref":"baseline_pct","weight":5,"note":"Composite fatigue index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"stress_index","op":">","threshold":15,"ref":"baseline_pct","weight":5,"note":"Composite stress index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_mission_phase","op":">=","threshold":3,"ref":"absolute","weight":15,"note":"Morale tends to dip in the third quarter and rise in the fourth (HRP evidence report; Stuster 2010); some reviews suggest it can extend into the final quarter."},{"indicator":"q_mood_low","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"PHQ-2 item (0-3); PHQ-2 total >=3 is the validated screening cut-point (Kroenke 2003: sensitivity 82.9%, specificity 90.0% for major depression)."},{"indicator":"q_boredom","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Monotony after the novelty phase (HRP evidence report)."},{"indicator":"q_anhedonia","op":">=","threshold":1,"ref":"absolute","weight":8,"note":"PHQ-2 item (0-3); PHQ-2 total >=3 is the validated screening cut-point (Kroenke 2003: sensitivity 82.9%, specificity 90.0% for major depression)."},{"indicator":"q_irritability","op":">=","threshold":2,"ref":"absolute","weight":7,"note":"Interpersonal tension in the third quarter (Rosenberg 2022)."},{"indicator":"q_conflict","op":">=","threshold":2,"ref":"absolute","weight":7,"note":"HI-SEAS third quarter: 'managing conflict' phase (Rosenberg 2022)."},{"indicator":"q_homesick","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Separation from family over time."},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Low energy."}],"questionnaire_triggers":["q_mission_phase>=3","q_mood_low>=1","q_boredom>=2","q_anhedonia>=1","q_irritability>=2","q_conflict>=2","q_homesick>=2","q_low_energy>=2"],"probable_causes":["Realizing the mission is only about half over","Loss of novelty and accumulated monotony","Accumulated fatigue and sleep debt","Social dynamics, such as crew rotation or arrivals"],"isolation_relevance":"Astronaut journals showed a morale drop in the third quarter of ISS missions (Stuster 2010), and HI-SEAS crews showed team-dynamics disruption in the third quarter (Rosenberg 2022). However, a meta-analysis of 21 Antarctic studies (1,826 personnel) did not find a consistent third-quarter peak and suggests social events may matter more than elapsed time (Hawkes & Norris 2017).","orientative_interpretation":"You are in the later part of the mission and your answers and signals may indicate somewhat lower morale than your baseline. Many crews notice a dip around this phase that tends to lift as the end approaches. Marking milestones, adding variety and connecting with crew and family may help.","countermeasure_ids":["cm_mission_milestones","cm_novelty_variety","cm_pleasant_activity_schedule","cm_family_conference","cm_crew_social_meal","cm_leisure_hobby"],"escalation_criteria":"If the safety item is answered yes at any time, the app's safety protocol takes priority over this orientation. Discuss with the behavioral health team if the dip deepens rather than lifts, if PHQ-2 total reaches 3 or more, or if conflict or withdrawal increase.","red_flags":["Mood worsening across several weeks","PHQ-2 total of 3 or more","Escalating conflict","Thoughts of self-harm (safety protocol)"],"camera_limits":"The camera cannot know the mission phase or attribute a mood change to it; this pattern relies on the mission-phase answer plus mood items. Facial signals alone are non-specific.","sources":[{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"Stuster J. Behavioral Issues Associated With Long Duration Space Expeditions: Review and Analysis of Astronaut Journals (NASA JSC-CN-21128)","url":"https://ntrs.nasa.gov/citations/20100026549","year":2010},{"title":"Rosenberg JD, Jannasch A, Binsted K, Landry S. Biobehavioral and psychosocial stress changes during three 8-12 month spaceflight analog missions with Mars-like conditions of isolation and confinement. Front Physiol 2022","url":"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2022.898841/pdf","year":2022},{"title":"Hawkes C, Norris K. Time-dependent mood fluctuations in Antarctic personnel: a meta-analysis. Polar Record","url":"https://doi.org/10.1017/S003224741700050X","year":2017},{"title":"Palinkas LA, Suedfeld P. Psychological effects of polar expeditions (The Lancet review; EurekAlert news release)","url":"https://www.eurekalert.org/news-releases/537875","year":2007},{"title":"Kroenke K, Spitzer RL, Williams JB. The Patient Health Questionnaire-2: validity of a two-item depression screener. Med Care 2003;41:1284-92","url":"https://www.hiv.uw.edu/page/mental-health-screening/phq-2","year":2003}]},{"id":"monotony_boredom","name":"Pattern consistent with monotony and boredom","category":"psychological","summary":"Persistent boredom and under-stimulation from repetitive routines and an unchanging environment, which can reduce energy, concentration and social interaction.","indicator_rules":[{"indicator":"affect_variability","op":"<","threshold":-20,"ref":"baseline_pct","weight":10,"note":"Reduced facial expressivity vs baseline; expression is culture- and person-dependent and cannot indicate mood alone; no validated absolute threshold; baseline-relative design value."},{"indicator":"emotion_neutral_pct","op":">","threshold":20,"ref":"baseline_pct","weight":8,"note":"More neutral-classified frames than baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"fatigue_level","op":">","threshold":15,"ref":"baseline_pct","weight":5,"note":"Composite fatigue index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"microexpr_min","op":"<","threshold":-20,"ref":"baseline_pct","weight":5,"note":"Fewer micro-expressions than baseline; experimental signal; no validated absolute threshold; baseline-relative design value."},{"indicator":"wellbeing_index","op":"<","threshold":-10,"ref":"baseline_pct","weight":6,"note":"Composite wellbeing index more than 10% below baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_boredom","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Monotony is a frequent complaint in ICE environments (HRP evidence report)."},{"indicator":"q_boredom","op":">=","threshold":3,"ref":"absolute","weight":10,"note":"Boredom nearly every day."},{"indicator":"q_anhedonia","op":">=","threshold":1,"ref":"absolute","weight":8,"note":"Chronic boredom could lead to more serious mood disturbances (HRP evidence report)."},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Monotony can cause loss of energy and concentration (HRP evidence report)."},{"indicator":"q_irritability","op":">=","threshold":1,"ref":"absolute","weight":8,"note":"Monotony can contribute to interpersonal conflict (HRP evidence report)."},{"indicator":"q_mission_phase","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Monotony builds after the initial novelty phase."}],"questionnaire_triggers":["q_boredom>=2","q_boredom>=3","q_anhedonia>=1","q_concentration>=1","q_irritability>=1","q_mission_phase>=2"],"probable_causes":["Repetitive routines and tasks","Unchanging visual and sensory environment","Limited leisure options","Reduced meaningful work","Long communication delays reducing outside input"],"isolation_relevance":"The HRP evidence report describes monotony as a frequent complaint in ICE settings that can contribute to boredom, interpersonal conflict, loss of energy and concentration, and reduced activity and social interaction; being 'meaningfully busy' is described as the single most important psychological factor on long flights.","orientative_interpretation":"Your answers suggest frequent boredom, and your expressions may appear less varied than your baseline. This may indicate monotony building up, which is common in long missions. Adding variety, meaningful projects and leisure activities may help.","countermeasure_ids":["cm_novelty_variety","cm_leisure_hobby","cm_nature_vr_exposure","cm_autonomy_scheduling","cm_pleasant_activity_schedule","cm_aerobic_session"],"escalation_criteria":"Discuss with the behavioral health team if boredom is accompanied by loss of interest or low mood (PHQ-2 total of 3 or more), or if it is affecting performance or crew relations.","red_flags":["Boredom with loss of pleasure in everything","Reduced performance on monitoring tasks","Withdrawal from crew"],"camera_limits":"Neutral or flat expressions are typical during focused work and cannot reveal boredom on their own; the questionnaire is required.","sources":[{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"Basner M, Dinges DF, Mollicone D, et al. Mars 520-d mission simulation reveals protracted crew hypokinesis and alterations of sleep duration and timing. PNAS 2013;110(7):2635-2640","url":"https://www.med.upenn.edu/uep/assets/user-content/documents/PNAS2013Basner1212646110withSupportingAppendix.pdf","year":2013},{"title":"Kroenke K, Spitzer RL, Williams JB. The Patient Health Questionnaire-2: validity of a two-item depression screener. Med Care 2003;41:1284-92","url":"https://www.hiv.uw.edu/page/mental-health-screening/phq-2","year":2003}]},{"id":"homesickness_family_strain","name":"Pattern consistent with homesickness or family-related strain","category":"social","summary":"Missing home and loved ones, or worry about family events on Earth, that affects mood, sleep or concentration during a long mission.","indicator_rules":[{"indicator":"emotion_sad_pct","op":">","threshold":30,"ref":"baseline_pct","weight":10,"note":"More sad-classified expressions than personal baseline; classifier output, not a mood measure; no validated absolute threshold; baseline-relative design value."},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":8,"note":"Composite wellbeing index more than 15% below baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"affect_variability","op":"<","threshold":-15,"ref":"baseline_pct","weight":7,"note":"Reduced facial expressivity vs baseline; expression is culture- and person-dependent and cannot indicate mood alone; no validated absolute threshold; baseline-relative design value."},{"indicator":"emotion_happy_pct","op":"<","threshold":-25,"ref":"baseline_pct","weight":5,"note":"Fewer positive expressions than personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_homesick","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Separation from family is a reported cause of depressive reactions in orbit (Kanas 2016; local CNS file)."},{"indicator":"q_homesick","op":">=","threshold":3,"ref":"absolute","weight":10,"note":"Homesickness nearly every day."},{"indicator":"q_lonely","op":">=","threshold":1,"ref":"absolute","weight":8,"note":"Felt isolation (Hughes 2004)."},{"indicator":"q_mood_low","op":">=","threshold":1,"ref":"absolute","weight":7,"note":"PHQ-2 item (0-3); PHQ-2 total >=3 is the validated screening cut-point (Kroenke 2003: sensitivity 82.9%, specificity 90.0% for major depression)."},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Sleep disruption with worry."},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Distraction by family concerns."},{"indicator":"q_worry","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"GAD-2 item (0-3); GAD-2 total >=3 is the preferred cut-point (Kroenke 2007: sensitivity 86%, specificity 83% for GAD)."}],"questionnaire_triggers":["q_homesick>=2","q_homesick>=3","q_lonely>=1","q_mood_low>=1","q_sleep_quality>=2","q_concentration>=2","q_worry>=2"],"probable_causes":["Long separation from partner, children or parents","Family events or emergencies on Earth","Missed milestones (birthdays, holidays)","Reduced or delayed communication with home"],"isolation_relevance":"Clinical depression secondary to isolation and separation from family has been reported in orbit (local CNS file; Kanas 2016). The only mission-affecting behavioral event across 41 ISS expeditions was the unexpected death of a parent (HRP evidence report). Real-time family video conferences may not be available on longer missions.","orientative_interpretation":"Your answers suggest that missing home or concern about family has been frequent recently. This may indicate homesickness, a very normal response to long separation. Planned family contact, sharing messages and talking with a trusted crewmate may help.","countermeasure_ids":["cm_family_conference","cm_expressive_writing","cm_peer_support_checkin","cm_gratitude_journal","cm_mission_milestones","cm_bhp_consult"],"escalation_criteria":"If the safety item is answered yes at any time, the app's safety protocol takes priority over this orientation. Contact the behavioral health team promptly after any serious family event on Earth, or if homesickness is accompanied by low mood (PHQ-2 total of 3 or more), insomnia or reduced performance.","red_flags":["Family emergency or bereavement","Homesickness with depressive symptoms","Persistent insomnia","Thoughts of self-harm (safety protocol)"],"camera_limits":"Sad-classified expressions cannot reveal their cause; the camera cannot detect homesickness. Only the questionnaire can support this pattern.","sources":[{"title":"Kanas N. Psychiatric Issues in Space. Psychiatric Times 33(6)","url":"https://www.psychiatrictimes.com/view/psychiatric-issues-space","year":2016},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"Hughes ME, Waite LJ, Hawkley LC, Cacioppo JT. A Short Scale for Measuring Loneliness in Large Surveys. Research on Aging 2004;26(6):655-672","url":"https://meps.ipums.org/meps/resources/Hughes_et_al2004.pdf","year":2004},{"title":"Kroenke K, Spitzer RL, Williams JB. The Patient Health Questionnaire-2: validity of a two-item depression screener. Med Care 2003;41:1284-92","url":"https://www.hiv.uw.edu/page/mental-health-screening/phq-2","year":2003}]},{"id":"space_asthenia","name":"Pattern consistent with asthenia (space neurasthenia)","category":"psychological","summary":"A condition described by Russian space medicine involving fatigue, irritability, emotional lability, difficulty concentrating, sleep and appetite problems and sometimes palpitations, developing over long missions.","indicator_rules":[{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":15,"note":"Composite fatigue index above personal baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"hr_bpm","op":">","threshold":10,"ref":"baseline_pct","weight":6,"note":"Heart rate above personal baseline may reflect palpitations or autonomic instability (MedlinePlus Stress); no validated absolute threshold; baseline-relative design value."},{"indicator":"rmssd_ms","op":"<","threshold":-15,"ref":"baseline_pct","weight":6,"note":"RMSSD more than 15% below baseline; stress is associated with reduced parasympathetic (vagal) HRV (Kim 2018 meta-analysis); no validated absolute threshold; baseline-relative design value."},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":8,"note":"Composite wellbeing index more than 15% below baseline; no validated absolute threshold; baseline-relative design value."},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Tiredness and quick loss of strength are core asthenia features (HRP evidence report)."},{"indicator":"q_irritability","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Irritability and unstable mood (HRP evidence report; Kanas 2016)."},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Difficulty with attention and concentration (local CNS file)."},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":8,"note":"Sleep disturbance (HRP evidence report)."},{"indicator":"q_appetite_change","op":">=","threshold":2,"ref":"absolute","weight":6,"note":"Appetite problems (local CNS file; Kanas 2016)."},{"indicator":"q_mission_phase","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Cosmonaut data suggest asthenia is unlikely in flights shorter than 4 months (HRP evidence report)."},{"indicator":"q_mood_low","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Low or labile mood."},{"indicator":"q_headache","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Physical complaints."},{"indicator":"q_nervous","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Increased sensitivity and nervousness (low sensation threshold)."}],"questionnaire_triggers":["q_low_energy>=2","q_irritability>=2","q_concentration>=2","q_sleep_quality>=2","q_appetite_change>=2","q_mission_phase>=2","q_mood_low>=1","q_headache>=2","q_nervous>=1"],"probable_causes":["Cumulative stress of a long mission","Chronic sleep disruption","Monotony and workload","Physiological deconditioning","Medical causes to rule out (anemia, thyroid, infection)"],"isolation_relevance":"Russian medical personnel regard asthenia (neurasthenia) as one of the largest threats to cosmonauts' emotional well-being, although NASA flight surgeons have not seen the full cluster in any astronaut and the concept is not recognized in the DSM (HRP evidence report). Increased family contact and surprise supplies have been used as countermeasures (Kanas 2016).","orientative_interpretation":"Your answers suggest a combination of fatigue, irritability, poor concentration and sleep or appetite changes, and your signals may show more strain than your baseline. This combination may indicate the pattern described as asthenia in long missions. It is worth discussing with your flight surgeon, who can also check for physical causes.","countermeasure_ids":["cm_workload_rebalance","cm_sleep_schedule_anchor","cm_family_conference","cm_novelty_variety","cm_aerobic_session","cm_flight_surgeon_review","cm_lab_panel_request","cm_bhp_consult"],"escalation_criteria":"If the safety item is answered yes at any time, the app's safety protocol takes priority over this orientation. Refer to the flight surgeon if the fatigue cluster persists for 2 weeks or more, worsens, or comes with palpitations, weight change or low mood, so that medical causes can be checked and the behavioral health team involved.","red_flags":["Palpitations or dizziness","Marked weight or appetite change","Progressive exhaustion","Low mood with hopelessness"],"camera_limits":"Asthenia is a cluster of reported experiences; fatigue and heart-rate signals on camera are non-specific and also reflect sleep loss, deconditioning, anemia or illness.","sources":[{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"Kanas N. Psychiatric Issues in Space. Psychiatric Times 33(6)","url":"https://www.psychiatrictimes.com/view/psychiatric-issues-space","year":2016},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}]},{"id":"fluid_shift_effects","name":"Pattern consistent with headward fluid shift effects (head fullness, nasal congestion)","category":"physiological","summary":"In weightlessness roughly 2 L of fluid moves toward the head within the first hours, producing facial puffiness, sinonasal congestion and headache that can disturb sleep and concentration and be mistaken for low mood or fatigue.","indicator_rules":[{"indicator":"q_congestion","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Nasal congestion reported by 75% of ISS astronauts; fluid shift is the main driver (Ax 2025; Khan/TAMU 2025)"},{"indicator":"q_headache","op":">=","threshold":1,"ref":"absolute","weight":20,"note":"Congestion plus cabin CO2 may contribute to frequent in-flight headaches (Ax 2025; OCHMO-TB-004)"},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Sinonasal symptoms disrupt sleep (Khan/TAMU 2025)"},{"indicator":"q_low_energy","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Fatigue reported with sinonasal issues (Khan/TAMU 2025)"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Impaired decision-making and productivity when unaddressed (Khan/TAMU 2025)"},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":10,"note":"Non-specific fatigue signal; no validated absolute threshold"},{"indicator":"q_mission_phase","op":"<=","threshold":1,"ref":
