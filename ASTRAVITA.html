        ...Object.fromEntries(Object.entries(P.em).map(([k, v]) => [k, rnd(clamp(v + n(2.5), 0, 100), 1)]))});
    }
    const col = k => minutes.map(x => x[k]).filter(U.fin);
    const feat = {};
    for (const k of AN.FEATURE_KEYS) { const c = col(k); feat[k] = c.length ? rnd(U.mean(c), 1) : null; }
    Object.assign(feat, {yawn_per_10min: rnd(Math.max(0, f.yawn_per_10min), 2), affect_variability: rnd(clamp(f.affect_variability, 0, 100), 1), local_hour: start.d.getHours(), long_closures: f.perclos_pct > 15 ? Math.round(R() * 3) : 0, microexpr_events: Math.round(f.microexpr_min * durMin), duration_s: durMin * 60 + Math.round(R() * 50), quality_pct: lowSig ? Math.round(30 + R() * 15) : Math.round(88 + R() * 10)});
    const end = new Date(start.d.getTime() + feat.duration_s * 1000);
    return {id: U.uid(), subject_id: subjectId, start: start.d.toISOString(), end: end.toISOString(), duration_s: feat.duration_s, source: 'demo', simulated: true, features: feat, minutes, questionnaire: withQ ? P.q : null, quality_pct: feat.quality_pct,
      micro_events: [], counts: {micro: feat.microexpr_events, yawns: Math.round(feat.yawn_per_10min * durMin / 10), long_closures: feat.long_closures}, app_version: ASTRAVITA.version};
  }

  function history(kind, subjectId, seed) {
    const R = U.prng(seed), out = [], now = new Date(), w0 = U.addDays(U.startOfWeek(now), -7 * 7);
    for (let w = 0; w < 8; w++) {
      const days = [0, 1, 2, 3, 4, 5, 6].filter(() => R() < 0.7);
      for (const d of days) {
        const P0 = profile(kind, 0, R);
        const day = U.addDays(w0, w * 7 + d); const hour = clamp(Math.round(P0.f.hour), 0, 23);
        day.setHours(hour, Math.floor(R() * 60), 0, 0);
        if (day > new Date(now.getTime() - 20 * 60000)) continue;
        const p = (day - w0) / (now - w0);
        out.push(buildSession(kind, {d: day, p}, 6 + Math.floor(R() * 8), R, subjectId, R() < 0.55 || out.length % 3 === 0 || p > 0.93));
      }
    }
    out.sort((a, b) => Date.parse(a.start) - Date.parse(b.start));
    // calibration baseline from the first week, then engine results with a rolling personal baseline
    const first = out.slice(0, 3), m = k => rnd(U.mean(first.map(s => s.features[k]).filter(U.fin)), 1);
    const calibration = {calibrated_at: first[0]?.start, source: 'demo', hr_bpm: m('hr_bpm'), rmssd_ms: m('rmssd_ms'), rr_rpm: m('rr_rpm'), blink_rate_min: m('blink_rate_min'), perclos_pct: m('perclos_pct'), facial_tension: m('facial_tension'), head_stability_pct: m('head_stability_pct'), emo_base: null, au_base: null};
    for (const s of out) {
      const base = AN.personalBaseline(out.filter(x => Date.parse(x.start) < Date.parse(s.start)), calibration, s.start);
      s.result = E.evaluate({f: s.features, q: s.questionnaire, base});
      s.summary = s.result.summary;
      s.baseline_used = base ? {kind: base.kind, hr_bpm: base.hr_bpm, rmssd_ms: base.rmssd_ms, rr_rpm: base.rr_rpm, blink_rate_min: base.blink_rate_min, perclos_pct: base.perclos_pct, facial_tension: base.facial_tension, head_stability_pct: base.head_stability_pct, microexpr_min: base.microexpr_min, wellbeing_index: base.wellbeing_index, stress_index: base.stress_index} : null;
    }
    return {sessions: out, calibration};
  }

  const NOTES = {
    stress: [{text: 'Your heart rate and facial tension have been trending up over the last two weeks, mostly in afternoon sessions. Let us talk at the next private medical conference. Try the slow-breathing exercise before the evening EVA review.', days: 3}, {text: 'Thanks for completing the questionnaire. Workload is noted; I asked the mission planner to look at your schedule.', days: 1}],
    fatigue: [{text: 'Your sessions late in the evening show more eye closure and yawning. Please keep a consistent sleep window this week and avoid caffeine after 14:00 station time.', days: 4}],
    recovery: [{text: 'Good progress over the last three weeks. Keep the morning light routine and the weekly family call.', days: 2}],
    isolation: [{text: 'I would like to schedule an extra private family conference this week. Would Thursday work for you?', days: 2}],
    lowsignal: [{text: 'Most of your recent sessions had low signal quality. Try facing the cabin light and keeping your head still during the first two minutes.', days: 5}],
    stable: [{text: 'All indicators are steady. Nothing to change; keep your current routine.', days: 6}]
  };
  const PRIVATE = {stress: 'Watch for sleep impact; consider BHP consult if questionnaire GAD-2 stays >= 3 next week.', isolation: 'Third-quarter timing. Coordinate with BHP team; low expressivity trend over 5 weeks.', fatigue: 'Check schedule shifts with ops before suggesting nap protocol.'};
  const CMS = {stress: ['cm_paced_breathing_6', 'cm_workload_rebalance'], fatigue: ['cm_sleep_schedule_anchor', 'cm_caffeine_timing'], isolation: ['cm_family_conference', 'cm_crew_social_meal'], recovery: ['cm_bright_light_morning'], lowsignal: [], stable: []};

  async function writeVault(ctx) { await S.kv.set('vault:' + ctx.user.user_id, await S.encryptJSON(ctx.vaultKey, ctx.vault)); }

  async function seeded() { const m = await S.kv.get('demo-meta'); return !!m && m.version === VERSION; }
  async function clear() {
    const reg = await S.registry(), L = await S.links();
    const ids = Object.values(reg.users).filter(u => u.demo).map(u => u.user_id);
    for (const l of Object.values(L.links)) if (ids.includes(l.patient_id) || ids.includes(l.doctor_id) || l.demo) { await S.kv.del('share:' + l.link_id); await S.kv.del('care:' + l.link_id); delete L.links[l.link_id]; }
    await S.saveLinks(L);
    for (const id of ids) { await S.kv.del('vault:' + id); for (const k of await S.kv.keys('samples:' + id + ':')) await S.kv.del(k); delete reg.users[id]; }
    await S.saveRegistry(reg); await S.kv.del('demo-meta');
  }
  async function seed(progress = () => {}) {
    await clear();
    progress(0.05, 'Creating the flight surgeon account');
    const doc = await A.register({...DOCTOR, mission: MISSION, demo: true});
    const crewCtx = [];
    for (let i = 0; i < CREW.length; i++) {
      progress(0.1 + i * 0.12, `Creating ${CREW[i].name}`);
      const c = await A.register({email: CREW[i].email, password: CREW_PASSWORD, name: CREW[i].name, title: CREW[i].title, mission: MISSION, role: 'patient', demo: true});
      const hist = history(CREW[i].profile, c.entry.pseudo_id, 1000 + i * 7919);
      c.vault.sessions = hist.sessions; c.vault.baseline = hist.calibration; c.vault.consent = {at: hist.sessions[0]?.start, version: 1};
      c.vault.alerts = hist.sessions.flatMap(s => ASTRAVITA.data.alertsFor(s)).slice(-300);
      await writeVault(c); crewCtx.push({c, def: CREW[i]});
    }
    progress(0.85, 'Linking crew members and writing notes');
    const L = await S.links();
    for (const {c, def} of crewCtx) {
      const link = {link_id: U.uid(), doctor_id: doc.user_id, patient_id: c.user_id, doctor_name: DOCTOR.name, doctor_title: DOCTOR.title, doctor_pseudo: doc.entry.pseudo_id, status: 'accepted', created_at: U.addDays(new Date(), -56).toISOString(), updated_at: U.addDays(new Date(), -55).toISOString(), demo: true};
      L.links[link.link_id] = link; await S.saveLinks(L);
      await LK.publishShareAs(c, link);
      const notes = (NOTES[def.profile] || []).map(n => ({id: U.uid(), text: n.text, created_at: U.addDays(new Date(), -n.days).toISOString(), updated_at: null, author: DOCTOR.name}));
      const cms = (CMS[def.profile] || []).map((id, k) => ({id: U.uid(), cm_id: id, assigned_at: U.addDays(new Date(), -2 - k).toISOString(), note: '', author: DOCTOR.name}));
      const reviews = {}; c.vault.alerts.slice(0, -2).forEach(a => { reviews[a.id] = {status: 'reviewed', at: a.at, note: ''}; });
      await LK.writeCareAs(doc, link, {notes, countermeasures: cms, alert_reviews: reviews});
      if (PRIVATE[def.profile]) doc.vault.private_notes[c.user_id] = [{id: U.uid(), text: PRIVATE[def.profile], created_at: U.addDays(new Date(), -1).toISOString(), private: true}];
    }
    await writeVault(doc);
    await S.kv.set('demo-meta', {version: VERSION, seeded_at: new Date().toISOString()});
    progress(1, 'Demo data ready');
  }
  return {accounts, seed, seeded, clear, VERSION, MISSION, CREW, DOCTOR, CREW_PASSWORD, profile, history};
})();

/* =====================================================================
   ASTRAVITA.ui — app shell, hash router with role guards, shared components
   ===================================================================== */
ASTRAVITA.ui = (() => {
  const U = ASTRAVITA.util, {esc, $} = U, {icon} = ASTRAVITA.icons, A = ASTRAVITA.auth, N = ASTRAVITA.notify;
  const LOGO = () => document.getElementById('logo-src').getAttribute('src');
  const views = {};
  let renderToken = 0, cleanup = null;

  const NAV = {
    patient: [
      {group: 'Monitoring'},
      {href: '#/patient/dashboard', label: 'Dashboard', icon: 'grid', short: 'Home'},
      {href: '#/patient/monitor', label: 'Monitoring center', icon: 'activity', short: 'Monitor'},
      {href: '#/patient/results', label: 'Results & guidance', icon: 'trend', short: 'Results'},
      {href: '#/patient/history', label: 'History & logbook', icon: 'clock', short: 'History'},
      {group: 'Care'},
      {href: '#/patient/care', label: 'Care team & notes', icon: 'steth', short: 'Care', badge: 'care'},
      {href: '#/knowledge', label: 'Knowledge base', icon: 'book', short: 'Library', hideMobile: true},
      {href: '#/patient/settings', label: 'Settings & privacy', icon: 'sliders', short: 'Settings', hideMobile: true}
    ],
    doctor: [
      {group: 'Supervision'},
      {href: '#/doctor/console', label: 'Crew triage', icon: 'users', short: 'Crew'},
      {href: '#/doctor/alerts', label: 'Alert inbox', icon: 'bell', short: 'Alerts', badge: 'alerts'},
      {href: '#/doctor/add', label: 'Add crew member', icon: 'link', short: 'Add'},
      {group: 'Reference'},
      {href: '#/knowledge', label: 'Knowledge base', icon: 'book', short: 'Library'},
      {href: '#/doctor/settings', label: 'Settings & privacy', icon: 'sliders', short: 'Settings', hideMobile: true}
    ]
  };
  const badges = {care: 0, alerts: 0};
  function setBadge(k, n) { badges[k] = n; document.querySelectorAll(`[data-badge="${k}"]`).forEach(b => { b.textContent = n; b.hidden = !n; b.setAttribute('aria-label', `${n} new`); }); }

  /* ---------- shell ---------- */
  function shell(inner, {nav = true} = {}) {
    const c = A.current(), role = c?.user.role, demo = !!c?.user.demo;
    const p = c?.vault.profile;
    document.documentElement.style.setProperty('--banner-h', demo ? '33px' : '0px');
    const items = role ? NAV[role] : [];
    const here = location.hash.split('?')[0];
    const isCur = h => here === h || (h !== '#/knowledge' && here.startsWith(h + '/')) || (h === '#/doctor/console' && here.startsWith('#/doctor/patient/'));
    const side = items.map(i => i.group ? `<div class="group">${esc(i.group)}</div>` : `<a class="navlink" href="${i.href}" ${isCur(i.href) ? 'aria-current="page"' : ''}>${icon(i.icon)}<span>${esc(i.label)}</span>${i.badge ? `<span class="badge-n" data-badge="${i.badge}" ${badges[i.badge] ? '' : 'hidden'}>${badges[i.badge]}</span>` : ''}</a>`).join('');
    const bottom = items.filter(i => !i.group && !i.hideMobile).map(i => `<a href="${i.href}" ${isCur(i.href) ? 'aria-current="page"' : ''}>${icon(i.icon)}<span>${esc(i.short)}</span>${i.badge ? `<span class="badge-n" data-badge="${i.badge}" ${badges[i.badge] ? '' : 'hidden'}>${badges[i.badge]}</span>` : ''}</a>`).join('');
    return `
      ${demo ? '<div class="banner" role="note"><span class="dot"></span>Simulated data — demonstration account<span class="hide-sm">&nbsp;| Exploratory orientation, not a clinical diagnosis</span></div>' : ''}
      <header class="app-header"><div class="inner">
        <a class="brand" href="${role ? '#/' + role + (role === 'doctor' ? '/console' : '/dashboard') : '#/cover'}" aria-label="ASTRAVITA home"><img src="${LOGO()}" alt="" width="100" height="32"><span class="wm"><b>ASTRAVITA</b><span>Behavioral health telemetry</span></span></a>
        ${role ? `<span class="role-tag hide-sm">${role === 'doctor' ? 'Flight surgeon console' : 'Crew member'}</span>` : ''}
        <div class="header-spacer"></div>
        ${c ? `<button class="user-pill" type="button" popovertarget="user-menu" aria-label="Account menu for ${esc(p.display_name)}"><span class="who"><b>${esc(p.display_name)}</b><span>${esc(p.title || (role === 'doctor' ? 'Flight surgeon' : 'Crew member'))} · ${esc(c.user.pseudo_id)}</span></span><span class="avatar" aria-hidden="true">${esc(U.initials(p.display_name))}</span></button>
        <nav id="user-menu" class="menu" popover aria-label="Account">
          <a href="#/${role}/settings">${icon('sliders')}Settings & privacy</a>
          <a href="#/knowledge">${icon('book')}Knowledge base</a>
          <button type="button" data-act="signout">${icon('logout')}Sign out</button>
        </nav>` : ''}
      </div></header>
      <div class="shell ${nav && role ? '' : 'no-nav'}">
        ${nav && role ? `<nav class="sidenav" aria-label="Main">${side}<div class="status-box"><div class="row between"><span class="eyebrow">Privacy</span><span class="chip ok">${icon('lock', 's16')}Encrypted</span></div><p class="small muted" style="margin-top:6px">Video never leaves this device. Your data is encrypted with a key derived from your password.</p></div></nav>` : ''}
        <main class="main" id="view" tabindex="-1">${inner}</main>
      </div>
      ${nav && role ? `<nav class="bottomnav" aria-label="Main (compact)">${bottom}</nav>` : ''}
      <footer class="app-footer"><div class="inner"><span>${icon('info', 's16')} ASTRAVITA provides an exploratory orientation, <b>not a clinical diagnosis</b>. Optical rPPG, HRV and expression estimates are experimental.</span><span class="mono">ASTRAVITA v${ASTRAVITA.version} · local engine · no data sent to servers</span></div></footer>`;
  }
  function positionMenu() {
    const btn = document.querySelector('.user-pill'), m = document.getElementById('user-menu');
    if (!btn || !m) return;
    m.addEventListener('toggle', e => { if (e.newState === 'open') { const r = btn.getBoundingClientRect(); m.style.top = (r.bottom + 6) + 'px'; m.style.left = Math.max(8, r.right - 240) + 'px'; m.style.width = '240px'; } });
  }

  /* ---------- router ---------- */
  function parse() {
    const raw = location.hash.replace(/^#/, '') || '/cover';
    const [path, qs] = raw.split('?');
    const parts = path.split('/').filter(Boolean);
    return {path: '/' + parts.join('/'), parts, query: new URLSearchParams(qs || '')};
  }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  function home() { const c = A.current(); return c ? (c.user.role === 'doctor' ? '#/doctor/console' : '#/patient/dashboard') : '#/cover'; }

  async function render() {
    const token = ++renderToken;
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    const r = parse(), c = A.current(), root = document.getElementById('app');
    // session expiry
    if (c && A.expired()) { A.signOut(); N.toast('Your session expired after 30 minutes of inactivity. Please sign in again.', 'warn', 7000); return go('#/auth'); }
    if (!c && A.pendingSession() && r.parts[0] !== 'cover') return views.lock(root, r);
    const area = r.parts[0];
    if (['patient', 'doctor'].includes(area)) {
      if (!c) { sessionStorage.setItem('astravita:after-login', location.hash); return go('#/auth'); }
      if (c.user.role !== area) { N.toast(area === 'doctor' ? 'That area is only available to flight surgeons.' : 'That area is only available to crew members.', 'warn'); return go(home()); }
    }
    if (area === 'knowledge' && !c) return go('#/auth');
    if ((area === 'auth' || area === 'cover') && c) return go(home());
    const key = area === 'patient' || area === 'doctor' ? `${area}/${r.parts[1] || ''}` : area;
    const own = k => Object.hasOwn(views, k) ? views[k] : null;
    const view = own(key) || (area === 'patient' ? views['patient/dashboard'] : area === 'doctor' ? views['doctor/console'] : null);
    if (!view) return go(home());
    const swap = async () => {
      if (token !== renderToken) return;
      const res = await view(root, r);
      if (token !== renderToken) { if (typeof res === 'function') res(); return; }
      cleanup = typeof res === 'function' ? res : null;
      positionMenu();
      root.querySelector('[data-act="signout"]')?.addEventListener('click', signOut);
      const f = document.getElementById('view'); if (f && document.activeElement === document.body) f.focus({preventScroll: true});
      A.touch();
    };
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // no transition while a modal dialog is open: the transition snapshot would cover it (e.g. the support dialog)
    if (document.startViewTransition && !reduce && root.dataset.ready && !document.querySelector('dialog[open]')) {
      // a skipped or timed-out transition is harmless: swallow its promise rejections
      const vt = document.startViewTransition(swap);
      vt.ready.catch(() => {}); vt.finished.catch(() => {});
      try { await vt.updateCallbackDone; } catch (e) { console.error('[ASTRAVITA] view failed', e); }
    }
    else await swap();
    root.dataset.ready = '1';
    window.scrollTo({top: 0});
  }
  async function signOut() {
    if (ASTRAVITA.live.running) { const ok = await N.confirm({title: 'End the monitoring session?', body: 'Signing out stops the camera. Unsaved session data will be lost.', ok: 'Sign out'}); if (!ok) return; ASTRAVITA.live.stop(true); }
    A.signOut(); N.toast('You have signed out. Your data stays encrypted on this device.', 'ok'); go('#/cover');
  }

  /* ---------- shared components ---------- */
  const STATUS = {nominal: ['ok', 'Nominal', 'check'], watch: ['warn', 'Observation', 'eye'], alert: ['bad', 'Alert', 'alert'], none: ['', 'No data', 'info'], insufficient: ['warn', 'Low signal', 'info']};
  const statusChip = s => { const [cls, txt, ic] = STATUS[s] || STATUS.none; return `<span class="chip ${cls}">${icon(ic)}${txt}</span>`; };
  const bandChip = b => b === 'strong' ? `<span class="chip bad">${icon('alert')}Strong pattern</span>` : b === 'notable' ? `<span class="chip warn">${icon('eye')}Notable</span>` : `<span class="chip tele">${icon('info')}Worth watching</span>`;
  const confChip = (label, v) => `<span class="chip ${label === 'high' ? 'ok' : label === 'medium' ? 'tele' : ''}">Confidence: ${esc(label)} (${v}%)</span>`;
  const empty = (ic, title, text, action = '') => `<div class="empty">${icon(ic)}<b>${esc(title)}</b><p class="small">${esc(text)}</p>${action}</div>`;
  const disclaimer = () => `<div class="notice tele" role="note">${icon('shield')}<div><strong>Exploratory orientation, not a clinical diagnosis.</strong> ASTRAVITA compares camera-based estimates and your answers with a preloaded knowledge base. It can miss things and can be wrong. Discuss anything that worries you with your flight surgeon.</div></div>`;
  function metricTile({key, label, value, unit, note = '', state = '', dec = 0, chip = ''}) {
    return `<article class="metric" data-k="${key}" data-s="${state}"><div class="m-top"><span class="m-lbl">${esc(label)}</span>${chip}</div><div class="m-val"><span class="v" data-v>${U.fin(value) ? U.fmt(value, dec) : '—'}</span><span class="u">${esc(unit)}</span></div><p class="m-note" data-note>${esc(note)}</p></article>`;
  }
  function download(name, text, type = 'text/csv;charset=utf-8') {
    const blob = new Blob([type.startsWith('text/csv') ? '﻿' + text : text], {type});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function print(html, title) {
    const p = document.getElementById('print-area'); p.innerHTML = html;
    const t = document.title; document.title = title;
    const clear = () => { p.innerHTML = ''; document.title = t; removeEventListener('afterprint', clear); };
    addEventListener('afterprint', clear); window.print();
  }
  return {views, shell, render, go, home, parse, statusChip, bandChip, confChip, empty, disclaimer, metricTile, download, print, setBadge, signOut, LOGO};
})();

/* =====================================================================
   ASTRAVITA.render — shared result, chart, history, questionnaire and
   support-protocol components (used by crew member and flight surgeon views)
   ===================================================================== */
ASTRAVITA.render = (() => {
  const U = ASTRAVITA.util, {esc, fin, $, $$} = U, {icon} = ASTRAVITA.icons, UI = ASTRAVITA.ui, KB = ASTRAVITA.kb, CH = ASTRAVITA.charts, AN = ASTRAVITA.analysis, P = CH.PALETTE;
  const SRC_LABEL = {camera: 'Camera', file: 'Video file', demo: 'Demo script'};
  const srcChip = s => s.simulated ? `<span class="chip sim">${icon('flask')}Simulated data</span>` : `<span class="chip tele">${icon(s.source === 'file' ? 'video' : 'camera')}${esc(SRC_LABEL[s.source] || s.source)}</span>`;
  const statusOf = s => !s?.result ? 'none' : s.result.insufficient && !s.result.findings.length ? 'insufficient' : s.result.status;

  function sources(list) { return `<ul class="src-list">${(list || []).slice(0, 6).map(s => `<li>${esc(s.title)}${s.year ? ' (' + esc(s.year) + ')' : ''}${s.url && /^https?:/.test(s.url) ? ` — <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">link</a>` : s.url ? ' — local file' : ''}</li>`).join('')}</ul>`; }
  function cmCard(id, {extra = '', open = false, actions = ''} = {}) {
    const c = KB.countermeasure(id); if (!c) return '';
    return `<details class="cm" ${open ? 'open' : ''}><summary><span class="row" style="gap:8px">${icon(c.category === 'breathing' ? 'wind' : c.category === 'sleep' ? 'moon' : c.category === 'light' ? 'sun' : c.category === 'social' ? 'users' : c.category === 'exercise' ? 'activity' : c.category === 'medical' ? 'steth' : c.category === 'nutrition' ? 'pill' : 'check')}${esc(c.title)}</span><span class="chip">${esc(c.category)}</span></summary>
      ${extra}<ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol><p class="small muted" style="margin-top:8px">${esc(c.duration)} · evidence: ${esc(c.evidence_level)}</p>${actions}
      <details style="margin-top:6px"><summary class="small">Sources</summary>${sources(c.sources)}</details></details>`;
  }

  /* ---------- result panel ---------- */
  function resultPanel(s, {audience = 'patient'} = {}) {
    const r = s.result; if (!r) return UI.empty('info', 'No orientation yet', 'This session has no result.');
    const findings = r.findings || [];
    const head = r.safety ? `<div class="notice bad" role="alert">${icon('heart')}<div><strong>${audience === 'patient' ? 'You do not have to handle this alone.' : 'The crew member asked for support.'}</strong> ${audience === 'patient' ? 'Your answer suggests you may be going through something very hard. Please contact your flight surgeon or the behavioral health team now.' : 'They answered yes to the safety question. Please check in personally and calmly as soon as possible.'} ${audience === 'patient' ? '<button class="link-btn" type="button" data-act="support">See support options</button>' : ''}</div></div>` : '';
    const ins = r.insufficient ? `<div class="notice warn">${icon('alert')}<div><strong>Insufficient signal quality.</strong> Camera-based indicators were not used for this orientation (signal quality ${U.fmt(s.features?.signal_quality, 0)}/100, valid pulse in ${U.fmt(s.quality_pct, 0)} % of the session). ${findings.length ? 'The patterns below are based on the questionnaire only.' : ''} Try again facing a steady light, keeping still, for at least 2 minutes.</div></div>` : '';
    const none = !findings.length ? `<div class="notice ok">${icon('check')}<div><strong>${r.insufficient ? 'No orientation could be made from the camera.' : 'No significant findings.'}</strong> ${r.insufficient ? '' : 'Your indicators stayed close to your usual pattern. Keep your routine and check in again tomorrow.'}${!r.questionnaire_used ? ' Answering the short questionnaire makes the orientation more precise.' : ''}</div></div>` : '';
    const items = findings.map((f, i) => {
      const c = KB.condition(f.id) || {};
      const cms = (c.countermeasure_ids || []).slice(0, 4);
      return `<article class="finding" data-band="${f.band}" aria-labelledby="f-${esc(f.id)}">
        <div class="f-head"><div><h3 id="f-${esc(f.id)}">${esc(f.name)}</h3><p class="small muted" style="margin-top:4px">${esc(c.category?.replace('_', ' ') || '')} · based on ${esc(f.based_on)}${f.gated ? ' · non-specific' : ''}</p></div>
          <div class="row" style="gap:6px">${UI.bandChip(f.band)}${UI.confChip(f.confidence_label, f.confidence)}<span class="score" aria-label="Score ${f.score} out of 100">${f.score}<span class="small muted">/100</span></span></div></div>
        <p>${esc(c.orientative_interpretation || c.summary || '')}</p>
        <details ${i === 0 ? 'open' : ''}><summary>Why this was shown (indicator contributions)</summary>
          ${f.contributions.length ? CH.contributions(f.contributions) : '<p class="small muted">No indicator contributed.</p>'}
          <div class="table-wrap" style="margin-top:8px"><table class="data"><thead><tr><th>Indicator</th><th>Observed</th><th class="num">Points</th></tr></thead><tbody>${f.contributions.map(x => `<tr><td>${esc(x.label)}</td><td class="small">${esc(x.detail)}</td><td class="num">${U.fmt(x.points, 1)}</td></tr>`).join('')}</tbody></table></div>
          ${f.counterfactual?.length ? `<p class="small" style="margin-top:8px"><b>What would change this result:</b> ${f.counterfactual.map(x => `${esc(x.label)} (up to ${x.weight} points; now ${esc(x.detail)})`).join('; ')}.</p>` : ''}
          ${f.missing?.length ? `<p class="small muted"><b>Not available:</b> ${[...new Set(f.missing.map(m => m.label + ' — ' + m.reason))].slice(0, 6).map(esc).join('; ')}.</p>` : ''}
          <p class="small muted"><b>Camera limits:</b> ${esc(c.camera_limits || '')}</p></details>
        <div class="grid g-2"><div><b class="small">Probable causes</b><ul class="small" style="margin:6px 0 0;padding-left:18px">${(c.probable_causes || []).slice(0, 5).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
          <div class="notice ${f.band === 'strong' ? 'warn' : 'tele'}" style="align-self:start">${icon('steth')}<div><b>When to talk to your flight surgeon:</b> ${esc(c.escalation_criteria || 'If this continues or worries you.')}</div></div></div>
        ${cms.length ? `<div><b class="small">Suggested countermeasures</b><div class="cm-list" style="margin-top:8px">${cms.map((id, k) => cmCard(id, {open: i === 0 && k === 0})).join('')}</div></div>` : ''}
        <details><summary>Sources</summary>${sources(c.sources)}</details>
      </article>`;
    }).join('');
    return `<div class="stack">${head}${ins}${none}${items}${UI.disclaimer()}</div>`;
  }

  /* ---------- metrics vs baseline ---------- */
  function vsBaseline(s) {
    const f = s.features || {}, b = s.baseline_used || {};
    const tiles = [['hr_bpm', 'Heart rate', 'bpm', 0], ['rr_rpm', 'Breathing rate', '/min', 1], ['rmssd_ms', 'HRV (RMSSD)', 'ms', 0], ['perclos_pct', 'PERCLOS', '%', 1], ['blink_rate_min', 'Blink rate', '/min', 0], ['facial_tension', 'Facial tension', '/100', 0], ['head_stability_pct', 'Head stability', '%', 0], ['wellbeing_index', 'Wellbeing index', '/100', 0]];
    return `<div class="grid g-4">${tiles.map(([k, l, u, d]) => {
      const v = f[k], bv = b[k], dlt = fin(v) && fin(bv) && bv ? (v - bv) / Math.abs(bv) * 100 : null;
      return `<div class="kpi"><span class="eyebrow">${esc(l)}</span><span class="kv">${fin(v) ? U.fmt(v, d) : '—'} <span class="small muted">${u}</span></span><span class="kd ${!fin(dlt) ? 'flat' : Math.abs(dlt) < 5 ? 'flat' : dlt > 0 ? 'up' : 'down'}">${fin(dlt) ? `${U.sgn(dlt, 0)} % vs baseline (${U.fmt(bv, d)})` : 'no baseline yet'}</span></div>`;
    }).join('')}</div>`;
  }

  /* ---------- in-session evolution (minute by minute) ---------- */
  function sessionCharts(el, s) {
    const m = s.minutes || [], labels = m.map(x => `min ${x.minute + 1}`);
    const get = k => m.map(x => x[k]);
    el.innerHTML = `<div class="grid g-2"><div data-c="1"></div><div data-c="2"></div><div data-c="3"></div><div data-c="4"></div></div>`;
    const sum = (k, u) => { const v = get(k).filter(fin); return v.length ? `${ASTRAVITA.engine.label(k)} from ${U.fmt(Math.min(...v), 0)} to ${U.fmt(Math.max(...v), 0)} ${u}` : ''; };
    CH.render($('[data-c="1"]', el), {title: 'Heart and breathing rate by minute', summary: [sum('hr_bpm', 'bpm'), sum('rr_rpm', 'per minute')].filter(Boolean).join('; '), labels, series: [{name: 'Heart rate', unit: 'bpm', data: get('hr_bpm'), color: P.tele, dec: 0}, {name: 'Breathing rate', unit: '/min', data: get('rr_rpm'), color: P.primary, axis: 'y2', dash: true}], y: {label: 'bpm'}, empty: 'No valid pulse readings in this session.'});
    CH.render($('[data-c="2"]', el), {title: 'Stress, wellbeing and fatigue by minute', summary: [sum('stress_index', ''), sum('wellbeing_index', '')].join('; '), labels, series: [{name: 'Wellbeing index', data: get('wellbeing_index'), color: P.primary, dec: 0}, {name: 'Stress index', data: get('stress_index'), color: P.warn, dec: 0}, {name: 'Fatigue x20', data: get('fatigue_level').map(v => fin(v) ? v * 20 : null), color: P.violet, dash: true, dec: 0}], y: {min: 0, max: 100, label: '0-100'}});
    CH.render($('[data-c="3"]', el), {title: 'Eye closure and facial tension by minute', summary: [sum('perclos_pct', '%'), sum('facial_tension', '')].join('; '), labels, series: [{name: 'PERCLOS', unit: '%', data: get('perclos_pct'), color: P.violet, dec: 1}, {name: 'Facial tension', unit: '/100', data: get('facial_tension'), color: P.gold, axis: 'y2', dec: 0}], y: {min: 0, label: '%'}});
    CH.render($('[data-c="4"]', el), {title: 'Facial expressions by minute', summary: 'Share of each expression per minute', labels, series: [['neutral', P.slate], ['happy', P.primary], ['sad', P.tele], ['angry', P.bad], ['fear', P.violet], ['surprise', P.gold], ['disgust', P.warn]].map(([k, c]) => ({name: ASTRAVITA.live.EMO_LABEL[k], unit: '%', data: get('emotion_' + k + '_pct'), color: c, dec: 0, dash: k === 'neutral'})), y: {min: 0, max: 100, label: '%'}});
  }

  /* ---------- weekly summary ---------- */
  function weekly(el, sessions, {offset = 0, onOffset} = {}) {
    const W = AN.weekModel(sessions, offset), Pw = AN.weekModel(sessions, offset + 1), K = AN.weekKpis(W, Pw);
    const labels = W.days.map(d => U.dateLong(d.date));
    const delta = k => { if (!fin(k.v)) return '<span class="kd flat">no data</span>'; if (!fin(k.p)) return '<span class="kd flat">no previous week</span>'; const d = k.v - k.p, good = k.better === 'up' ? d > 0 : k.better === 'down' ? d < 0 : null; return `<span class="kd ${Math.abs(d) < 0.05 * (Math.abs(k.p) || 1) ? 'flat' : good ? 'down' : good === false ? 'up' : 'flat'}">${U.sgn(d, k.key === 'fatigue_level' ? 1 : 0)} vs previous week</span>`; };
    // 8-week accumulation
    const weeks = []; for (let i = 7; i >= 0; i--) { const M = AN.weekModel(sessions, offset + i); const v = M.days.map(d => d.wellbeing_index).filter(fin); weeks.push({label: U.dateShort(M.start), minutes: M.days.reduce((a, d) => a + d.minutes, 0), wb: v.length ? U.mean(v) : null}); }
    el.innerHTML = `<div class="row between" style="margin-bottom:12px"><b>${esc(U.dateShort(W.start))} – ${esc(U.dateShort(U.addDays(W.end, -1)))}</b><div class="row"><button class="btn sm" type="button" data-w="+1">${icon('back', 's16')}Previous week</button><button class="btn sm" type="button" data-w="-1" ${offset === 0 ? 'disabled' : ''}>Next week${icon('arrow', 's16')}</button></div></div>
      <div class="grid g-3" style="margin-bottom:16px">${K.map(k => `<div class="kpi"><span class="eyebrow">${esc(k.label)}</span><span class="kv">${fin(k.v) ? U.fmt(k.v, k.key === 'fatigue_level' ? 1 : 0) : '—'} <span class="small muted">${esc(k.unit)}</span></span>${delta(k)}</div>`).join('')}</div>
      <div class="grid g-2"><div data-c="w1"></div><div data-c="w2"></div><div data-c="w3"></div><div data-c="w4"></div></div>`;
    CH.render($('[data-c="w1"]', el), {title: 'Daily indices this week', summary: 'Daily average wellbeing, stress and fatigue', labels, series: [{name: 'Wellbeing', data: W.days.map(d => d.wellbeing_index), color: P.primary, dec: 0}, {name: 'Stress', data: W.days.map(d => d.stress_index), color: P.warn, dec: 0}, {name: 'Fatigue x20', data: W.days.map(d => fin(d.fatigue_level) ? d.fatigue_level * 20 : null), color: P.violet, dash: true, dec: 0}], y: {min: 0, max: 100}, empty: 'No sessions this week.'});
    CH.render($('[data-c="w2"]', el), {title: 'Daily vital signs this week', summary: 'Daily average heart rate, breathing rate and PERCLOS', labels, series: [{name: 'Heart rate', unit: 'bpm', data: W.days.map(d => d.hr_bpm), color: P.tele, dec: 0}, {name: 'Breathing rate', unit: '/min', data: W.days.map(d => d.rr_rpm), color: P.primary, dec: 1, axis: 'y2'}, {name: 'PERCLOS', unit: '%', data: W.days.map(d => d.perclos_pct), color: P.violet, dec: 1, axis: 'y2', dash: true}], empty: 'No vital-sign readings this week.'});
    CH.render($('[data-c="w3"]', el), {title: 'Minutes monitored per day', summary: `Total ${U.fmt(W.days.reduce((a, d) => a + d.minutes, 0), 0)} minutes this week`, labels, series: [{name: 'Minutes monitored', unit: 'min', data: W.days.map(d => d.minutes || null), color: P.primary, type: 'bar', dec: 0}], y: {min: 0}, empty: 'No sessions this week.'});
    CH.render($('[data-c="w4"]', el), {title: 'Last 8 weeks', summary: 'Minutes monitored and average wellbeing per week', labels: weeks.map(w => w.label), series: [{name: 'Minutes', unit: 'min', data: weeks.map(w => w.minutes || null), color: P.tele, type: 'bar', dec: 0}, {name: 'Avg wellbeing', unit: '/100', data: weeks.map(w => w.wb), color: P.primary, axis: 'y2', dec: 0}], y: {min: 0}, y2: {min: 0, max: 100}});
    $$('[data-w]', el).forEach(b => b.addEventListener('click', () => onOffset?.(Math.max(0, offset + Number(b.dataset.w)))));
  }

  /* ---------- history table ---------- */
  function historyTable(list, {link}) {
    if (!list.length) return UI.empty('clock', 'No sessions yet', 'Sessions appear here after you finish a monitoring session.');
    const total = list.reduce((a, s) => a + (s.duration_s || 0), 0);
    return `<p class="small muted" style="margin-bottom:8px"><b>${list.length}</b> ${list.length === 1 ? 'session' : 'sessions'} · total time monitored <b class="mono">${U.duration(total)}</b></p>
      <div class="table-wrap"><table class="data"><thead><tr><th scope="col">Date</th><th scope="col">Duration</th><th scope="col">Source</th><th scope="col">Quality</th><th scope="col">Status</th><th scope="col">Summary</th><th scope="col"><span class="sr-only">Open</span></th></tr></thead><tbody>
      ${list.map(s => `<tr><td>${esc(U.dateTime(s.start))}</td><td class="num">${esc(U.duration(s.duration_s))}</td><td>${srcChip(s)}</td><td class="num">${U.fmt(s.quality_pct, 0)} %</td><td>${UI.statusChip(statusOf(s))}</td><td class="small">${esc(s.summary || '')}</td><td><a class="btn sm" href="${link(s)}" aria-label="Open session from ${esc(U.dateTime(s.start))}">Open</a></td></tr>`).join('')}
      </tbody></table></div>`;
  }

  /* ---------- questionnaire dialog ---------- */
  function questionnaire(prev = null) {
    const Q = KB.get().questionnaire, core = ['q_mood_low', 'q_anhedonia', 'q_nervous', 'q_worry', 'q_sleep_quality', 'q_sleep_hours', 'q_sleepiness', 'q_lonely', 'q_workload'];
    const item = it => {
      const name = it.id, val = prev?.[name];
      if (it.type === 'number') return `<div class="field"><label for="qq-${name}">${esc(it.text)}</label><input class="input" id="qq-${name}" name="${name}" type="number" inputmode="decimal" min="${it.min ?? 0}" max="${it.max ?? 24}" step="0.5" value="${fin(val) ? val : ''}" style="max-width:160px"></div>`;
      return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="font-size:13px;font-weight:600;color:var(--slate);margin-bottom:6px">${esc(it.text)}</legend><div class="row" style="gap:6px">${(it.options || []).map(o => `<label class="chip" style="cursor:pointer;min-height:44px;text-transform:none;letter-spacing:0;font-weight:600;font-size:12px"><input type="radio" name="${name}" value="${o.value}" ${val === o.value ? 'checked' : ''} style="accent-color:var(--primary)"> ${esc(o.label)}</label>`).join('')}</div></fieldset>`;
    };
    return new Promise(res => {
      const d = document.createElement('dialog'); d.className = 'wide'; d.setAttribute('aria-labelledby', 'qq-title');
      const items = Q.items.filter(i => core.includes(i.id)), more = Q.items.filter(i => !core.includes(i.id));
      d.innerHTML = `<form method="dialog" id="qq-form"><div class="dlg-head"><div><h2 id="qq-title">Short check-in (optional)</h2><p class="small muted">${esc(Q.instructions || '')}</p></div><button class="icon-btn" value="skip" aria-label="Close without answering">${icon('x')}</button></div>
        <div class="dlg-body">${items.map(item).join('')}
          <details><summary class="link-btn" style="min-height:44px;display:flex;align-items:center">More questions (sleep, body, social, mission)</summary><div class="stack" style="margin-top:12px">${more.map(item).join('')}</div></details>
          <div class="notice tele">${icon('heart')}<div>${item(Q.safety_item)}<p class="small muted" style="margin-top:6px">If you answer yes, ASTRAVITA shows support options right away and, if you are linked to a flight surgeon, flags your session so they can check in with you.</p></div></div>
        </div>
        <div class="dlg-foot"><button class="btn" value="skip">Skip questionnaire</button><button class="btn primary" value="save" id="qq-save">Save answers</button></div></form>`;
      document.body.append(d);
      d.addEventListener('close', () => {
        if (d.returnValue !== 'save') { res(null); d.remove(); return; }
        const fd = new FormData($('#qq-form', d)), ans = {};
        for (const it of [...Q.items, Q.safety_item]) { const v = fd.get(it.id); if (v !== null && v !== '') { const n = Number(v); if (fin(n)) ans[it.id] = n; } }
        res(Object.keys(ans).length ? ans : null); d.remove();
      }, {once: true});
      d.showModal();
    });
  }

  /* ---------- support protocol (calm, never alarmist) ---------- */
  function support({doctor} = {}) {
    const d = document.createElement('dialog'); d.setAttribute('aria-labelledby', 'sp-title'); d.setAttribute('role', 'alertdialog');
    d.innerHTML = `<form method="dialog"><div class="dlg-head"><h2 id="sp-title">${icon('heart')} You do not have to go through this alone</h2></div>
      <div class="dlg-body">
        <p>Thank you for answering honestly. What you are feeling matters, and support is available right now.</p>
        <ol style="display:grid;gap:10px;padding-left:20px;margin:0">
          <li><b>Contact your flight surgeon or the behavioral health team now.</b> ${doctor ? `Your linked flight surgeon is <b>${esc(doctor)}</b>; your session has been flagged so they can check in with you.` : 'Use your mission’s private medical conference channel.'}</li>
          <li><b>Tell a crew member you trust</b> that you would like some company right now.</li>
          <li><b>If you are on Earth and in immediate danger,</b> call your local emergency number (911 in the United States and Costa Rica, 112 in the European Union). In the United States you can also call or text <b>988</b> (Suicide &amp; Crisis Lifeline). Elsewhere, find a local helpline at <a href="https://findahelpline.com" target="_blank" rel="noopener noreferrer">findahelpline.com</a>.</li>
        </ol>
        <p class="small muted">ASTRAVITA does not diagnose. This message appears whenever the safety question is answered with yes.</p>
      </div>
      <div class="dlg-foot"><button class="btn primary" value="ok">I understand</button></div></form>`;
    document.body.append(d); d.addEventListener('close', () => d.remove(), {once: true}); d.showModal();
  }

  /* ---------- printable report ---------- */
  function report(s, profile) {
    const f = s.features || {}, r = s.result || {};
    const rows = [['Heart rate', f.hr_bpm, 'bpm'], ['HRV (RMSSD)', f.rmssd_ms, 'ms'], ['Breathing rate', f.rr_rpm, '/min'], ['Blink rate', f.blink_rate_min, '/min'], ['PERCLOS', f.perclos_pct, '%'], ['Yawns', f.yawn_per_10min, 'per 10 min'], ['Facial tension', f.facial_tension, '/100'], ['Head stability', f.head_stability_pct, '%'], ['Micro-expressions', f.microexpr_min, '/min'], ['Wellbeing index', f.wellbeing_index, '/100'], ['Stress index', f.stress_index, '/100'], ['Signal quality', f.signal_quality, '/100']];
    return `<h1>ASTRAVITA — session report</h1><p>${esc(profile?.display_name || '')} (${esc(s.subject_id || '')}) · ${esc(U.dateTime(s.start))} · ${esc(U.duration(s.duration_s))} · ${s.simulated ? 'SIMULATED DATA' : esc(SRC_LABEL[s.source] || '')}</p>
      <p><b>Exploratory orientation, not a clinical diagnosis.</b></p><h2>Summary</h2><p>${esc(r.summary || '')}</p>
      <h2>Indicators</h2><table><tr><th>Indicator</th><th>Value</th></tr>${rows.map(([l, v, u]) => `<tr><td>${l}</td><td>${fin(v) ? U.fmt(v, 1) + ' ' + u : '—'}</td></tr>`).join('')}</table>
      <h2>Findings</h2>${(r.findings || []).length ? `<table><tr><th>Pattern</th><th>Score</th><th>Confidence</th><th>Based on</th></tr>${r.findings.map(x => `<tr><td>${esc(x.name)}</td><td>${x.score}/100</td><td>${esc(x.confidence_label)}</td><td>${esc(x.based_on)}</td></tr>`).join('')}</table>` : '<p>No significant findings.</p>'}`;
  }
  return {resultPanel, vsBaseline, sessionCharts, weekly, historyTable, questionnaire, support, cmCard, sources, srcChip, statusOf, report, SRC_LABEL};
})();

    async function consent() {
      if (v.consent) return true;

    function precheck() {

  async function cohort() {
    const links = await LK.forDoctor();
    const active = links.filter(l => l.status === 'accepted'), pending = links.filter(l => l.status === 'pending');
    // decrypt every linked crew member's share and care channel in parallel
    const crew = (await Promise.all(active.map(async l => {
      try {
        const [share, care] = await Promise.all([LK.readShare(l), LK.readCare(l)]); if (!share) return null;
        const sessions = [...(share.sessions || [])].sort((a, b) => Date.parse(b.start) - Date.parse(a.start));
        const last = sessions[0] || null;
        const alerts = (share.alerts || []).map(a => ({...a, review: care.alert_reviews?.[a.id] || null}));
        const open = alerts.filter(a => !a.review);
        const status = !last ? 'none' : open.some(a => a.severity === 'bad') || last.result?.status === 'alert' ? 'alert' : open.length || last.result?.status === 'watch' ? 'watch' : last.result?.insufficient ? 'lowsig' : 'nominal';
        return {link: l, share, care, sessions, last, alerts, open, status};
      } catch (e) { console.warn('[ASTRAVITA] share unreadable', e); return null; }
    }))).filter(Boolean);
    const order = {alert: 0, watch: 1, lowsig: 2, nominal: 3, none: 4};
    crew.sort((a, b) => order[a.status] - order[b.status] || a.share.profile.display_name.localeCompare(b.share.profile.display_name));
    UI.setBadge('alerts', crew.reduce((n, c) => n + c.open.length, 0));
    return {links, crew, pending};
  }

      ${sel ? `<section aria-labelledby="h-cur"><div class="page-head" style="margin-bottom:12px"><div><h2 id="h-cur">Indicators · ${esc(U.dateTime(sel.start))}</h2><p class="lead small">${esc(U.duration(sel.duration_s))} · quality ${U.fmt(sel.quality_pct, 0)} % · ${esc(R.SRC_LABEL[sel.source] || '')}</p></div><div class="actions"><label class="sr-only" for="pr-pick">Choose a session</label><select class="input" id="pr-pick" style="max-width:280px">${sessions.slice(0, 80).map(s => `<option value="${esc(s.id)}" ${s.id === sel.id ? 'selected' : ''}>${esc(U.dateTime(s.start))} · ${esc(s.result?.status || '')}</option>`).join('')}</select></div></div>${R.vsBaseline(sel)}</section>
      <section class="card"><div class="card-head"><div><h2>${icon('info')}Latest orientation</h2><p>${esc(sel.summary || '')}</p></div>${UI.statusChip(R.statusOf(sel))}</div>
        ${sel.questionnaire ? `<p class="small muted" style="margin-bottom:12px">Check-in: PHQ-2 ${(sel.questionnaire.q_mood_low ?? 0) + (sel.questionnaire.q_anhedonia ?? 0)}/6 · GAD-2 ${(sel.questionnaire.q_nervous ?? 0) + (sel.questionnaire.q_worry ?? 0)}/6 · sleep ${fin(sel.questionnaire.q_sleep_hours) ? U.fmt(sel.questionnaire.q_sleep_hours, 1) + ' h' : '—'} · KSS ${sel.questionnaire.q_sleepiness ?? '—'}</p>` : '<p class="small muted" style="margin-bottom:12px">No check-in answers for this session.</p>'}
        ${R.resultPanel(sel, {audience: 'doctor'})}</section>
      <section class="card"><div class="card-head"><h2>${icon('trend')}Evolution within the session</h2></div><div id="pr-session"></div></section>` : UI.empty('clock', 'No sessions yet', 'Sessions appear here once the crew member records them.')}
      <section class="card"><div class="card-head"><h2>${icon('grid')}Weekly summary</h2></div><div id="pr-week"></div></section>
      <div class="grid g-12">
        <section class="card span-7"><div class="card-head"><div><h2>${icon('note')}Notes</h2><p>Shared notes are visible to ${esc(p.display_name)}. Private notes are drafts only you can see.</p></div></div>
          <form id="pr-note" class="stack"><label class="sr-only" for="pr-note-t">New note</label><textarea class="input" id="pr-note-t" maxlength="2000" placeholder="Write a note for this crew member…" required></textarea>
            <div class="row between"><label class="check"><input type="checkbox" id="pr-note-priv"><span>Private note (only visible to me)</span></label><button class="btn primary" type="submit">${icon('plus')}Add note</button></div></form>
          <div class="stack" style="margin-top:14px">${allNotes.length ? allNotes.map(n => `<article class="note" data-private="${n.private}"><div class="n-meta">${n.private ? `<span class="chip">${icon('lock', 's16')}Private</span>` : `<span class="chip ok">${icon('users', 's16')}Shared</span>`}<span>${esc(U.dateTime(n.created_at))}${n.updated_at ? ' · edited' : ''}</span></div><p class="n-text">${esc(n.text)}</p><div class="row"><button class="btn sm" data-edit="${esc(n.id)}" data-priv="${n.private}">${icon('edit', 's16')}Edit</button><button class="btn sm" data-del="${esc(n.id)}" data-priv="${n.private}">${icon('trash', 's16')}Delete</button></div></article>`).join('') : UI.empty('note', 'No notes yet', 'Your notes for this crew member appear here.')}</div></section>
        <section class="card span-5"><div class="card-head"><div><h2>${icon('pill')}Countermeasure prescription</h2><p>Assigned countermeasures appear in the crew member’s Care team page.</p></div></div>
          <form id="pr-cm" class="stack"><div class="field"><label for="pr-cm-id">Countermeasure</label><select class="input" id="pr-cm-id">${['breathing', 'sleep', 'light', 'cognitive', 'social', 'schedule', 'exercise', 'nutrition', 'environment', 'medical'].map(cat => `<optgroup label="${esc(cat)}">${cmLib.filter(x => x.category === cat).map(x => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</optgroup>`).join('')}</select></div>
            <div class="field"><label for="pr-cm-note">Instruction (optional)</label><input class="input" id="pr-cm-note" maxlength="200" placeholder="e.g. Before the evening review, 10 min"></div><div><button class="btn primary" type="submit">${icon('plus')}Assign</button></div></form>
          <div class="stack" style="margin-top:14px">${care.countermeasures.length ? care.countermeasures.map(x => `<div class="note"><div class="row between"><b>${esc(KB.countermeasure(x.cm_id)?.title || x.cm_id)}</b><span class="chip ${share.cm_status?.[x.cm_id]?.status === 'done' ? 'ok' : share.cm_status?.[x.cm_id]?.status === 'started' ? 'tele' : ''}">${esc(share.cm_status?.[x.cm_id]?.status === 'done' ? 'Done' : share.cm_status?.[x.cm_id]?.status === 'started' ? 'In progress' : 'Not started')}</span></div><p class="small muted">Assigned ${esc(U.dateShort(x.assigned_at))}${x.note ? ' · ' + esc(x.note) : ''}</p><div><button class="btn sm" data-uncm="${esc(x.id)}">${icon('x', 's16')}Remove</button></div></div>`).join('') : UI.empty('pill', 'Nothing assigned yet', 'Pick a countermeasure from the library.')}</div>
          <div class="notice warn" style="margin-top:12px">${icon('info')}<div class="small">Suggestions come from rules for research use. Validate every prescription clinically.</div></div></section>
      </div>
      <section class="card"><div class="card-head"><h2>${icon('bell')}Alerts</h2><a class="btn sm" href="#/doctor/alerts">Open inbox</a></div>
        ${alerts.length ? `<div class="stack">${alerts.slice(0, 12).map(a => `<div class="alert-item" data-sev="${a.severity}" data-status="${a.review?.status || 'open'}"><div class="row between"><b>${esc(a.title)}</b><span class="chip ${a.review ? 'ok' : a.severity === 'bad' ? 'bad' : 'warn'}">${a.review ? esc(a.review.status) : 'Open'}</span></div><p class="small muted">${esc(U.dateTime(a.at))} · ${esc(a.detail)}</p></div>`).join('')}</div>` : UI.empty('bell', 'No alerts', 'No events for this crew member.')}</section>
      <section class="card"><div class="card-head"><h2>${icon('clock')}Session history</h2></div>${R.historyTable(sessions, {link: s => `#/doctor/patient/${link.link_id}?s=${s.id}`})}</section>`);
    $('#pr-pick', root)?.addEventListener('change', e => UI.go(`#/doctor/patient/${link.link_id}?s=${e.target.value}`));
    if (sel) R.sessionCharts($('#pr-session', root), sel);
    let off = 0; const wk = () => R.weekly($('#pr-week', root), sessions, {offset: off, onOffset: o => { off = o; wk(); }}); wk();
    const saveCare = async () => { await LK.writeCare(link, care); };
    const savePriv = async list => { c.vault.private_notes = {...(c.vault.private_notes || {}), [link.patient_id]: list}; await A.saveVault(); };
    $('#pr-note', root).addEventListener('submit', async e => {
      e.preventDefault(); const t = $('#pr-note-t', root).value.trim(); if (!t) return N.toast('Write the note first.', 'warn');
      const n = {id: U.uid(), text: t, created_at: new Date().toISOString(), updated_at: null, author: c.vault.profile.display_name};
      if ($('#pr-note-priv', root).checked) await savePriv([...priv, {...n, private: true}]); else { care.notes = [...care.notes, n]; await saveCare(); }
      N.toast($('#pr-note-priv', root).checked ? 'Private note saved.' : `Note shared with ${p.display_name}.`, 'ok'); UI.render();
    });
    $$('[data-edit]', root).forEach(b => b.addEventListener('click', async () => {
      const isPriv = b.dataset.priv === 'true', list = isPriv ? priv : care.notes, n = list.find(x => x.id === b.dataset.edit); if (!n) return;
      const t = await promptText('Edit note', isPriv ? 'Private note' : `Shared with ${p.display_name}`, n.text); if (t === null || !t) return;
      n.text = t; n.updated_at = new Date().toISOString(); if (isPriv) await savePriv(list); else await saveCare(); N.toast('Note updated.', 'ok'); UI.render();
    }));
    $$('[data-del]', root).forEach(b => b.addEventListener('click', async () => {
      if (!(await N.confirm({title: 'Delete this note?', body: 'It will be removed permanently' + (b.dataset.priv === 'true' ? '.' : ` and disappear from ${p.display_name}'s account.`), ok: 'Delete', danger: true}))) return;
      if (b.dataset.priv === 'true') await savePriv(priv.filter(x => x.id !== b.dataset.del)); else { care.notes = care.notes.filter(x => x.id !== b.dataset.del); await saveCare(); }
      N.toast('Note deleted.', 'ok'); UI.render();
    }));
    $('#pr-cm', root).addEventListener('submit', async e => { e.preventDefault(); const id = $('#pr-cm-id', root).value; if (care.countermeasures.some(x => x.cm_id === id)) return N.toast('That countermeasure is already assigned.', 'warn'); care.countermeasures = [...care.countermeasures, {id: U.uid(), cm_id: id, assigned_at: new Date().toISOString(), note: $('#pr-cm-note', root).value.trim(), author: c.vault.profile.display_name}]; await saveCare(); N.toast('Countermeasure assigned.', 'ok'); UI.render(); });
    $$('[data-uncm]', root).forEach(b => b.addEventListener('click', async () => { care.countermeasures = care.countermeasures.filter(x => x.id !== b.dataset.uncm); await saveCare(); N.toast('Countermeasure removed.', 'ok'); UI.render(); }));
    $('#pr-csv', root).addEventListener('click', () => UI.download(`astravita-sessions-${p.subject_id}-${X.stamp()}.csv`, X.csv(X.sessionRows(sessions, p.subject_id), X.SESSION_COLS)));
    $('#pr-min', root).addEventListener('click', () => UI.download(`astravita-minutes-${p.subject_id}-${X.stamp()}.csv`, X.csv(X.minuteRows(sessions, p.subject_id), X.MINUTE_COLS)));
    $('#pr-print', root).addEventListener('click', () => UI.print(`${sel ? R.report(sel, p) : ''}<h2>Session history</h2><table><tr><th>Date</th><th>Duration</th><th>Status</th><th>Summary</th></tr>${sessions.slice(0, 60).map(s => `<tr><td>${esc(U.dateTime(s.start))}</td><td>${esc(U.duration(s.duration_s))}</td><td>${esc(s.result?.status || '')}</td><td>${esc(s.summary || '')}</td></tr>`).join('')}</table><h2>Shared notes</h2>${care.notes.map(n => `<p>${esc(U.dateTime(n.created_at))}: ${esc(n.text)}</p>`).join('') || '<p>None</p>'}`, `ASTRAVITA record ${p.subject_id}`));
  };
})();

/* =====================================================================
   ASTRAVITA — boot
   ===================================================================== */
(() => {
  const UI = ASTRAVITA.ui, A = ASTRAVITA.auth, N = ASTRAVITA.notify;
  ASTRAVITA.kb.load();
  addEventListener('hashchange', () => UI.render());
  // the skip link must move focus without touching the hash router (href="#view" would change the route)
  document.querySelector('.skip-link')?.addEventListener('click', e => { e.preventDefault(); const v = document.getElementById('view'); if (v) { v.focus(); v.scrollIntoView({block: 'start'}); } });
  // keep the session alive while the user is active
  let last = 0; const act = () => { const now = Date.now(); if (now - last > 30000 && A.current() && !A.expired()) { last = now; A.touch(); } };
  ['pointerdown', 'keydown'].forEach(t => addEventListener(t, act, {passive: true}));
  setInterval(() => { if (A.current() && A.expired()) UI.render(); }, 60000);
  addEventListener('unhandledrejection', e => { console.error('[ASTRAVITA]', e.reason); const m = e.reason?.code === 'quota' ? e.reason.message : 'Something went wrong. Your data is safe; please try again.'; N.toast(m, 'bad', 7000); });
  if (!('crypto' in window) || !crypto.subtle) {
    document.getElementById('app').innerHTML = '<main style="padding:40px;max-width:640px;margin:auto"><h1>ASTRAVITA needs a secure context</h1><p>Web Crypto is not available. Open the page from a local file, over https, or from http://localhost in a current version of Chrome, Edge, Firefox or Safari.</p></main>';
    return;
  }
  UI.render();
})();

</script>
</body>
</html>
