l-being and performance. PLoS ONE 2022;17(8):e0272460","url":"https://www.eurekalert.org/news-releases/962663","year":2022}],"notes":"A meta-analysis of 22 studies found micro-breaks associated with higher vigor and lower fatigue, but not with better performance overall; longer breaks may be needed for performance (Albulescu 2022)."},{"id":"cm_cognitive_load_review","title":"Cognitive workload review","category":"schedule","steps":["List upcoming tasks and mark which are high cognitive demand.","Identify periods where several demanding tasks overlap.","Discuss sequencing or support options with the crew and ground team.","Plan breaks and handovers for long monitoring tasks.","Re-check after changes and repeat if workload stays high."],"duration":"short planning review, repeat as needed","evidence_level":"expert opinion","sources":[{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"NASA HRP: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload","url":"https://www.nasa.gov/directorates/esdmd/hhp/risk-of-performance-decrements-and-adverse-health-outcomes-resulting-from-sleep-loss-circadian-desynchronization-and-work-overload","year":2025}],"notes":"NASA-STD-3001 Vol 2 includes a cognitive workload requirement (V2 5007)."},{"id":"cm_family_conference","title":"Private family conference","category":"social","steps":["Request or confirm your next private family conference slot.","Prepare a few things you would like to share or ask.","Use a private space during the call.","If real-time contact is not possible, record a message or write a letter.","Afterwards, take a few minutes for yourself before returning to work."],"duration":"per mission schedule","evidence_level":"expert opinion","sources":[{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null},{"title":"Kanas N. Psychiatric Issues in Space. Psychiatric Times 33(6)","url":"https://www.psychiatrictimes.com/view/psychiatric-issues-space","year":2016}],"notes":"Private family conferences and crew care packages are standard ISS behavioral health provisions; real-time video may not be possible on deep-space missions."},{"id":"cm_crew_social_meal","title":"Shared crew meal or social time","category":"social","steps":["Agree a regular time for a shared meal or social break.","Keep it light: no work topics for part of the time.","Rotate who chooses the menu, music or theme.","Use it to celebrate small milestones or personal events.","Respect people who need to skip occasionally."],"duration":"regular, at a frequency agreed by the crew","evidence_level":"expert opinion","sources":[{"title":"Landon LB, Miller JCW, Bell ST, Roma PG. When people start getting real: The Group Living Skills Survey for extreme work environments. Front Psychol 2024;15:1348119","url":"https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2024.1348119/pdf","year":2024},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016}],"notes":"Group meals and recreation are common features of analog missions; group living skills are strongly associated with team and social cohesion (Landon 2024)."},{"id":"cm_private_space_time","title":"Protected private time","category":"environment","steps":["Agree with the crew on a regular block of private, undisturbed time.","Use your private quarters or a quiet area and signal 'do not disturb'.","Choose a restorative activity (music, reading, writing, calling home).","Keep work communications off during this time when operations allow."],"duration":"regular blocks agreed by the crew","evidence_level":"expert opinion","sources":[{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"Rosenberg JD, Jannasch A, Binsted K, Landry S. Biobehavioral and psychosocial stress changes during three 8-12 month spaceflight analog missions with Mars-like conditions of isolation and confinement. Front Physiol 2022","url":"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2022.898841/pdf","year":2022}],"notes":"NASA-STD-3001 requires individual privacy facilities for missions longer than 30 days (V2 7071). HI-SEAS crews shifted schedules to get alone time late in the mission."},{"id":"cm_conflict_debrief","title":"Calm conflict debrief","category":"social","steps":["Wait until both people feel calm, then agree a private time to talk.","Each person describes the situation from their own view without interruption.","Focus on the specific issue and its effect on work, not on personalities.","Agree on one concrete change each person will try.","If it stays unresolved or affects safety, involve the commander or behavioral health team."],"duration":"one short private conversation, repeat if needed","evidence_level":"expert opinion","sources":[{"title":"NASA HRP: Risk of In-Mission Performance and Behavioral Health Decrements Due to Inadequate Cooperation, Coordination, Communication, and Psychosocial Adaptation within a Team (Team Risk)","url":"https://www.nasa.gov/directorates/esdmd/hhp/team-risk/","year":2025},{"title":"NASA: Risk of inadequate teamwork","url":"https://www.nasa.gov/reference/risk-of-inadequate-teamwork","year":2024},{"title":"Kanas N. Psychiatric Issues in Space. Psychiatric Times 33(6)","url":"https://www.psychiatrictimes.com/view/psychiatric-issues-space","year":2016}]},{"id":"cm_peer_support_checkin","title":"Peer support check-in","category":"social","steps":["Choose a trusted crewmate or contact on Earth.","Share briefly how you are doing, including what is hard.","Listen in return and ask how they are doing.","Agree a simple follow-up (for example a check-in in a few days).","Humor and shared activities can help reduce tension."],"duration":"a short conversation","evidence_level":"expert opinion","sources":[{"title":"NIMH: I'm So Stressed Out! Fact Sheet","url":"https://www.nimh.nih.gov/health/publications/so-stressed-out-fact-sheet/index.shtml","year":null},{"title":"Landon LB, Miller JCW, Bell ST, Roma PG. When people start getting real: The Group Living Skills Survey for extreme work environments. Front Psychol 2024;15:1348119","url":"https://www.frontiersin.org/journals/psychology/articles/10.3389/fpsyg.2024.1348119/pdf","year":2024}]},{"id":"cm_bhp_consult","title":"Behavioral health consultation","category":"medical","steps":["Request a private psychological conference with the behavioral health team or flight surgeon.","Share the ASTRAVITA summary and your questionnaire answers if you wish.","Describe how long symptoms have lasted and how they affect work and sleep.","Agree on a follow-up plan and any monitoring.","If you have thoughts of harming yourself, follow the safety protocol immediately."],"duration":"per schedule; urgent if safety concern","evidence_level":"expert opinion","sources":[{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"NIMH: I'm So Stressed Out! Fact Sheet","url":"https://www.nimh.nih.gov/health/publications/so-stressed-out-fact-sheet/index.shtml","year":null},{"title":"NIMH: Depression (NIH Publication No. 24-MH-8079)","url":"https://www.nimh.nih.gov/health/publications/depression","year":2024}],"notes":"Private psychological conferences are a current ISS provision governed by NASA-STD-3001 V1 6010."},{"id":"cm_sleep_hygiene","title":"Sleep environment and habits check","category":"sleep","steps":["Keep the sleep area quiet, cool and dark; use earplugs, eye mask or light blockers if needed.","Avoid caffeine and nicotine later in the day.","Avoid bright screens and intense exercise in the hour before sleep.","Keep naps to 20 minutes or less if you have trouble sleeping at night.","Keep a consistent sleep and wake schedule."],"duration":"ongoing","evidence_level":"low","sources":[{"title":"NHLBI: Sleep Deprivation and Deficiency - Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits","year":2022},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"Edinger JD, Arnedt JT, Bertisch SM, et al. Behavioral and psychological treatments for chronic insomnia disorder in adults: an AASM clinical practice guideline. J Clin Sleep Med 2021 (NeurologyLive summary)","url":"https://www.neurologylive.com/view/new-aasm-guidelines-make-strong-recommendation-for-behavioral-therapy-in-chronic-insomnia","year":2021}],"notes":"Sleep hygiene alone is not recommended as a stand-alone insomnia treatment (AASM 2021), but it supports multi-component approaches."},{"id":"cm_sleep_schedule_anchor","title":"Anchor your sleep schedule","category":"sleep","steps":["Set a fixed wake-up time and keep it every day.","Keep sleep and wake times within about an hour of each other across days.","Plan your sleep period backwards from the fixed wake time.","Get light and activity soon after waking to reinforce the schedule."],"duration":"daily","evidence_level":"moderate","sources":[{"title":"NHLBI: Sleep Deprivation and Deficiency - Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits","year":2022},{"title":"Stanford Health Care: Stimulus Control and CBTI","url":"https://stanfordhealthcare.org/medical-treatments/c/cognitive-behavioral-therapy-insomnia/procedures/stimulus-control.html","year":2017},{"title":"NIMH: Depression (NIH Publication No. 24-MH-8079)","url":"https://www.nimh.nih.gov/health/publications/depression","year":2024}]},{"id":"cm_strategic_nap","title":"Strategic short nap","category":"sleep","steps":["Plan the nap ahead of critical tasks, ideally earlier in the work period.","Keep it short: about 20-30 minutes of sleep.","Set an alarm and allow time to recover from grogginess before critical work.","Avoid long naps if you have trouble sleeping at night.","If allowed, caffeine taken just before a short nap may reduce post-nap grogginess."],"duration":"20-30 min","evidence_level":"moderate","sources":[{"title":"Rosekind MR, et al. Alertness management: strategic naps in operational settings. J Sleep Res 1995;4(S2):62-66 (Sleep Foundation summary)","url":"https://www.sleepfoundation.org/sleep-hygiene/nasa-nap","year":1995},{"title":"NHLBI: Sleep Deprivation and Deficiency - Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits","year":2022},{"title":"Hilditch CJ, McHill AW. Sleep inertia: current insights. Nat Sci Sleep 2019;11:155-165","url":"https://www.dovepress.com/sleep-inertia-current-insights-peer-reviewed-fulltext-article-NSS","year":2019}],"notes":"NASA pilots given a 40-minute nap opportunity (about 26 minutes of sleep) showed up to 54% higher alertness and 34% better performance (Rosekind 1995). NHLBI advises naps of 20 minutes or less; naps of 30 minutes or less reduce sleep inertia (Hilditch 2019)."},{"id":"cm_caffeine_timing","title":"Caffeine timing","category":"sleep","steps":["Use caffeine strategically for alertness early in the work period.","Stop caffeine at least 6 hours before your planned sleep; effects can last up to 8 hours.","Avoid stacking doses when already anxious or jittery.","Record caffeine intake if sleep is poor, and share it with the flight surgeon."],"duration":"daily","evidence_level":"moderate","sources":[{"title":"Drake C, et al. Caffeine effects on sleep taken 0, 3, or 6 hours before going to bed. J Clin Sleep Med 2013 (AASM release)","url":"https://aasm.org/late-afternoon-and-early-evening-caffeine-can-disrupt-sleep-at-night/","year":2013},{"title":"NHLBI: Sleep Deprivation and Deficiency - Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits","year":2022},{"title":"Hilditch CJ, McHill AW. Sleep inertia: current insights. Nat Sci Sleep 2019;11:155-165","url":"https://www.dovepress.com/sleep-inertia-current-insights-peer-reviewed-fulltext-article-NSS","year":2019}],"notes":"400 mg of caffeine taken 6 hours before bed reduced objectively measured sleep by more than 1 hour (Drake 2013)."},{"id":"cm_wind_down_routine","title":"Pre-sleep wind-down routine","category":"sleep","steps":["Switch habitat lighting to the pre-sleep (dim, low-blue) setting.","Stop work tasks and bright screens before sleep.","Do a calming activity: slow breathing, muscle relaxation or light reading.","Avoid intense exercise in the last hour before sleep.","Go to your sleep station at the same time each night."],"duration":"the last hour before sleep","evidence_level":"low","sources":[{"title":"NHLBI: Sleep Deprivation and Deficiency - Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits","year":2022},{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021},{"title":"Space.com: Space Station Shut-Eye: New LED Lights May Help Astronauts (and You) Sleep Better","url":"https://www.space.com/35997-led-lights-help-astronauts-sleep-better.html","year":2017}]},{"id":"cm_cbti_stimulus_control","title":"Stimulus control (CBT-I component)","category":"sleep","steps":["Keep a regular morning rise time every day.","Go to bed only when sleepy, not just tired.","Use the sleep station only for sleep.","If you cannot fall asleep or fall back asleep, get up and do something calm in dim light; return only when sleepy.","Avoid long naps; a brief 15-30 minute nap is acceptable."],"duration":"nightly, as part of a clinician-guided plan","evidence_level":"moderate","sources":[{"title":"Stanford Health Care: Stimulus Control and CBTI","url":"https://stanfordhealthcare.org/medical-treatments/c/cognitive-behavioral-therapy-insomnia/procedures/stimulus-control.html","year":2017},{"title":"Edinger JD, Arnedt JT, Bertisch SM, et al. Behavioral and psychological treatments for chronic insomnia disorder in adults: an AASM clinical practice guideline. J Clin Sleep Med 2021 (NeurologyLive summary)","url":"https://www.neurologylive.com/view/new-aasm-guidelines-make-strong-recommendation-for-behavioral-therapy-in-chronic-insomnia","year":2021}],"notes":"Multi-component CBT-I has a strong recommendation; stimulus control alone has a conditional recommendation (AASM, Edinger 2021). A full CBT-I course should be guided by a clinician."},{"id":"cm_bright_light_morning","title":"Bright light at the start of the day","category":"light","steps":["Switch habitat lighting to the bright, blue-enriched setting at the start of your day.","If a light box is available, use about 10,000 lux for at least 30 minutes in the morning.","Keep your eyes open and face the light source without staring directly into it.","Check with the flight surgeon first if you have eye conditions or take light-sensitizing medication."],"duration":"30 min daily, morning","evidence_level":"moderate","sources":[{"title":"American Psychiatric Association blog: Bright Light Therapy beyond seasonal depression (cites Menegaz de Almeida et al., JAMA Psychiatry 2024)","url":"https://www.psychiatry.org/News-room/APA-Blogs/Bright-Light-Therapy-beyond-seasonal-depression","year":2025},{"title":"Space.com: Space Station Shut-Eye: New LED Lights May Help Astronauts (and You) Sleep Better","url":"https://www.space.com/35997-led-lights-help-astronauts-sleep-better.html","year":2017},{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021}],"notes":"A meta-analysis of 11 RCTs found bright light therapy effective as an add-on for nonseasonal depression (remission 41% vs 23%) (Menegaz de Almeida 2024, via APA)."},{"id":"cm_evening_light_dimming","title":"Evening light dimming","category":"light","steps":["Switch habitat lighting to the pre-sleep setting (dimmer, blue-depleted) before your sleep period.","Reduce screen brightness or use night mode on displays.","Avoid bright light exposure in the hour before sleep.","Use light blockers or an eye mask in the sleep station."],"duration":"the last hour before sleep","evidence_level":"moderate","sources":[{"title":"Space.com: Space Station Shut-Eye: New LED Lights May Help Astronauts (and You) Sleep Better","url":"https://www.space.com/35997-led-lights-help-astronauts-sleep-better.html","year":2017},{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021},{"title":"NHLBI: Sleep Deprivation and Deficiency - Healthy Sleep Habits","url":"https://www.nhlbi.nih.gov/health/sleep-deprivation/healthy-sleep-habits","year":2022}]},{"id":"cm_circadian_lighting_shift","title":"Planned circadian lighting shift","category":"light","steps":["Before a schedule shift, agree a lighting plan with the flight surgeon or mission planning.","Use the bright, blue-enriched setting during the new biological morning.","Use the dim pre-sleep setting and block light before the new sleep period.","Shift sleep and meals together with the light schedule.","Monitor sleepiness (KSS) during the transition."],"duration":"over several days around a schedule shift","evidence_level":"moderate","sources":[{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"Space.com: Space Station Shut-Eye: New LED Lights May Help Astronauts (and You) Sleep Better","url":"https://www.space.com/35997-led-lights-help-astronauts-sleep-better.html","year":2017},{"title":"Flynn-Evans E, Gregory K, Arsintescu L, Whitmire A. Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload (NASA JSC-CN-35774)","url":"https://ntrs.nasa.gov/citations/20160003864","year":2016}],"notes":"NASA-STD-3001 calls for at least three white-light configurations (general, pre-sleep, alertness/schedule shifting) for missions longer than 30 days, and circadian shifting is covered by V1 6001."},{"id":"cm_workload_rebalance","title":"Workload rebalance","category":"schedule","steps":["List current tasks and estimated time, including overtime.","Identify what can be deferred, shared or simplified.","Discuss priorities with the commander and ground team.","Protect sleep and off-duty periods in the revised plan.","Review again after one week."],"duration":"short planning review, then weekly","evidence_level":"expert opinion","sources":[{"title":"NASA HRP: Risk of Performance Decrements and Adverse Health Outcomes Resulting from Sleep Loss, Circadian Desynchronization, and Work Overload","url":"https://www.nasa.gov/directorates/esdmd/hhp/risk-of-performance-decrements-and-adverse-health-outcomes-resulting-from-sleep-loss-circadian-desynchronization-and-work-overload","year":2025},{"title":"NASA: Risk from Inadequate Sleep and Irregular Schedules","url":"https://www.nasa.gov/reference/risk-from-inadequate-sleep-and-irregular-schedules/","year":2024},{"title":"NASA-STD-3001 Technical Brief: Sleep Accommodations (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/03/sleep-accomodations-technical-brief-ochmo.pdf","year":2021},{"title":"WHO: Burn-out an 'occupational phenomenon': International Classification of Diseases","url":"https://www.who.int/news-room/detail/28-05-2019-burn-out-an-occupational-phenomenon-international-classification-of-diseases","year":2019},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}],"notes":"NASA-STD-3001 V1 4014 sets limits on planned hours for critical tasks, workdays and sleep periods."},{"id":"cm_autonomy_scheduling","title":"Crew self-scheduling","category":"schedule","steps":["Identify tasks whose timing can be chosen by the crew.","Place them where they best fit your energy and preferences.","Use available scheduling tools to check for constraint violations.","Share the plan with the crew and ground team."],"duration":"weekly planning","evidence_level":"low","sources":[{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"Karasinski JA, Shelat S, Marquez JJ. Validation of Self-Scheduling Countermeasures in NASA's HERA Campaign 6. AIAA SciTech 2025","url":"https://scholarworks.sjsu.edu/faculty_rsca/6232","year":2025},{"title":"Frontiers Science News: Off-world colony simulation reveals changes in human communication over time with Earth (SIRIUS-19; Front Physiol doi:10.3389/fphys.2021.751170)","url":"https://www.frontiersin.org/news/2021/11/09/isolation-mars-communication-sirius-russia","year":2021}],"notes":"Simulation studies suggest crew autonomy may improve performance and psychosocial adaptation (Roma 2009; Kanas & Manzey 2008, cited in HRP evidence report). In HERA, scheduling aids showed non-significant trends toward faster, less error-prone self-scheduling (Karasinski 2025)."},{"id":"cm_novelty_variety","title":"Add novelty and variety","category":"environment","steps":["Change something small in your routine (order of tasks, exercise program, music).","Open a care package or new media saved for later in the mission.","Start a short new project or learning goal.","Rearrange or personalize part of your personal space.","Look after plants or similar living systems if available."],"duration":"weekly","evidence_level":"low","sources":[{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023}],"notes":"In a Mir simulator study, anxiety, total mood disturbance and tension were lower after the arrival of additional supplies (Stuster 1996, cited in HRP evidence report). Plants may increase sensory input and reduce stress."},{"id":"cm_leisure_hobby","title":"Leisure and hobby time","category":"environment","steps":["Choose a hobby available on board (music, reading, photography, games, drawing).","Schedule it as protected time.","Combine with exercise when possible (for example music or films during workouts).","Share hobbies with crewmates occasionally."],"duration":"regular protected sessions","evidence_level":"low","sources":[{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"NASA-STD-3001 Technical Brief OCHMO-TB-016: Behavioral Health and Performance (Rev B)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf","year":2023},{"title":"NASA: Risk from Inadequate Sleep and Irregular Schedules","url":"https://www.nasa.gov/reference/risk-from-inadequate-sleep-and-irregular-schedules/","year":2024}]},{"id":"cm_nature_vr_exposure","title":"Virtual nature exposure","category":"environment","steps":["Choose a nature scene you personally prefer (forest, beach, countryside).","Use a VR headset or large display in a quiet spot.","Watch for about 15 minutes while breathing slowly.","Notice how your body feels afterwards and rate your mood."],"duration":"about 15 min","evidence_level":"low","sources":[{"title":"Anderson AP, Mayer MD, Fellows AM, Cowan DR, Hegel MT, Buckey JC. Relaxation with immersive natural scenes presented using virtual reality. Aerosp Med Hum Perform 2017;88(6):520-526","url":"https://asma.kglmeridian.com/view/journals/amhp/88/6/article-p520.xml","year":2017},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016}],"notes":"In 18 participants after a stress task, 15-minute 360-degree natural scenes reduced electrodermal activity and negative affect more than an indoor control; preferred scenes worked best (Anderson 2017). Simulated nature is also described as a countermeasure in the HRP evidence report."},{"id":"cm_mission_milestones","title":"Mark mission milestones","category":"schedule","steps":["Break the remaining mission into shorter segments (for example by month or quarter).","Plan a small celebration or ritual at each milestone (halfway point, arrivals, holidays).","Keep a visible countdown or progress record.","Look ahead to concrete post-mission plans with family."],"duration":"at each milestone","evidence_level":"expert opinion","sources":[{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"title":"Basner M, Dinges DF, Mollicone D, et al. Mars 520-d mission simulation reveals protracted crew hypokinesis and alterations of sleep duration and timing. PNAS 2013;110(7):2635-2640","url":"https://www.med.upenn.edu/uep/assets/user-content/documents/PNAS2013Basner1212646110withSupportingAppendix.pdf","year":2013},{"title":"Rosenberg JD, Jannasch A, Binsted K, Landry S. Biobehavioral and psychosocial stress changes during three 8-12 month spaceflight analog missions with Mars-like conditions of isolation and confinement. Front Physiol 2022","url":"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2022.898841/pdf","year":2022},{"title":"Palinkas LA, Suedfeld P. Psychological effects of polar expeditions (The Lancet review; EurekAlert news release)","url":"https://www.eurekalert.org/news-releases/537875","year":2007}],"notes":"Realizing that a mission is only half over is a proposed cause of mid-mission mood dips (HRP evidence report; Palinkas & Suedfeld). In Mars-500, activity rose sharply in the final 20 days in anticipation of mission end (Basner 2013)."},{"id":"cm_aerobic_session","title":"Moderate aerobic exercise session","category":"exercise","steps":["Use the treadmill or cycle ergometer (T2 / CEVIS) within your scheduled exercise block.","Warm up for 5 minutes at an easy pace.","Exercise for 20-30 minutes at a moderate effort where you can talk but not sing.","Cool down for 5 minutes and drink water afterwards.","Aim across the week for at least 150-300 minutes of moderate to vigorous aerobic activity, counting your prescribed countermeasure exercise."],"duration":"30-40 min","evidence_level":"moderate","sources":[{"title":"PAHO/WHO: Every move counts towards better health - WHO guidelines on physical activity and sedentary behaviour","url":"https://www.paho.org/en/news/26-11-2020-every-move-counts-towards-better-health-says-who","year":2020},{"title":"NASA: Astronaut Exercise","url":"https://www.nasa.gov/missions/station/iss-research/astronaut-exercise","year":2025},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}]},{"id":"cm_resistance_session","title":"Resistance training session","category":"exercise","steps":["Use the resistive device (ARED or equivalent) following your prescribed protocol.","Do 2-3 sets of 8-12 repetitions for major muscle groups (legs, back, chest, shoulders).","Move with control and breathe out during the effort phase; do not hold your breath.","Rest 1-2 minutes between sets.","Note mood and energy before and after to see your own response."],"duration":"30-45 min","evidence_level":"moderate","sources":[{"title":"Gordon BR et al. Association of Efficacy of Resistance Exercise Training With Depressive Symptoms: Meta-analysis and Meta-regression of Randomized Clinical Trials. JAMA Psychiatry 75(6):566-576","url":"https://dr.lib.iastate.edu/entities/publication/678d2a9c-4a2d-4cb3-9170-807faced6055","year":2018},{"title":"NASA: Astronaut Exercise","url":"https://www.nasa.gov/missions/station/iss-research/astronaut-exercise","year":2025}]},{"id":"cm_stretching_break","title":"Posture and stretching break","category":"exercise","steps":["Stop the current task and move away from the workstation if possible.","Slowly roll the shoulders backwards 5 times.","Gently turn the head left and right and tilt each ear toward the shoulder, holding each stretch 15-20 seconds without pain.","Stretch the upper back by reaching both arms forward and rounding the back.","Before resuming, check screen distance and posture (back supported, screen slightly below eye level)."],"duration":"3-5 min","evidence_level":"low","sources":[{"title":"MedlinePlus: Tension headache","url":"https://www.medlineplus.gov/ency/article/000797.htm","year":2025},{"title":"American Optometric Association: Most Americans Experience Digital Eye Strain from Overexposure to Computers According to Survey","url":"https://www.aoa.org/about-the-aoa/press-room/press-releases/most-americans-experience-digital-eye-strain-from-overexposure-to-computers-according-to-survey","year":2016}]},{"id":"cm_neck_shoulder_release","title":"Neck and shoulder tension release","category":"exercise","steps":["Sit or anchor comfortably and let the shoulders drop away from the ears.","Massage the base of the skull, temples and upper shoulders with your fingertips for 1-2 minutes.","Apply a warm (or cold, if preferred) pack to the neck or shoulders for up to 10 minutes.","Finish with slow neck stretches, holding each 15-20 seconds.","Note any trigger (posture, long fixed task, cold air) in a headache diary."],"duration":"5-10 min","evidence_level":"low","sources":[{"title":"MedlinePlus: Tension headache","url":"https://www.medlineplus.gov/ency/article/000797.htm","year":2025}]},{"id":"cm_jaw_relaxation","title":"Jaw relaxation","category":"exercise","steps":["Notice whether your teeth are clenched; let the lips close lightly with the teeth slightly apart and the tongue resting.","Place warm or cool packs on the jaw muscles for a few minutes.","Gently open and close the mouth slowly 5-10 times within a pain-free range.","Reduce gum chewing and nail biting during the day.","Combine with a short relaxation or breathing exercise if stress is high."],"duration":"3-5 min","evidence_level":"low","sources":[{"title":"NIDCR: TMD (Temporomandibular Disorders)","url":"https://www.nidcr.nih.gov/health-info/tmd","year":2026},{"title":"MedlinePlus: Tension headache","url":"https://www.medlineplus.gov/ency/article/000797.htm","year":2025}]},{"id":"cm_hydration_check","title":"Hydration check","category":"nutrition","steps":["Ask yourself: am I thirsty, is my mouth dry, has my urine been darker or less frequent today?","Drink a glass of water now and keep a personal drink bag or bottle within reach.","Drink more around exercise, heat, illness or vomiting.","Re-check headache and alertness after 30-60 minutes.","Before gravity re-exposure, follow the flight surgeon's fluid and salt loading protocol."],"duration":"2 min, then re-check in 1 h","evidence_level":"expert opinion","sources":[{"title":"MedlinePlus: Dehydration","url":"https://medlineplus.gov/ency/article/000982.htm","year":2025},{"title":"CDC: About Water and Healthier Drinks","url":"https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/","year":2026},{"title":"NASA HRP Evidence Report: Risk of Orthostatic Intolerance During Re-exposure to Gravity","url":"https://ntrs.nasa.gov/api/citations/20150007319/downloads/20150007319.pdf","year":2015}]},{"id":"cm_iron_diet_review","title":"Review iron intake with the nutrition team","category":"nutrition","steps":["Note which iron-containing foods you actually eat (meat, seafood, poultry, fortified cereals, beans, lentils, spinach).","Pair plant-based iron foods with a vitamin C source (citrus, tomatoes, broccoli) to improve absorption.","Do not start iron supplements on your own; in spaceflight iron stores tend to rise and excess iron can be harmful.","Discuss intake and any lab results with the flight surgeon or mission nutritionist."],"duration":"15 min review","evidence_level":"expert opinion","sources":[{"title":"NIH Office of Dietary Supplements: Iron - Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/iron-Consumer/","year":2023},{"title":"Smith SM, Zwart SR. Nutrition issues for space exploration (NASA NTRS)","url":"https://ntrs.nasa.gov/api/citations/20060049121/downloads/20060049121.pdf","year":null},{"title":"Disease database extension, part B (sections 19 onward)","url":"local:medical-data/disease-database-extension-b.pdf","year":null}]},{"id":"cm_b12_review","title":"Review vitamin B12 intake and status","category":"nutrition","steps":["Check whether your menu regularly includes B12 sources (animal-derived or fortified foods), especially if you eat a mostly plant-based diet.","List any long-term medications that may affect absorption.","Report numbness, tingling or balance problems to the flight surgeon.","Ask whether a serum B12 test (with methylmalonic acid confirmation if low) is appropriate; avoid high-dose supplements without guidance."],"duration":"15 min review","evidence_level":"expert opinion","sources":[{"title":"MedlinePlus: Vitamin B12 level","url":"https://medlineplus.gov/ency/article/003705.htm","year":2026},{"title":"Disease database extension, part B (sections 19 onward)","url":"local:medical-data/disease-database-extension-b.pdf","year":null}]},{"id":"cm_vitamin_d_review","title":"Review vitamin D supplementation","category":"nutrition","steps":["Confirm you are taking the vitamin D supplement prescribed for the mission; there is no UVB exposure in the habitat.","The adult RDA is 600 IU (15 mcg) per day up to age 70; do not exceed 4,000 IU (100 mcg) per day without medical advice.","Ask the flight surgeon whether a 25(OH)D blood level is due, especially in the second half of the mission.","Remember that vitamin D is not a treatment for low mood on its own; keep other supports in place."],"duration":"10 min review","evidence_level":"moderate","sources":[{"title":"NIH Office of Dietary Supplements: Vitamin D - Fact Sheet for Health Professionals","url":"https://ods.od.nih.gov/factsheets/vitaminD-healthProfessional/","year":2026},{"title":"Smith SM, Zwart SR. Nutrition issues for space exploration (NASA NTRS)","url":"https://ntrs.nasa.gov/api/citations/20060049121/downloads/20060049121.pdf","year":null}]},{"id":"cm_regular_meals","title":"Regular, unhurried meals","category":"nutrition","steps":["Schedule meals at consistent times and protect them from task overrun.","Eat the planned menu items even if appetite is reduced; choose lighter meals if you feel lightheaded after heavy meals.","Drink water with each meal.","Tell the flight surgeon or nutritionist about persistent appetite change or unintended weight change."],"duration":"20-30 min per meal","evidence_level":"expert opinion","sources":[{"title":"Smith SM, Zwart SR. Nutrition issues for space exploration (NASA NTRS)","url":"https://ntrs.nasa.gov/api/citations/20060049121/downloads/20060049121.pdf","year":null},{"title":"Cleveland Clinic: Orthostatic Hypotension (Postural Hypotension)","url":"https://my.clevelandclinic.org/health/diseases/9385-low-blood-pressure-orthostatic-hypotension","year":2026},{"title":"CDC: About Water and Healthier Drinks","url":"https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/","year":2026}]},{"id":"cm_stimulant_review","title":"Review stimulant use and timing","category":"medical","steps":["List everything stimulating you took in the last 72 hours (wake-promoting medication such as modafinil, caffeine) with times and doses.","Compare with your sleep times: late doses can cause trouble falling or staying asleep.","Watch for side effects such as headache, fast or pounding heartbeat, anxiety or mood change.","Discuss timing and need with the flight surgeon; do not change prescribed doses on your own."],"duration":"10 min","evidence_level":"expert opinion","sources":[{"title":"MedlinePlus: Modafinil","url":"https://medlineplus.gov/druginfo/meds/a602016.html","year":2024}]},{"id":"cm_flight_surgeon_review","title":"Private consultation with the flight surgeon","category":"medical","steps":["Schedule a private medical conference at the next available opportunity.","Bring this session's summary, your symptom timeline and any recent medication changes.","Describe physical symptoms (headache, vision, congestion, dizziness, appetite) as well as mood and sleep.","Agree on follow-up checks and when to call earlier."],"duration":"15-30 min","evidence_level":"expert opinion","sources":[{"title":"NASA HRP: Risk of Spaceflight Associated Neuro-ocular Syndrome (SANS)","url":"https://www.nasa.gov/reference/risk-of-spaceflight-associated-neuro-ocular-syndrome-sans","year":2025},{"title":"NASA HRP Evidence Report: Risk of Orthostatic Intolerance During Re-exposure to Gravity","url":"https://ntrs.nasa.gov/api/citations/20150007319/downloads/20150007319.pdf","year":2015}]},{"id":"cm_lab_panel_request","title":"Ask the flight surgeon about a lab panel","category":"medical","steps":["Note how long fatigue, low mood, cold intolerance or concentration problems have lasted.","Ask the flight surgeon whether a blood panel is appropriate, for example: complete blood count and ferritin (iron), vitamin B12 (with methylmalonic acid if low), 25-hydroxyvitamin D, and thyroid blood tests.","Avoid starting supplements before the test unless advised.","Review results together and repeat in-app sessions to see whether the pattern changes after any treatment."],"duration":"10 min to request; sampling per medical schedule","evidence_level":"expert opinion","sources":[{"title":"NIDDK: Hypothyroidism (Underactive Thyroid)","url":"https://www.niddk.nih.gov/health-information/endocrine-diseases/hypothyroidism","year":2021},{"title":"MedlinePlus: Vitamin B12 level","url":"https://medlineplus.gov/ency/article/003705.htm","year":2026},{"title":"NIH Office of Dietary Supplements: Vitamin D - Fact Sheet for Health Professionals","url":"https://ods.od.nih.gov/factsheets/vitaminD-healthProfessional/","year":2026},{"title":"Disease database extension, part B (sections 19 onward)","url":"local:medical-data/disease-database-extension-b.pdf","year":null}]},{"id":"cm_medication_review","title":"Medication side-effect review","category":"medical","steps":["List all medications, sleep aids and anti-motion-sickness drugs taken in the last 72 hours with times and doses.","Check for known effects: next-day drowsiness and slowed reactions (zolpidem), drowsiness and dizziness (diphenhydramine, promethazine), sleep trouble or nervousness (promethazine, modafinil).","Avoid critical tasks while you still feel drowsy and allow 7-8 hours in bed after a hypnotic.","Report any mood change, confusion, complex sleep behaviors or irregular heartbeat to the flight surgeon immediately; do not stop prescribed medicines on your own."],"duration":"10 min","evidence_level":"expert opinion","sources":[{"title":"MedlinePlus: Zolpidem","url":"https://medlineplus.gov/druginfo/meds/a693025.html","year":2019},{"title":"MedlinePlus: Diphenhydramine","url":"https://www.medlineplus.gov/druginfo/meds/a682539.html","year":2026},{"title":"MedlinePlus: Promethazine","url":"https://medlineplus.gov/druginfo/meds/a682284.html","year":2026},{"title":"Abbott et al. Promethazine Effects on Motion Sickness During Altered Gravity Induced by Parabolic Flight. Aerosp Med Hum Perform 96(11):976-984","url":"https://asma.kglmeridian.com/view/journals/amhp/96/11/article-p976.xml","year":2025}]},{"id":"cm_vision_check","title":"Vision self-check and eye exam request","category":"medical","steps":["Read a standard near-vision card or familiar text at your usual distance and note any new blur.","Check each eye separately for blurred areas, spots or distortion.","If near vision has worsened, use the issued plus-lens (space anticipation) glasses as directed and tell the flight surgeon.","Ask whether onboard eye imaging (fundoscopy/OCT) is due; report any headache that accompanies vision change."],"duration":"5 min","evidence_level":"moderate","sources":[{"title":"EyeWiki (American Academy of Ophthalmology): Spaceflight-Associated Neuro-Ocular Syndrome (SANS)","url":"https://eyewiki.org/Spaceflight-Associated_Neuro-Ocular_Syndrome_(SANS)","year":2026},{"title":"NASA HRP: Risk of Spaceflight Associated Neuro-ocular Syndrome (SANS)","url":"https://www.nasa.gov/reference/risk-of-spaceflight-associated-neuro-ocular-syndrome-sans","year":2025},{"title":"Disease database extension, part A (sections 09 onward)","url":"local:medical-data/disease-database-extension-a.pdf","year":null}]},{"id":"cm_bp_check","title":"Blood pressure and orthostatic check","category":"medical","steps":["Measure blood pressure and pulse after 5 minutes of quiet rest (typical adult resting values: BP 90/60-120/80 mmHg, pulse 60-100 bpm).","In a gravity environment, stand up slowly and repeat the measurement at 1 and 3 minutes.","A drop of more than 20 mmHg systolic or 10 mmHg diastolic within 3 minutes of standing suggests orthostatic hypotension.","Sit down immediately if lightheaded, and share the readings with the flight surgeon."],"duration":"10 min","evidence_level":"high","sources":[{"title":"Cleveland Clinic: Orthostatic Hypotension (Postural Hypotension)","url":"https://my.clevelandclinic.org/health/diseases/9385-low-blood-pressure-orthostatic-hypotension","year":2026},{"title":"MedlinePlus: Vital signs","url":"https://medlineplus.gov/ency/article/002341.htm","year":2025},{"title":"NASA HRP Evidence Report: Risk of Orthostatic Intolerance During Re-exposure to Gravity","url":"https://ntrs.nasa.gov/api/citations/20150007319/downloads/20150007319.pdf","year":2015}]},{"id":"cm_co2_ventilation_check","title":"Cabin CO2 and ventilation check","category":"environment","steps":["Check the current and recent cabin ppCO2 readings (limit: 3 mmHg one-hour average, NASA-STD-3001 V2 6004).","Check whether other crew members have similar headaches.","Make sure your sleep station and work area fans are on and unobstructed; adjust airflow so you are not in a stagnant pocket.","Move to a better-ventilated module for a while if symptoms persist.","Report sustained high readings or scrubber issues to the ground and the flight surgeon."],"duration":"5 min","evidence_level":"moderate","sources":[{"title":"NASA OCHMO Technical Brief OCHMO-TB-004: Carbon Dioxide (Rev D)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-004-carbon-dioxide.pdf","year":2026},{"title":"NASA OCHMO Technical Brief OCHMO-TB-002: Environmental Control and Life Support Systems (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/07/eclss-technical-brief-ochmo.pdf","year":2023}]},{"id":"cm_head_elevation_rest","title":"Head-elevated rest (gravity environments only)","category":"medical","steps":["Applies on a planetary surface, in analog habitats or after landing, not in weightlessness.","Raise the head of the bed or use extra pillows when resting or sleeping.","Give yourself extra time when getting up: sit first, then stand while holding something sturdy.","Avoid very hot showers and heavy meals when you feel lightheaded.","In weightlessness, discuss mechanical countermeasures (for example thigh cuffs) with the flight surgeon instead."],"duration":"During rest and sleep","evidence_level":"low","sources":[{"title":"Cleveland Clinic: Orthostatic Hypotension (Postural Hypotension)","url":"https://my.clevelandclinic.org/health/diseases/9385-low-blood-pressure-orthostatic-hypotension","year":2026}]},{"id":"cm_thigh_cuffs","title":"Veno-constrictive thigh cuffs (Braslet-type), only under flight surgeon guidance","category":"medical","steps":["Use only if prescribed by the flight surgeon and following the fitting procedure.","Ground studies wore cuffs about 10 hours per day at a pressure of about 30 mmHg and removed them overnight.","Watch for numbness, pain, color change or swelling of the legs and remove the cuffs if they occur.","Do not wear them continuously for 24 hours (venous thrombosis concern).","Note any relief of head fullness or congestion for your medical conference."],"duration":"Up to about 10 h/day, daytime","evidence_level":"low","sources":[{"title":"Robin et al. DI-5-CUFFS: Venoconstrictive Thigh Cuffs Limit Body Fluid Changes but Not Orthostatic Intolerance Induced by a 5-Day Dry Immersion. Front Physiol 11:383","url":"https://www.frontiersin.org/articles/10.3389/fphys.2020.00383/full","year":2020},{"title":"Ferguson et al. Mitigating Headward Fluid Shifts With Veno-Constrictive Thigh Cuffs During Spaceflight (NASA HRP IWS poster)","url":"https://ntrs.nasa.gov/citations/20230000939","year":2023},{"title":"EyeWiki (American Academy of Ophthalmology): Spaceflight-Associated Neuro-Ocular Syndrome (SANS)","url":"https://eyewiki.org/Spaceflight-Associated_Neuro-Ocular_Syndrome_(SANS)","year":2026}]},{"id":"cm_noise_reduction","title":"Noise check and reduction","category":"environment","steps":["Identify the main noise source in your work or sleep area (fans, pumps, intermittent hardware).","Report unusually loud or new noises; regular maintenance and isolating vibrating equipment reduce off-nominal noise.","Close your crew quarters and use approved sound-dampening measures where available.","Use personal hearing protection for sleep only if your crew procedures allow it (it must not replace engineering noise limits or block alarms).","Keep personal audio at moderate volume."],"duration":"5-10 min","evidence_level":"moderate","sources":[{"title":"NASA OCHMO Technical Brief OCHMO-TB-035: Acoustics (Rev C)","url":"https://www.nasa.gov/sites/default/files/atoms/files/acoustics_technical_brief_ochmo_0.pdf","year":2023}]},{"id":"cm_thermal_comfort","title":"Thermal comfort adjustment","category":"environment","steps":["Check cabin temperature and humidity (comfort zone 20-25 C and 30-60% relative humidity, NASA-STD-3001 V2 6013).","Adjust your sleep station airflow and clothing layers.","Add a layer if you are cold, especially at night; cold can trigger tension headaches.","Report sustained readings outside the comfort zone to the crew and ground."],"duration":"5 min","evidence_level":"expert opinion","sources":[{"title":"NASA OCHMO Technical Brief OCHMO-TB-002: Environmental Control and Life Support Systems (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/07/eclss-technical-brief-ochmo.pdf","year":2023},{"title":"MedlinePlus: Tension headache","url":"https://www.medlineplus.gov/ency/article/000797.htm","year":2025}]},{"id":"cm_screen_eye_rest","title":"20-20-20 eye rest and screen setup","category":"environment","steps":["Every 20 minutes, take a 20-second break and look at something about 20 feet (6 m) away.","Blink fully and deliberately several times during each break.","Keep the screen about 20-28 inches (50-70 cm) from your eyes and 15-20 degrees below eye level.","Reduce glare on the screen.","If blurring persists after breaks, request a vision check."],"duration":"20 s every 20 min","evidence_level":"expert opinion","sources":[{"title":"American Optometric Association: Most Americans Experience Digital Eye Strain from Overexposure to Computers According to Survey","url":"https://www.aoa.org/about-the-aoa/press-room/press-releases/most-americans-experience-digital-eye-strain-from-overexposure-to-computers-according-to-survey","year":2016}]}],"reference_ranges":{"hr_bpm":{"low":60,"high":100,"unit":"beats per minute","population":"Healthy adults at rest (sitting or lying, calm)","notes":"AHA and MedlinePlus normal adult resting range. Fit individuals often rest below 60. Emotions, pain, temperature, medications and standing up change HR. Use baseline-relative rules for interpretation; rPPG estimates have extra error.","sources":[{"title":"American Heart Association: All About Heart Rate (Pulse)","url":"https://u1-cd-heart.sc.heart.org/en/health-topics/high-blood-pressure/the-facts-about-high-blood-pressure/all-about-heart-rate-pulse","year":null},{"title":"MedlinePlus: Vital signs","url":"https://medlineplus.gov/ency/article/002341.htm","year":2025}]},"rmssd_ms":{"low":19,"high":75,"unit":"ms","population":"Healthy adults, short-term (about 5 min) resting recordings; 44 studies, 21,438 participants","notes":"Nunan et al. 2010 short-term norm: mean 42 (SD 15) ms, range 19-75 ms (15 studies), reproduced in Shaffer & Ginsberg 2017 Table 6. RMSSD is the primary time-domain index of vagally mediated HRV. Conventional minimum recording is 5 min; ultra-short (10-60 s) measures are not standardized. Large inter-individual variation and decline with age: use personal baseline, not population limits, for decisions.","sources":[{"title":"Shaffer F, Ginsberg JP. An Overview of Heart Rate Variability Metrics and Norms. Front Public Health 5:258 (Table 6 reproduces Nunan et al. 2010 short-term norms)","url":"https://www.frontiersin.org/journals/public-health/articles/10.3389/fpubh.2017.00258","year":2017},{"title":"Nunan D, Sandercock GRH, Brodie DA. A quantitative systematic review of normal values for short-term heart rate variability in healthy adults. Pacing Clin Electrophysiol 33(11)","url":"https://bnu.repository.guildhe.ac.uk/id/eprint/9677/","year":2010}]},"rr_rpm":{"low":12,"high":18,"unit":"breaths per minute","population":"Healthy adults at rest","notes":"Current MedlinePlus Vital signs page (reviewed 2025) gives 12-18 breaths/min; many clinical sources quote 12-20. Rapid breathing at rest is listed among severe dehydration signs (MedlinePlus). Camera-derived RR is less accurate than contact methods.","sources":[{"title":"MedlinePlus: Vital signs","url":"https://medlineplus.gov/ency/article/002341.htm","year":2025}]},"blink_rate_min":{"low":12,"high":22,"unit":"blinks per minute","population":"Healthy adults, relaxed conditions","notes":"Normal spontaneous blink rate 12-15/min (Doughty 2001) and up to 22/min mean in relaxed conditions (Tsubota & Nakamori 1993), both as cited in Abusharha 2017; that study's own relaxed baseline was 19.7 +/- 9.1/min. Screen and reading tasks reduce blinking: by 56% in normal subjects during a demanding computer task (Himebaugh 2009); 17/min in conversation to 6/min reading on a screen in dry-eye patients (Schlote 2004). Very large individual variation: use baseline-relative rules. Blink duration is about 100-400 ms (Soukupova & Cech 2016). Blink frequency is listed as a drowsiness indicator in the local files but none gives a validated cut-off.","sources":[{"title":"Abusharha AA. Changes in blink rate and ocular symptoms during different reading tasks. Clin Optom 9:133-138","url":"https://rcastoragev2.blob.core.windows.net/a4c4ba95185916f9521c9177e6cc7d59/opto-9-133.PMC6118863.pdf","year":2017},{"title":"Soukupova T, Cech J. Real-Time Eye Blink Detection using Facial Landmarks. 21st Computer Vision Winter Workshop","url":"https://vision.fe.uni-lj.si/cvww2016/proceedings/papers/05.pdf","year":2016},{"title":"Eye state and yawning detection for fatigue (Sensors 24:7810)","url":"local:medical-data/sensors-24-07810.pdf","year":2024}]},"perclos_pct":{"low":0,"high":12,"unit":"% of time eyes at least 80% closed (P80)","population":"Drivers and laboratory sleep-deprivation subjects","notes":"Definition (P80): proportion of time in a minute that the eyes are at least 80% closed (Wierwille et al. 1994, FHWA/FMCSA tech brief FHWA-MCRT-98-006, 1998, Dinges et al.). Closed is usually defined as eyelid less than 20% open; some studies use less than 25% or 30% open. Fast blinks (under 250 ms, Dinges 1998; or under 400-500 ms) are excluded. Eye closure longer than 500 ms is treated as a behavioral microsleep. Abe 2023 review: definitions vary widely and there is no single accepted drowsiness cut-off. Example cut-offs in use: NHTSA/VTTI 2009 drowsy-driver warning study analysed episodes with manual PERCLOS above 12 (units presumed %, not confirmed in the excerpt read); local file applsci-15-00638 (2025) set a PERCLOS threshold of 0.2 (20%) over 3-s windows at 30 fps; local file sensors-24-07810 (2024) describes PERCLOS as percentage of time per minute that eyes are at least 80% closed. The 'high' value of 12 is a literature example, not a validated universal limit; prefer baseline-relative rules.","sources":[{"title":"FMCSA/FHWA Tech Brief FHWA-MCRT-98-006: PERCLOS: A Valid Psychophysiological Measure of Alertness As Assessed by Psychomotor Vigilance","url":"https://rosap.ntl.bts.gov/view/dot/113","year":1998},{"title":"Abe T. PERCLOS-based technologies for detecting drowsiness: current evidence and future directions. Sleep Advances 4(1):zpad006","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10108649/","year":2023},{"title":"NHTSA DOT HS 811 117: Assessment of a Drowsy Driver Warning System for Heavy-Vehicle Drivers: Final Report","url":"https://www.nhtsa.gov/sites/nhtsa.gov/files/811117.pdf","year":2009},{"title":"Driver fatigue detection with PERCLOS, mouth opening and head pose (Applied Sciences 15:638)","url":"local:medical-data/applsci-15-00638.pdf","year":2025},{"title":"Eye state and yawning detection for fatigue (Sensors 24:7810)","url":"local:medical-data/sensors-24-07810.pdf","year":2024}]},"yawn_per_10min":{"low":null,"high":null,"unit":"yawns per 10 minutes","population":"None","notes":"No validated absolute yawn-frequency threshold was found in the local files or in the sources opened. Local papers (sensors-24-07810, applsci-15-00638, 2025.naacl-demo.7, drowsiness thesis 20250804162141-2782-TL) treat yawning frequency as a fatigue sign and detect yawns per event (MAR above threshold), but give no normal rate. Use baseline-relative rules only.","sources":[{"title":"Eye state and yawning detection for fatigue (Sensors 24:7810)","url":"local:medical-data/sensors-24-07810.pdf","year":2024},{"title":"Drowsiness detection and alerting on an embedded system (thesis, 2025)","url":"local:medical-data/drowsiness-detection-thesis.pdf","year":2025}]},"ear_closed_threshold":{"low":0.2,"high":0.25,"unit":"eye aspect ratio (dimensionless)","population":"Adults in webcam/driver datasets (68-point dlib landmarks)","notes":"EAR = (|p2-p6| + |p3-p5|) / (2|p1-p4|). Soukupova & Cech 2016 use a baseline threshold of 0.2 (not derived; noted to fail with smiling, side views and long closures); measured open-eye EAR about 0.4 +/- 0.1 and closed about 0.05 +/- 0.05. Local thesis 20250804162141-2782-TL (BUAP 2025) uses 0.25 (taken from Thi Hien et al.) and notes a fully closed eye falls below 0.1; its implementation averages EAR over 30 consecutive frames and multiplies the user's thresholds by calibration factors before raising an eye-closure alert. sensors-24-07810 uses the same EAR formula (reports 94.9% accuracy for EAR-only methods in a separate study). Recommendation: calibrate per user (for example a fraction of the person's open-eye EAR) rather than a fixed value.","sources":[{"title":"Soukupova T, Cech J. Real-Time Eye Blink Detection using Facial Landmarks. 21st Computer Vision Winter Workshop","url":"https://vision.fe.uni-lj.si/cvww2016/proceedings/papers/05.pdf","year":2016},{"title":"Drowsiness detection and alerting on an embedded system (thesis, 2025)","url":"local:medical-data/drowsiness-detection-thesis.pdf","year":2025},{"title":"Eye state and yawning detection for fatigue (Sensors 24:7810)","url":"local:medical-data/sensors-24-07810.pdf","year":2024}]},"mar_yawn_threshold":{"low":0.7,"high":null,"unit":"mouth aspect ratio (dimensionless)","population":"Drivers (dlib 68-point outer-lip landmarks 49-60)","notes":"Local thesis 20250804162141-2782-TL (2025), following Thi Hien et al., computes MAR = (|p2-p12| + |p3-p11| + |p4-p10| + |p5-p9| + |p6-p8|) / (5|p1-p7|) on outer-lip points and classifies any MAR above 0.7 as a yawn. The value depends on the exact MAR formula and landmark set, so it must be re-checked if a different formula is used. applsci-15-00638 (2025) uses a different metric (POM, percentage of mouth opening over time) with a threshold of 0.5 in 3-s windows; 2025.naacl-demo.7 compares lip-to-center distance ratios with an unspecified threshold.","sources":[{"title":"Drowsiness detection and alerting on an embedded system (thesis, 2025)","url":"local:medical-data/drowsiness-detection-thesis.pdf","year":2025},{"title":"Driver fatigue detection with PERCLOS, mouth opening and head pose (Applied Sciences 15:638)","url":"local:medical-data/applsci-15-00638.pdf","year":2025},{"title":"Facial analysis of consecutive frames for fatigue detection (NAACL 2025 demo paper)","url":"local:medical-data/2025.naacl-demo.7.pdf","year":2025}]},"head_pose":{"low":-16,"high":16,"unit":"degrees of pitch","population":"Drivers (68-point landmark Euler angles)","notes":"2025.naacl-demo.7 (Xie & Fan, NAACL 2025 demo) recommends judging head nodding/inclination with Pitch <= -16 deg or >= 16 deg and Roll <= -35 deg or >= 35 deg, noting angles may deviate and can be tuned; it flags inattentiveness at Yaw +/-60 deg, Pitch +/-30 deg, Roll +/-30 deg, and raises an alert when more than five frames in the buffer indicate fatigue. applsci-15-00638 (2025) estimates yaw, pitch and roll with HOPEnet and classifies head state (still, looking aside, nodding) with machine learning but gives no numeric angle threshold. These are driver-monitoring values; in microgravity posture differs, so use the person's own baseline for head_stability_pct.","sources":[{"title":"Facial analysis of consecutive frames for fatigue detection (NAACL 2025 demo paper)","url":"local:medical-data/2025.naacl-demo.7.pdf","year":2025},{"title":"Driver fatigue detection with PERCLOS, mouth opening and head pose (Applied Sciences 15:638)","url":"local:medical-data/applsci-15-00638.pdf","year":2025}]},"co2_mmHg":{"low":0,"high":3.0,"unit":"mmHg partial pressure of CO2 (ppCO2)","population":"Spacecraft habitable volume (crew)","notes":"NASA-STD-3001 V2 6004: average one-hour ppCO2 at or below 3 mmHg (reduced from an earlier 3.8-7.5 mmHg range); ISS flight rule since 2016 also targets a 24-hour average of 3.00 mmHg. A 7-day average below 2.5 mmHg keeps headache risk under 1%. Reported symptoms: headache at 2.8-4.5 mmHg; chronic cough, poor sleep, blurred vision and frontal headache around 3.5 mmHg; fatigue, malaise, decreased sleep and nausea above 4.5 mmHg. Not measurable by the camera; must come from ECLSS telemetry.","sources":[{"title":"NASA OCHMO Technical Brief OCHMO-TB-004: Carbon Dioxide (Rev D)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-004-carbon-dioxide.pdf","year":2026},{"title":"NASA OCHMO Technical Brief OCHMO-TB-002: Environmental Control and Life Support Systems (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/07/eclss-technical-brief-ochmo.pdf","year":2023}]}},"questionnaire":{"title":"ASTRAVITA wellbeing check-in","recall_period":"Over the last 2 weeks, unless the question says otherwise (sleepiness: right now; sleep hours: last 24 hours; medication: last 72 hours).","instructions":"There are no right or wrong answers. Your answers help the app give a more accurate orientation; they are not a diagnosis.","items":[{"id":"q_mood_low","text":"Over the last 2 weeks, how often have you been bothered by feeling down, depressed, or hopeless?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"PHQ2","validated":true,"note":"PHQ-2 item 2 (public domain wording). PHQ-2 total = q_anhedonia + q_mood_low (0-6); total >= 3 suggests follow-up with PHQ-9.","short":"Low mood (PHQ-2)"},{"id":"q_anhedonia","text":"Over the last 2 weeks, how often have you been bothered by little interest or pleasure in doing things?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"PHQ2","validated":true,"note":"PHQ-2 item 1 (public domain wording).","short":"Little interest or pleasure (PHQ-2)"},{"id":"q_nervous","text":"Over the last 2 weeks, how often have you been bothered by feeling nervous, anxious or on edge?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"GAD2","validated":true,"note":"GAD-2 item 1. GAD-2 total = q_nervous + q_worry (0-6); total >= 3 suggests further evaluation.","short":"Nervous or on edge (GAD-2)"},{"id":"q_worry","text":"Over the last 2 weeks, how often have you been bothered by not being able to stop or control worrying?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"GAD2","validated":true,"note":"GAD-2 item 2.","short":"Uncontrolled worry (GAD-2)"},{"id":"q_sleep_quality","text":"Over the last 2 weeks, how would you rate your overall sleep quality?","type":"scale","options":[{"value":0,"label":"Very good"},{"value":1,"label":"Fairly good"},{"value":2,"label":"Fairly poor"},{"value":3,"label":"Very poor"}],"source_key":"ISI","validated":false,"note":"Single global item informed by the Insomnia Severity Index (sleep satisfaction); not a validated stand-alone scale.","short":"Poor sleep quality"},{"id":"q_sleep_hours","text":"About how many hours did you actually sleep in the last 24 hours (including naps)?","type":"number","source_key":"CDC_SLEEP","min":0,"max":24,"step":0.5,"unit":"hours","validated":false,"note":"Adults need at least 7 hours per day (CDC); in-flight averages were about 6 h (Barger 2014).","short":"Hours of sleep"},{"id":"q_sleepiness","text":"How sleepy do you feel right now?","type":"scale","options":[{"value":1,"label":"Extremely alert"},{"value":2,"label":"Very alert"},{"value":3,"label":"Alert"},{"value":4,"label":"Rather alert"},{"value":5,"label":"Neither alert nor sleepy"},{"value":6,"label":"Some signs of sleepiness"},{"value":7,"label":"Sleepy, but no effort to keep awake"},{"value":8,"label":"Sleepy, some effort to keep awake"},{"value":9,"label":"Very sleepy, great effort to keep awake, fighting sleep"}],"source_key":"KSS","validated":true,"note":"Karolinska Sleepiness Scale 1-9 (Akerstedt & Gillberg 1990); anchors follow the commonly used 9-label version.","short":"Sleepiness (KSS)"},{"id":"q_lonely","text":"Over the last 2 weeks, how often have you felt isolated from others or lacking companionship?","type":"scale","options":[{"value":0,"label":"Hardly ever"},{"value":1,"label":"Some of the time"},{"value":2,"label":"Often"},{"value":3,"label":"Nearly all the time"}],"source_key":"UCLA3","validated":false,"note":"Adapted from the 3-item UCLA loneliness scale (Hughes 2004), which uses three options (hardly ever / some of the time / often) per item; a fourth option was added to match the app's 0-3 scale.","short":"Loneliness"},{"id":"q_workload","text":"Over the last 2 weeks, how often has your workload felt like more than you could manage?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"NASA_SLEEP_RISK","validated":false,"note":"Project item; 3 = overwhelming nearly every day.","short":"Overwhelming workload"},{"id":"q_irritability","text":"Over the last arly every day"}],"source_key":"PHQ9","validated":false,"note":"Adapted from a PHQ-9 item.","short":"Low energy"},{"id":"q_cold_intolerance","text":"Over the last 2 weeks, how often have you felt unusually cold when others were comfortable?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"LOCAL_INV","validated":false,"note":"Project item; used mainly by endocrine/nutritional conditions (agent B).","short":"Feeling cold"},{"id":"q_appetite_change","text":"Over the last 2 weeks, how often have you been bothered by poor appetite or overeating?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"PHQ9","validated":false,"note":"Adapted from a PHQ-9 item.","short":"Appetite change"},{"id":"q_concentration","text":"Over the last 2 weeks, how often have you had trouble concentrating on things, such as reading or monitoring tasks?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"PHQ9","validated":false,"note":"Adapted from a PHQ-9 item.","short":"Difficulty concentrating"},{"id":"q_med_change","text":"In the last 72 hours, have you started or changed any medication, sleep aid or stimulant?","type":"yesno","options":[{"value":0,"label":"No"},{"value":1,"label":"Yes"}],"source_key":"BARGER2014","validated":false,"note":"Medication can alter sleep, heart rate and alertness; about 75% of ISS crew reported using sleep medication at some point (Barger 2014).","short":"New or changed medication"},{"id":"q_homesick","text":"Over the last 2 weeks, how often have you been bothered by missing home or worrying about family on Earth?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"KANAS2016","validated":false,"note":"Project item.","short":"Homesickness"},{"id":"q_boredom","text":"Over the last 2 weeks, how often have you felt bored or that every day is the same?","type":"scale","options":[{"value":0,"label":"Not at all"},{"value":1,"label":"Several days"},{"value":2,"label":"More than half the days"},{"value":3,"label":"Nearly every day"}],"source_key":"HRP_BMED","validated":false,"note":"Project item.","short":"Boredom / monotony"},{"id":"q_mission_phase","text":"Which part of the mission are you in now?","type":"scale","options":[{"value":1,"label":"First quarter"},{"value":2,"label":"Second quarter"},{"value":3,"label":"Third quarter"},{"value":4,"label":"Fourth (final) quarter"}],"source_key":"HRP_BMED","validated":false,"note":"Used for adjustment and third-quarter patterns; can be filled automatically from the mission timeline.","short":"Mission quarter"}],"safety_item":{"id":"q_safety","text":"Over the last 2 weeks, have you had thoughts that you would be better off dead, or of hurting yourself in some way?","type":"yesno","options":[{"value":0,"label":"No"},{"value":1,"label":"Yes"}],"source_key":"PHQ9","note":"Wording adapted from PHQ-9 item 9 to a yes/no format. Any 'yes' triggers the app safety protocol (immediate contact with the flight surgeon / behavioral health team; on Earth, local emergency services or a crisis line such as 988 in the US). Never used in condition scoring."},"scoring_notes":["PHQ-2 total = q_anhedonia + q_mood_low (0-6); >= 3 is the validated screening cut-point (Kroenke 2003).","GAD-2 total = q_nervous + q_worry (0-6); >= 3 is the preferred cut-point (Kroenke 2007).","A positive PHQ-2 or GAD-2 is not a diagnosis; follow with PHQ-9 / GAD-7 or a clinician interview (PHQ-9 >= 10 and GAD-7 >= 10 are the moderate thresholds; Kroenke 2001, Spitzer 2006).","KSS (1-9): higher = sleepier; scores rise with time awake and vary with time of day."],"sources":[{"key":"BARGER2014","title":"Barger LK, Flynn-Evans EE, Kubey A, et al. Prevalence of sleep deficiency and use of hypnotic drugs in astronauts before, during, and after spaceflight: an observational study. Lancet Neurol 2014 (ScienceDaily summary)","url":"https://sciencedaily.com/releases/2014/08/140807215803.htm","year":2014},{"key":"CDC_SLEEP","title":"CDC FastStats: Sleep in Adults","url":"https://www.cdc.gov/sleep/data-and-statistics/Adults.html","year":2024},{"key":"GAD2","title":"Kroenke K, Spitzer RL, Williams JB, Monahan PO, Lowe B. Anxiety disorders in primary care: prevalence, impairment, comorbidity, and detection. Ann Intern Med 2007;146:317-25","url":"https://www.hiv.uw.edu/page/mental-health-screening/gad-2","year":2007},{"key":"GAD7","title":"Spitzer RL, Kroenke K, Williams JBW, Lowe B. A brief measure for assessing generalized anxiety disorder: the GAD-7. Arch Intern Med 2006;166:1092-1097","url":"https://depts.washington.edu/psychres/wordpress/wp-content/uploads/2017/09/gad7_inst.pdf","year":2006},{"key":"HRP_BMED","title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016},{"key":"ISI","title":"Insomnia Severity Index (Morin CM, Universite Laval) - items and scoring bands","url":"https://www.med.upenn.edu/snaplab/assets/user-content/documents/insomnia-severity-index.pdf","year":null},{"key":"KANAS2016","title":"Kanas N. Psychiatric Issues in Space. Psychiatric Times 33(6)","url":"https://www.psychiatrictimes.com/view/psychiatric-issues-space","year":2016},{"key":"KSS","title":"Akerstedt T, Gillberg M. Subjective and objective sleepiness in the active individual. Int J Neurosci 1990;52:29-37 (KSS chapter, UPenn CBT-I)" /* =====================================================================
   ASTRAVITA — core utilities (namespace, DOM helpers, icons, toasts)
   Exploratory orientation tool; not a clinical diagnostic device.
   ===================================================================== */
'use strict';
const ASTRAVITA = window.ASTRAVITA = {version: '5.0.0'};

ASTRAVITA.util = (() => {
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const fin = v => typeof v === 'number' && Number.isFinite(v);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const mean = a => { let s = 0, n = 0; for (const x of a) if (fin(x)) { s += x; n++; } return n ? s / n : NaN; };
  const std = a => { const m = mean(a); let s = 0, n = 0; for (const x of a) if (fin(x)) { s += (x - m) ** 2; n++; } return Math.sqrt(n ? s / n : 0) || 1e-9; };
  const median = a => { const s = a.filter(fin).sort((x, y) => x - y); if (!s.length) return NaN; const h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
  const rnd = (v, d = 1) => fin(v) ? Math.round(v * 10 ** d) / 10 ** d : null;
  const fmt = (v, d = 0) => fin(v) ? (Math.abs(v) < 0.5 * 10 ** -d ? 0 : v).toFixed(d) : '—';
  const sgn = (v, d = 0) => fin(v) ? (v >= 0.5 * 10 ** -d ? '+' : '') + fmt(v, d) : '—';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const LOCALE = 'en-US';
  const dtFmt = new Intl.DateTimeFormat(LOCALE, {month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'});
  const dFmt = new Intl.DateTimeFormat(LOCALE, {month: 'short', day: 'numeric'});
  const dLong = new Intl.DateTimeFormat(LOCALE, {weekday: 'short', month: 'short', day: 'numeric'});
  const tFmt = new Intl.DateTimeFormat(LOCALE, {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false});
  const dateTime = d => d ? dtFmt.format(new Date(d)) : '—';
  const dateShort = d => d ? dFmt.format(new Date(d)) : '—';
  const dateLong = d => d ? dLong.format(new Date(d)) : '—';
  const timeStr = d => tFmt.format(new Date(d));
  const duration = s => { if (!fin(s)) return '—'; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h} h ${String(m).padStart(2, '0')} min` : m ? `${m} min ${String(x).padStart(2, '0')} s` : `${x} s`; };
  const ago = d => { const s = (Date.now() - new Date(d)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} h ago`; const days = Math.floor(s / 86400); return days === 1 ? 'yesterday' : `${days} days ago`; };
  const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
  const initials = name => String(name || '?').replace(/^(Dr\.?|Cmdr\.?)\s+/i, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
  const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfWeek = d => { const x = startOfDay(d); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };   // Monday
  const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
  // deterministic PRNG (mulberry32) for reproducible demo data
  const prng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; };
  const debounce = (fn, ms) => { let to; return (...a) => { clearTimeout(to); to = setTimeout(() => fn(...a), ms); }; };
  const b64 = {
    enc: buf => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); },
    dec: str => Uint8Array.from(atob(str), c => c.charCodeAt(0))
  };
  return {$, $$, fin, clamp, mean, std, median, rnd, fmt, sgn, esc, uid, dateTime, dateShort, dateLong, timeStr, duration, ago, plural, initials, startOfDay, addDays, startOfWeek, dayKey, prng, h, debounce, b64, LOCALE};
})();
