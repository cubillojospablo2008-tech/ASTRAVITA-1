"absolute","weight":5,"note":"Shift occurs within the first 6-10 h of microgravity, symptoms most noticeable early (Ax 2025)"}],"questionnaire_triggers":["q_congestion>=2","q_headache>=1","q_sleep_quality>=2","q_low_energy>=1","q_concentration>=1","q_mission_phase<=1"],"probable_causes":["Headward redistribution of blood and cerebrospinal fluid in microgravity","Engorgement of nasal venous tissue","Possible additive vasodilating effect of elevated cabin CO2","Pressure changes between station and suit during EVA preparation (Eustachian tube dysfunction)"],"isolation_relevance":"Fluid shift is present for the whole time in weightlessness, so congestion, head fullness and the poor sleep it causes can persist for months and lower mood, patience and concentration in a confined crew that cannot simply step outside.","orientative_interpretation":"Your answers may indicate head fullness or nasal congestion that is common in weightlessness. This physical pattern can make you feel tired, irritable or foggy, so it is worth separating it from emotional strain before drawing conclusions about mood. Consider discussing it with your flight surgeon if it disturbs your sleep.","countermeasure_ids":["cm_thigh_cuffs","cm_co2_ventilation_check","cm_hydration_check","cm_head_elevation_rest","cm_flight_surgeon_review","cm_vision_check"],"escalation_criteria":"Involve the flight surgeon if congestion or headache persists for more than a few days, disturbs sleep on most nights, needs repeated decongestant use, or comes with any change in vision.","red_flags":["New blurred near or distance vision or visual spots","Severe or sudden headache","Facial pain with fever (possible sinus infection)","Ear pain or hearing change after pressure changes"],"camera_limits":"The camera cannot see facial puffiness reliably, cannot measure nasal airflow, intracranial pressure or fluid volumes; heart rate, HRV and expression features are not specific to fluid shift. This pattern rests mainly on self-report.","statistics":[{"measure":"Nasal congestion reported","value":"75% of ISS astronauts; 60 of 71 astronauts had at least one sinonasal issue","year":2025,"population":"ISS astronauts 2000-2019","region":"International (ISS)","source":"Texas A&M Stories (Khan, Takashima et al.)"},{"measure":"In-flight nasal congestion reported at debriefing","value":"62% of crew","year":2025,"population":"Space Shuttle crew members","region":"USA (Shuttle program)","source":"Ax et al., Front Physiol 2025"},{"measure":"Fluid volume shifted toward head","value":"about 2 L within the first 6-10 h","year":2025,"population":"Astronauts in microgravity","region":"Spaceflight","source":"Ax et al., Front Physiol 2025"}],"sources":[{"title":"Ax et al. On the nose: nasal neurostimulation as a technology countermeasure for sinonasal congestion in astronauts. Front Physiol 16","url":"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2025.1536496/full","year":2025},{"title":"Texas A&M Stories: Most astronauts aboard ISS suffer from sinonasal congestion, study finds (Khan, Takashima et al.)","url":"https://stories.tamu.edu/news/2025/10/30/most-astronauts-aboard-iss-suffer-from-sinonasal-congestion-study-finds/","year":2025},{"title":"NASA HRP: Risk of Spaceflight Associated Neuro-ocular Syndrome (SANS)","url":"https://www.nasa.gov/reference/risk-of-spaceflight-associated-neuro-ocular-syndrome-sans","year":2025},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}]},{"id":"elevated_co2_pattern","name":"Pattern consistent with effects of elevated cabin CO2","category":"environmental","summary":"Cabin CO2 above about 3 mmHg has been associated with headache, fatigue, poor sleep and reduced concentration in spaceflight; these can look like stress or low mood.","indicator_rules":[{"indicator":"q_headache","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Headaches reported at 2.8-4.5 mmHg ppCO2, worsening with higher CO2 (OCHMO-TB-004)"},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"CO2-related performance concerns; expert opinion, no validated questionnaire cut-off"},{"indicator":"q_low_energy","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Fatigue and malaise reported above 4.5 mmHg (OCHMO-TB-004)"},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Poor sleep reported around 3.5 mmHg; hypercapnia listed among sleep disruptors (OCHMO-TB-004; local CNS file)"},{"indicator":"q_congestion","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"CO2 is a vasodilator that may add to nasal engorgement (Ax 2025)"},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":10,"note":"Non-specific; no validated absolute threshold"},{"indicator":"perclos_pct","op":">","threshold":25,"ref":"baseline_pct","weight":10,"note":"Drowsiness sign; non-specific; baseline-relative because no CO2-specific threshold exists"},{"indicator":"q_sleepiness","op":">=","threshold":6,"ref":"absolute","weight":5,"note":"KSS 6+ = some signs of sleepiness; non-specific"}],"questionnaire_triggers":["q_headache>=2","q_concentration>=2","q_low_energy>=1","q_sleep_quality>=2","q_congestion>=1","q_sleepiness>=6"],"probable_causes":["Cabin ppCO2 above the 3 mmHg one-hour limit (NASA-STD-3001 V2 6004)","Local CO2 pockets from poor airflow (for example in sleep stations or near scrubber-distant nodes)","Scrubber (CDRA/Vozdukh) degradation or extra crew","Individual sensitivity, worsened by fluid shift"],"isolation_relevance":"In a sealed habitat the crew breathes the same recycled air for months; CO2 can rise with equipment issues and is invisible, so headache and fatigue that several crew share may have an environmental rather than a psychological cause.","orientative_interpretation":"Your answers may indicate headache and tiredness of the kind that has been linked to elevated cabin CO2. This is an environmental check, not a judgement about your mental state. It may help to look at the cabin CO2 reading and airflow before interpreting the rest of this session.","countermeasure_ids":["cm_co2_ventilation_check","cm_hydration_check","cm_flight_surgeon_review","cm_aerobic_session","cm_thermal_comfort"],"escalation_criteria":"Report to the flight surgeon and ground if several crew members report headache at the same time, if ppCO2 telemetry stays above 3 mmHg, or if headache persists after moving to a well-ventilated area.","red_flags":["Several crew with simultaneous headache or confusion","Shortness of breath or rapid breathing at rest","Confusion or marked drowsiness","Visual disturbance"],"camera_limits":"The camera cannot measure CO2. Facial and cardiac indicators cannot separate CO2 effects from fatigue, stress or fluid shift; this pattern must be confirmed with ECLSS ppCO2 telemetry.","statistics":[{"measure":"Headache risk threshold","value":"7-day average ppCO2 below 2.5 mmHg keeps headache risk under 1%","year":2026,"population":"ISS crew","region":"International (ISS)","source":"NASA OCHMO-TB-004 Rev D"},{"measure":"Symptom ranges reported","value":"Headache 2.8-4.5 mmHg; fatigue, malaise, decreased sleep, nausea above 4.5 mmHg","year":2026,"population":"Spaceflight crews (anecdotal data)","region":"Spaceflight","source":"NASA OCHMO-TB-004 Rev D"}],"sources":[{"title":"NASA OCHMO Technical Brief OCHMO-TB-004: Carbon Dioxide (Rev D)","url":"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-004-carbon-dioxide.pdf","year":2026},{"title":"NASA OCHMO Technical Brief OCHMO-TB-002: Environmental Control and Life Support Systems (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/07/eclss-technical-brief-ochmo.pdf","year":2023},{"title":"Ax et al. On the nose: nasal neurostimulation as a technology countermeasure for sinonasal congestion in astronauts. Front Physiol 16","url":"https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2025.1536496/full","year":2025},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}]},{"id":"iron_deficiency_signs","name":"Pattern consistent with possible low iron status (worth a lab check)","category":"nutritional","summary":"Low iron can cause weakness, fatigue, reduced energy and trouble focusing or remembering, which overlap with depression and sleep loss. Only a blood test can confirm it.","indicator_rules":[{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Fatigue, weakness, reduced energy (NIH ODS iron; local anemia table)"},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Trouble focusing or remembering (NIH ODS iron; local anemia table)"},{"indicator":"q_cold_intolerance","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Anemia reduces tolerance for temperature regulation (NIH ODS iron)"},{"indicator":"q_sleepiness","op":">=","threshold":6,"ref":"absolute","weight":10,"note":"Non-specific tiredness"},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":15,"note":"Non-specific; no validated camera marker of iron status"},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":15,"note":"Non-specific decline vs personal baseline"}],"questionnaire_triggers":["q_low_energy>=2","q_concentration>=2","q_cold_intolerance>=1","q_sleepiness>=6"],"probable_causes":["Insufficient intake or poor absorption of iron","Blood loss (for example heavy menstrual periods, frequent blood draws)","Gastrointestinal disorders"],"isolation_relevance":"Fatigue and poor focus on a long mission are easily attributed to stress or monotony. Note that in spaceflight iron stores tend to rise rather than fall (serum ferritin increased 34% after ISS flights), so deficiency is less likely in flight and self-supplementing is not advised.","orientative_interpretation":"Your answers describe low energy and difficulty concentrating that can have many causes, including nutritional ones such as low iron. The camera cannot assess this. It may be worth asking your flight surgeon whether a lab panel is appropriate before assuming the cause is psychological.","countermeasure_ids":["cm_lab_panel_request","cm_iron_diet_review","cm_regular_meals","cm_flight_surgeon_review"],"escalation_criteria":"Request a lab panel with the flight surgeon if low energy and poor concentration persist for two weeks or more despite adequate sleep. Do not start iron supplements without medical guidance.","red_flags":["Shortness of breath or chest discomfort on light exertion","Fainting or near-fainting","Visible bleeding or black stools","Marked pallor"],"camera_limits":"No camera indicator can detect iron status. Skin color from a webcam is not reliable for pallor and HR/HRV changes are non-specific. Questionnaire items carry most of the weight and the orientation is only to consider a lab panel with your flight surgeon.","statistics":[{"measure":"Anemia prevalence","value":"30% of women aged 15-49; 37% of pregnant women; 40% of children 6-59 months","year":2019,"population":"Women 15-49, pregnant women, children","region":"Global","source":"WHO, cited in local file disease-database-extension-b"},{"measure":"Change in serum ferritin after long-duration flight","value":"+34% (P<0.001)","year":null,"population":"ISS crew members (Expeditions 1-12)","region":"International (ISS)","source":"Smith SM, Zwart SR. Nutrition issues for space exploration (NASA NTRS)"}],"sources":[{"title":"NIH Office of Dietary Supplements: Iron - Fact Sheet for Consumers","url":"https://ods.od.nih.gov/factsheets/iron-Consumer/","year":2023},{"title":"Disease database extension, part B (sections 19 onward)","url":"local:medical-data/disease-database-extension-b.pdf","year":null},{"title":"Smith SM, Zwart SR. Nutrition issues for space exploration (NASA NTRS)","url":"https://ntrs.nasa.gov/api/citations/20060049121/downloads/20060049121.pdf","year":null}],"gate":{"any":["q_cold_intolerance"],"cap":34,"note":"Non-specific pattern: shown only when at least one more specific sign is present."},"weight_factor":0.8},{"id":"b12_deficiency_signs","name":"Pattern consistent with possible low vitamin B12 status (worth a lab check)","category":"nutritional","summary":"Low vitamin B12 can cause fatigue, weakness, numbness or tingling, balance problems and, in more severe cases, confusion or cognitive change that can resemble depression or cognitive fatigue.","indicator_rules":[{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Fatigue and weakness (local anemia table; MedlinePlus B12)"},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":25,"note":"B12 tested in confusion or loss of cognitive function (MedlinePlus B12)"},{"indicator":"q_mood_low","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Overlap with depressive symptoms; non-specific"},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":15,"note":"Non-specific; no validated camera marker"},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":15,"note":"Non-specific decline vs personal baseline"}],"questionnaire_triggers":["q_low_energy>=2","q_concentration>=2","q_mood_low>=2"],"probable_causes":["Low dietary intake of B12 (diets low in animal-derived or fortified foods)","Reduced absorption (for example pernicious anemia)","Certain long-term medications"],"isolation_relevance":"On long missions with a fixed menu, a nutrient gap can develop slowly; its symptoms (tiredness, foggy thinking, low mood) can be misread as isolation effects.","orientative_interpretation":"Your answers describe tiredness and difficulty thinking clearly, which can sometimes relate to vitamin B12 status. The camera cannot assess this. Consider a lab panel with your flight surgeon, especially if you also notice tingling, numbness or unsteadiness.","countermeasure_ids":["cm_lab_panel_request","cm_b12_review","cm_regular_meals","cm_flight_surgeon_review"],"escalation_criteria":"Request a lab panel (B12, with methylmalonic acid confirmation if low) if fatigue and concentration difficulty persist for two weeks or more, or sooner if numbness, tingling or balance problems appear.","red_flags":["Numbness or tingling in arms or legs","Loss of balance","Confusion or memory loss","Sore, swollen tongue with marked fatigue"],"camera_limits":"No camera indicator can detect B12 status. Reduced expressivity or fatigue indicators are non-specific. Questionnaire items carry most of the weight and the orientation is only to consider a lab panel with your flight surgeon.","statistics":[{"measure":"Serum B12 normal range","value":"299-1054 pg/mL (219-773 pmol/L); below 299 pg/mL possible deficiency","year":2026,"population":"Adults (laboratory reference)","region":"USA","source":"MedlinePlus: Vitamin B12 level"}],"sources":[{"title":"MedlinePlus: Vitamin B12 level","url":"https://medlineplus.gov/ency/article/003705.htm","year":2026},{"title":"Disease database extension, part B (sections 19 onward)","url":"local:medical-data/disease-database-extension-b.pdf","year":null}],"gate":{"any":["q_appetite_change","q_mood_low"],"cap":34,"note":"Non-specific pattern: shown only when at least one more specific sign is present."},"weight_factor":0.8},{"id":"vitamin_d_deficiency_signs","name":"Pattern consistent with possible low vitamin D status (worth a lab check)","category":"nutritional","summary":"Without sunlight, vitamin D status can fall; low levels cause muscle weakness and pain and are associated (observationally) with depression, although supplements have not been shown to treat depression in trials.","indicator_rules":[{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Muscle weakness and pain with inadequate vitamin D (NIH ODS vitamin D)"},{"indicator":"q_mission_phase","op":">=","threshold":3,"ref":"absolute","weight":15,"note":"No UVB exposure in the habitat; ISS 25(OH)D fell 27% by end of flight despite 400 IU/day (Smith & Zwart)"},{"indicator":"q_mood_low","op":">=","threshold":1,"ref":"absolute","weight":15,"note":"Observational association only; RCTs show no treatment effect on depression (NIH ODS vitamin D)"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":15,"note":"Non-specific; expert opinion"},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":15,"note":"Non-specific; no validated camera marker"},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":10,"note":"Non-specific decline vs personal baseline"}],"questionnaire_triggers":["q_low_energy>=2","q_mission_phase>=3","q_mood_low>=1","q_concentration>=1"],"probable_causes":["No UVB exposure (window glass blocks UVB; spacecraft are fully shielded)","Low dietary intake (few natural food sources)","Low supplement adherence"],"isolation_relevance":"Spacecraft and polar or underground analogs provide no skin vitamin D synthesis, so status depends on diet and supplements for the whole mission; muscle aches and low energy may be read as low motivation.","orientative_interpretation":"Your answers describe low energy that, after a long time without sunlight, can sometimes relate to vitamin D status. The camera cannot assess this. Consider a lab panel with your flight surgeon; note that vitamin D supplements are not a treatment for low mood on their own.","countermeasure_ids":["cm_lab_panel_request","cm_vitamin_d_review","cm_resistance_session","cm_flight_surgeon_review"],"escalation_criteria":"Request a 25(OH)D measurement with the flight surgeon if muscle weakness or aches and low energy persist for two weeks or more, especially in the second half of a mission. Do not exceed the 4,000 IU/day upper limit without medical advice.","red_flags":["Bone pain or new fracture","Muscle spasms or cramps with tingling","Persistent low mood (follow the psychological pathway as well)"],"camera_limits":"No camera indicator can detect vitamin D status. Mood and fatigue indicators are non-specific. Questionnaire items carry most of the weight and the orientation is only to consider a lab panel with your flight surgeon.","statistics":[{"measure":"25(OH)D change after long-duration flight","value":"27% lower post-flight than pre-flight (P<0.001) despite 400 IU/day","year":null,"population":"15 US ISS crew members","region":"International (ISS)","source":"Smith SM, Zwart SR. Nutrition issues for space exploration (NASA NTRS)"},{"measure":"Serum 25(OH)D cut-offs","value":"<30 nmol/L (12 ng/mL) deficiency; 30-<50 nmol/L inadequate; >=50 nmol/L (20 ng/mL) adequate; >125 nmol/L possible adverse effects","year":2026,"population":"General population","region":"USA","source":"NIH ODS Vitamin D Health Professional fact sheet"}],"sources":[{"title":"NIH Office of Dietary Supplements: Vitamin D - Fact Sheet for Health Professionals","url":"https://ods.od.nih.gov/factsheets/vitaminD-healthProfessional/","year":2026},{"title":"Smith SM, Zwart SR. Nutrition issues for space exploration (NASA NTRS)","url":"https://ntrs.nasa.gov/api/citations/20060049121/downloads/20060049121.pdf","year":null}],"gate":{"any":["q_mission_phase"],"cap":34,"note":"Non-specific pattern: shown only when at least one more specific sign is present."},"weight_factor":0.8},{"id":"hypothyroid_mood_effects","name":"Pattern consistent with possible underactive thyroid effects on mood and energy (worth a lab check)","category":"endocrine","summary":"Hypothyroidism can cause fatigue, cold intolerance, weight gain, slowed heart rate and depression; it is common and often mild, and only blood tests can confirm it.","indicator_rules":[{"indicator":"q_cold_intolerance","op":">=","threshold":2,"ref":"absolute","weight":25,"note":"Trouble tolerating cold (NIDDK hypothyroidism)"},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Fatigue (NIDDK hypothyroidism)"},{"indicator":"q_mood_low","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Depression listed as symptom (NIDDK hypothyroidism)"},{"indicator":"hr_bpm","op":"<","threshold":-10,"ref":"baseline_pct","weight":10,"note":"Slowed heart rate (NIDDK hypothyroidism); baseline-relative, no validated absolute cut-off for thyroid"},{"indicator":"hr_bpm","op":"<","threshold":60,"ref":"absolute","weight":5,"note":"Below AHA/MedlinePlus adult resting range 60-100; fit people are often lower, so low weight"},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":10,"note":"Non-specific"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Non-specific overlap with fatigue and low mood"},{"indicator":"q_appetite_change","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Weight gain listed (NIDDK); proxy item"}],"questionnaire_triggers":["q_cold_intolerance>=2","q_low_energy>=2","q_mood_low>=2","q_concentration>=1","q_appetite_change>=1"],"probable_causes":["Underactive thyroid gland (often autoimmune)","Iodine deficiency (rare with fortified diets)","Some medications"],"isolation_relevance":"Low mood and tiredness on a long mission are usually attributed to isolation, but a slowly developing thyroid problem produces the same picture; a simple blood test can separate them.","orientative_interpretation":"Your answers combine tiredness, feeling cold and low mood, a combination that can sometimes relate to thyroid function. The camera cannot assess this. Consider a lab panel with your flight surgeon alongside any psychological support.","countermeasure_ids":["cm_lab_panel_request","cm_flight_surgeon_review","cm_thermal_comfort","cm_aerobic_session"],"escalation_criteria":"Request thyroid blood tests with the flight surgeon if fatigue, cold intolerance and low mood persist for two weeks or more. Follow the behavioral health pathway in parallel if low mood is marked.","red_flags":["Very slow heart rate with dizziness or fainting","Marked confusion or drowsiness","Swelling at the front of the neck","Thoughts of self-harm (follow the app safety protocol)"],"camera_limits":"The camera cannot measure thyroid function. A lower heart rate is common in fit people and reduced expressivity is non-specific; questionnaire items carry most of the weight and the orientation is only to consider a lab panel with your flight surgeon.","statistics":[{"measure":"Prevalence of hypothyroidism","value":"nearly 5 in 100 (most cases mild)","year":2021,"population":"Americans aged 12 and older","region":"USA","source":"NIDDK Hypothyroidism"}],"sources":[{"title":"NIDDK: Hypothyroidism (Underactive Thyroid)","url":"https://www.niddk.nih.gov/health-information/endocrine-diseases/hypothyroidism","year":2021},{"title":"Disease research: categories, symptoms, causes and recommendations","url":"local:medical-data/disease-research.pdf","year":null},{"title":"MedlinePlus: Vital signs","url":"https://medlineplus.gov/ency/article/002341.htm","year":2025}],"gate":{"any":["q_cold_intolerance"],"cap":34,"note":"Non-specific pattern: shown only when at least one more specific sign is present."},"weight_factor":0.8},{"id":"hyperthyroid_arousal_effects","name":"Pattern consistent with possible overactive thyroid effects resembling anxiety (worth a lab check)","category":"endocrine","summary":"Hyperthyroidism can cause a fast or irregular heartbeat, nervousness, irritability, sleep trouble, tiredness, shaky hands and weight loss despite good appetite, closely mimicking anxiety.","indicator_rules":[{"indicator":"hr_bpm","op":">","threshold":15,"ref":"baseline_pct","weight":20,"note":"Fast heartbeat (NIDDK hyperthyroidism); baseline-relative, no thyroid-specific cut-off"},{"indicator":"hr_bpm","op":">","threshold":100,"ref":"absolute","weight":10,"note":"Above AHA/MedlinePlus adult resting range 60-100"},{"indicator":"q_nervous","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Nervousness (NIDDK hyperthyroidism)"},{"indicator":"q_irritability","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Irritability (NIDDK hyperthyroidism)"},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Sleep trouble (NIDDK hyperthyroidism)"},{"indicator":"q_appetite_change","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Weight loss despite bigger appetite (NIDDK hyperthyroidism)"},{"indicator":"rmssd_ms","op":"<","threshold":-20,"ref":"baseline_pct","weight":10,"note":"Reduced vagal HRV; non-specific, no validated absolute threshold"},{"indicator":"head_stability_pct","op":"<","threshold":-15,"ref":"baseline_pct","weight":5,"note":"Possible tremor-related instability; weak, non-specific"}],"questionnaire_triggers":["q_nervous>=2","q_irritability>=2","q_sleep_quality>=2","q_appetite_change>=2"],"probable_causes":["Overactive thyroid gland (for example Graves disease or nodules)","Thyroiditis","Excess thyroid hormone medication"],"isolation_relevance":"Persistent physical arousal in a confined crew is easily labelled as anxiety or interpersonal stress; if resting heart rate stays high across sessions while worry is low, a medical cause deserves checking.","orientative_interpretation":"This session shows a higher resting heart rate and answers about nervousness, poor sleep or appetite change. That pattern often reflects stress, but it can also be consistent with physical causes such as thyroid activity or stimulants. Consider a lab panel with your flight surgeon if it persists.","countermeasure_ids":["cm_lab_panel_request","cm_flight_surgeon_review","cm_stimulant_review","cm_medication_review","cm_thermal_comfort"],"escalation_criteria":"Contact the flight surgeon if resting heart rate stays above your baseline across several sessions, if heart rhythm feels irregular, or if weight loss with good appetite is noticed.","red_flags":["Irregular or pounding heartbeat at rest","Chest pain or fainting","Rapid unexplained weight loss","Fever with agitation or confusion"],"camera_limits":"Camera HR, HRV and head stability cannot distinguish thyroid effects from anxiety, stimulants, heat or exercise; rPPG HR can be noisy. Questionnaire items carry most of the weight and the orientation is only to consider a lab panel with your flight surgeon.","statistics":[{"measure":"Prevalence of hyperthyroidism","value":"about 1 in 100","year":2021,"population":"Americans aged 12 and older","region":"USA","source":"NIDDK Hyperthyroidism"}],"sources":[{"title":"NIDDK: Hyperthyroidism (Overactive Thyroid)","url":"https://www.niddk.nih.gov/health-information/endocrine-diseases/hyperthyroidism","year":2021},{"title":"American Heart Association: All About Heart Rate (Pulse)","url":"https://u1-cd-heart.sc.heart.org/en/health-topics/high-blood-pressure/the-facts-about-high-blood-pressure/all-about-heart-rate-pulse","year":null},{"title":"Disease research: categories, symptoms, causes and recommendations","url":"local:medical-data/disease-research.pdf","year":null}],"gate":{"any":["q_appetite_change"],"cap":34,"note":"Non-specific pattern: shown only when at least one more specific sign is present."},"weight_factor":0.8},{"id":"medication_substance_effects","name":"Pattern consistent with medication or stimulant side effects","category":"pharmacological","summary":"Sleep aids, antihistamines, anti-motion-sickness drugs and wake-promoting stimulants are widely used in spaceflight and can cause next-day drowsiness, slowed reactions, nervousness, sleep trouble or mood change.","indicator_rules":[{"indicator":"q_med_change","op":">=","threshold":1,"ref":"absolute","weight":30,"note":"New or changed medication, sleep aid or stimulant in last 72 h; core trigger"},{"indicator":"perclos_pct","op":">","threshold":25,"ref":"baseline_pct","weight":15,"note":"Drowsiness: promethazine, diphenhydramine, zolpidem next-day effects (MedlinePlus)"},{"indicator":"q_sleepiness","op":">=","threshold":7,"ref":"absolute","weight":10,"note":"KSS 7+ = sleepy; next-day drowsiness (MedlinePlus zolpidem)"},{"indicator":"yawn_per_10min","op":">","threshold":50,"ref":"baseline_pct","weight":5,"note":"Drowsiness sign; no validated absolute yawn threshold"},{"indicator":"hr_bpm","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Fast or pounding heartbeat listed for modafinil and promethazine (MedlinePlus)"},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Trouble falling/staying asleep with modafinil and promethazine (MedlinePlus)"},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Reduced alertness, memory and concentration problems (MedlinePlus zolpidem, promethazine)"},{"indicator":"q_nervous","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"Nervousness/restlessness (promethazine); anxiety (modafinil, zolpidem)"},{"indicator":"q_mood_low","op":">=","threshold":2,"ref":"absolute","weight":5,"note":"New or worsening depression listed for zolpidem and modafinil (MedlinePlus)"}],"questionnaire_triggers":["q_med_change>=1","q_sleepiness>=7","q_sleep_quality>=2","q_concentration>=2","q_nervous>=2","q_mood_low>=2"],"probable_causes":["Hypnotic carry-over (for example zolpidem next-day impairment)","Sedating antihistamines (diphenhydramine) or anti-motion-sickness drugs (promethazine, scopolamine)","Wake-promoting agents (modafinil) or high stimulant intake disturbing sleep","Altered drug kinetics in microgravity (promethazine bioavailability appears reduced, half-life longer)"],"isolation_relevance":"Medication use is very common in flight (about three-quarters of ISS crew used sleep medication at some point), and side effects such as drowsiness or mood change can be misread as fatigue or depression in a crew with limited medical support.","orientative_interpretation":"You indicated a recent medication, sleep aid or stimulant change, and this session shows signs that may be consistent with its side effects, such as drowsiness or a faster heart rate. This does not mean anything is wrong; it may be worth reviewing the timing and dose with your flight surgeon. Please do not stop a prescribed medication on your own.","countermeasure_ids":["cm_medication_review","cm_stimulant_review","cm_flight_surgeon_review","cm_strategic_nap","cm_caffeine_timing"],"escalation_criteria":"Contact the flight surgeon before critical tasks if drowsiness persists the morning after a sleep aid, and immediately for complex sleep behaviors, confusion, hallucinations, irregular heartbeat or new low mood after a medication change.","red_flags":["Complex sleep behaviors with no memory of them","Confusion, hallucinations or inability to respond","Fast or irregular heartbeat, fainting","New or worsening depression or thoughts of self-harm (follow the app safety protocol)","Slowed breathing"],"camera_limits":"The camera cannot identify which substance was taken or its dose; drowsiness, HR and expression changes are non-specific. This pattern depends on the q_med_change answer.","statistics":[{"measure":"Sleep medication use","value":"78% of Shuttle crew used medication on 52% of nights in space; three-quarters of ISS crew used sleep medication at some point","year":2014,"population":"64 astronauts on 80 Shuttle missions; 21 ISS astronauts","region":"USA/International (Shuttle, ISS)","source":"Barger et al., Lancet Neurology 2014 (via ScienceDaily)"},{"measure":"In-flight medication use","value":"94% of a sample of 219 records included some medication during flight; space motion sickness 47%, sleep disorders 45%","year":null,"population":"Spaceflight medication records","region":"Spaceflight","source":"Local file central-nervous-system-and-space-travel"}],"sources":[{"title":"MedlinePlus: Zolpidem","url":"https://medlineplus.gov/druginfo/meds/a693025.html","year":2019},{"title":"MedlinePlus: Promethazine","url":"https://medlineplus.gov/druginfo/meds/a682284.html","year":2026},{"title":"MedlinePlus: Diphenhydramine","url":"https://www.medlineplus.gov/druginfo/meds/a682539.html","year":2026},{"title":"MedlinePlus: Modafinil","url":"https://medlineplus.gov/druginfo/meds/a602016.html","year":2024},{"title":"Boyd, Wang, Putcha. Bioavailability of Promethazine during Spaceflight (NASA NTRS)","url":"https://ntrs.nasa.gov/citations/20090001322","year":2009},{"title":"ScienceDaily: Sleep deficiency and sleep medication use among astronauts (Barger et al., Lancet Neurology 2014)","url":"https://www.sciencedaily.com/releases/2014/08/140807215803.htm","year":2014},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}],"gate":{"any":["q_med_change"],"cap":34,"note":"Non-specific pattern: shown only when at least one more specific sign is present."},"weight_factor":0.8},{"id":"dehydration_pattern","name":"Pattern consistent with mild dehydration","category":"physiological","summary":"Mild to moderate dehydration causes thirst, dry mouth, headache and muscle cramps; it can also cause unclear thinking and mood changes, and more severe cases cause dizziness, rapid heartbeat and irritability.","indicator_rules":[{"indicator":"q_headache","op":">=","threshold":1,"ref":"absolute","weight":20,"note":"Headache in mild-moderate dehydration (MedlinePlus)"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":15,"note":"Unclear thinking (CDC water)"},{"indicator":"q_irritability","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Mood changes (CDC); irritability in severe dehydration (MedlinePlus)"},{"indicator":"q_low_energy","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Listlessness in more severe dehydration (MedlinePlus)"},{"indicator":"hr_bpm","op":">","threshold":10,"ref":"baseline_pct","weight":15,"note":"Rapid heartbeat in more severe dehydration (MedlinePlus); baseline-relative, no validated cut-off"},{"indicator":"rr_rpm","op":">","threshold":15,"ref":"baseline_pct","weight":5,"note":"Rapid breathing in severe dehydration (MedlinePlus); low weight"},{"indicator":"fatigue_level","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Non-specific"},{"indicator":"q_appetite_change","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Reduced intake from illness or nausea is a common cause (MedlinePlus)"},{"indicator":"q_mission_phase","op":"<=","threshold":1,"ref":"absolute","weight":5,"note":"Early microgravity body-water loss (about 1 L total body water lost early in dry immersion; Robin 2020)"}],"questionnaire_triggers":["q_headache>=1","q_concentration>=1","q_irritability>=1","q_low_energy>=1","q_appetite_change>=1","q_mission_phase<=1"],"probable_causes":["Reduced thirst and fluid intake in microgravity and during busy schedules","Fluid loss with sweating during exercise, nausea or vomiting","Early adaptive loss of plasma and extracellular volume in weightlessness","Diuretic effect of caffeine or medications"],"isolation_relevance":"Busy timelines, recycled-water logistics and blunted thirst can lead to low intake; the resulting headache, poor focus and irritability may be read as interpersonal or emotional strain.","orientative_interpretation":"Your answers and this session may be consistent with not drinking quite enough today, for example headache with a slightly faster heart rate. It may help to drink water and re-check in an hour before interpreting other findings.","countermeasure_ids":["cm_hydration_check","cm_regular_meals","cm_co2_ventilation_check","cm_flight_surgeon_review"],"escalation_criteria":"Contact the flight surgeon if you cannot keep fluids down, urine stays very dark or absent, or dizziness, confusion or rapid heartbeat persist after drinking.","red_flags":["Confusion or change in alertness","Fainting or near-fainting","No urine for many hours","Fever above 38.8 C or persistent vomiting"],"camera_limits":"The camera cannot measure hydration, urine color or skin turgor; HR and RR changes are non-specific and also follow stress, exercise and heat.","statistics":[{"measure":"Early body-water loss in microgravity analog","value":"thigh cuffs limited early total body water loss by about 1 L and extracellular fluid by about 0.5 L versus controls","year":2020,"population":"18 healthy men, 5-day dry immersion","region":"France (ground analog)","source":"Robin et al., Front Physiol 2020"}],"sources":[{"title":"MedlinePlus: Dehydration","url":"https://medlineplus.gov/ency/article/000982.htm","year":2025},{"title":"CDC: About Water and Healthier Drinks","url":"https://www.cdc.gov/healthy-weight-growth/water-healthy-drinks/","year":2026},{"title":"Robin et al. DI-5-CUFFS: Venoconstrictive Thigh Cuffs Limit Body Fluid Changes but Not Orthostatic Intolerance Induced by a 5-Day Dry Immersion. Front Physiol 11:383","url":"https://www.frontiersin.org/articles/10.3389/fphys.2020.00383/full","year":2020}]},{"id":"space_motion_sickness","name":"Pattern consistent with space motion sickness","category":"physiological","summary":"Space motion sickness affects about 70% of astronauts, usually within the first 72 hours of weightlessness (days 1-5), with nausea, dizziness, fatigue, headache, sweating and loss of appetite; the drugs used to treat it can cause drowsiness.","indicator_rules":[{"indicator":"q_mission_phase","op":"<=","threshold":1,"ref":"absolute","weight":20,"note":"Onset within first 72 h, most destabilizing days 1-5 (Khalid 2023); symptoms usually resolve in 3-5 days (local CNS file)"},{"indicator":"q_appetite_change","op":">=","threshold":2,"ref":"absolute","weight":25,"note":"Loss of appetite and anorexia (Khalid 2023; local CNS file); no nausea item exists, used as proxy"},{"indicator":"q_headache","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Headache (Khalid 2023; local CNS file)"},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Fatigue, lethargy (Khalid 2023; local CNS file)"},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":10,"note":"Non-specific"},{"indicator":"q_sleepiness","op":">=","threshold":6,"ref":"absolute","weight":10,"note":"Drowsiness from SMS medication (Abbott 2025; Khalid 2023)"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Severe SMS can threaten critical tasks (Abbott 2025)"},{"indicator":"q_med_change","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Promethazine or scopolamine recently taken"}],"questionnaire_triggers":["q_mission_phase<=1","q_appetite_change>=2","q_headache>=1","q_low_energy>=2","q_sleepiness>=6","q_concentration>=1","q_med_change>=1"],"probable_causes":["Sensory conflict between vestibular, visual and proprioceptive inputs","Head movements during early adaptation","Fluid redistribution (limited evidence)","Re-adaptation on return to gravity (can recur within 10 days)"],"isolation_relevance":"Early-mission malaise, lethargy and withdrawal can look like low mood or poor team engagement; it is usually short-lived and treatable, and its medication can add drowsiness.","orientative_interpretation":"Early in a mission, reduced appetite, headache and low energy may be consistent with space motion sickness, which affects most new flyers and usually settles within a few days. This is a physical adaptation, not a sign of emotional difficulty. Let your flight surgeon know if it is affecting food, fluids or work.","countermeasure_ids":["cm_flight_surgeon_review","cm_medication_review","cm_hydration_check","cm_regular_meals","cm_strategic_nap"],"escalation_criteria":"Contact the flight surgeon if vomiting prevents fluid intake, symptoms last beyond 5 days, or occur outside the adaptation window (which suggests another cause), or if medication drowsiness affects critical tasks.","red_flags":["Repeated vomiting with inability to keep fluids down","Severe headache or new neurological symptoms","Symptoms starting late in the mission without a clear trigger","Marked confusion"],"camera_limits":"The camera cannot detect nausea or vestibular disturbance; facial expressions of discomfort and fatigue features are non-specific, and crew may restrict head movement, which alters head-stability readings.","statistics":[{"measure":"Incidence of space motion sickness","value":"around 70% of astronauts","year":2023,"population":"Astronauts","region":"Spaceflight","source":"Khalid et al., Front Neural Circuits 2023"},{"measure":"Incidence on first exposure","value":"roughly half to 80% of astronauts; symptoms usually 2-3 days","year":2025,"population":"Astronauts on first exposure to microgravity","region":"Spaceflight","source":"Abbott et al., Aerosp Med Hum Perform 2025"},{"measure":"Vestibular dysfunction","value":"60% of crew members; symptoms usually resolve in 3-5 days","year":null,"population":"Space mission crew members","region":"Spaceflight","source":"Local file central-nervous-system-and-space-travel"}],"sources":[{"title":"Khalid et al. Pharmacological and non-pharmacological countermeasures to Space Motion Sickness: a systematic review. Front Neural Circuits","url":"https://www.frontiersin.org/journals/neural-circuits/articles/10.3389/fncir.2023.1150233/full","year":2023},{"title":"Abbott et al. Promethazine Effects on Motion Sickness During Altered Gravity Induced by Parabolic Flight. Aerosp Med Hum Perform 96(11):976-984","url":"https://asma.kglmeridian.com/view/journals/amhp/96/11/article-p976.xml","year":2025},{"title":"Boyd, Wang, Putcha. Bioavailability of Promethazine during Spaceflight (NASA NTRS)","url":"https://ntrs.nasa.gov/citations/20090001322","year":2009},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}]},{"id":"tension_headache_pattern","name":"Pattern consistent with tension-type headache and muscular tension","category":"physiological","summary":"Tension headache is the most common headache type: a dull, band-like pressure linked to tight neck, scalp and jaw muscles, stress, eye strain, fatigue and holding the head in one position.","indicator_rules":[{"indicator":"q_headache","op":">=","threshold":2,"ref":"absolute","weight":30,"note":"Headache more than half the days (MedlinePlus tension headache)"},{"indicator":"facial_tension","op":">","threshold":20,"ref":"baseline_pct","weight":20,"note":"Muscle tightness, jaw clenching are triggers (MedlinePlus; NIDCR); no validated absolute threshold"},{"indicator":"stress_index","op":">","threshold":20,"ref":"baseline_pct","weight":10,"note":"Physical or emotional stress is a trigger (MedlinePlus)"},{"indicator":"q_workload","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Stress and overexertion triggers (MedlinePlus)"},{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Difficulty sleeping, awkward neck position during sleep (MedlinePlus)"},{"indicator":"fatigue_level","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Fatigue is a trigger (MedlinePlus)"},{"indicator":"head_stability_pct","op":">","threshold":15,"ref":"baseline_pct","weight":5,"note":"Holding the head in one position for a long time is a trigger (MedlinePlus); weak proxy"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Non-specific"}],"questionnaire_triggers":["q_headache>=2","q_workload>=2","q_sleep_quality>=2","q_concentration>=1"],"probable_causes":["Sustained neck, scalp and jaw muscle contraction","Stress, anxiety or low mood","Long fixed postures at workstations and eye strain","Jaw clenching or teeth grinding","Caffeine excess or withdrawal, fatigue"],"isolation_relevance":"Long periods of focused work at fixed stations, limited privacy and accumulated stress make muscular tension headaches likely; repeated headaches lower tolerance and mood in a confined crew.","orientative_interpretation":"Your headache answers together with higher facial tension than your usual level may indicate tension-type headache, often linked to sustained muscle tension, posture or stress. Short stretching and jaw relaxation breaks may help; consider discussing frequent headaches with your flight surgeon.","countermeasure_ids":["cm_neck_shoulder_release","cm_jaw_relaxation","cm_stretching_break","cm_screen_eye_rest","cm_pmr","cm_hydration_check","cm_caffeine_timing"],"escalation_criteria":"See the flight surgeon if headaches change pattern, need pain relievers more than 3 days a week, are worse lying down, or stop responding to usual measures.","red_flags":["Worst headache of your life or sudden onset","Speech, vision or movement problems or loss of balance","Repeated vomiting","High fever with stiff neck"],"camera_limits":"The camera cannot measure pain. Facial tension and head stability are indirect and also rise with concentration, cold or bright light; headache itself rests on self-report.","statistics":[{"measure":"People affected by headache disorders","value":"about 3.1 billion","year":2021,"population":"All ages","region":"Global","source":"Local file disease-database-extension-a"}],"sources":[{"title":"MedlinePlus: Tension headache","url":"https://www.medlineplus.gov/ency/article/000797.htm","year":2025},{"title":"NIDCR: TMD (Temporomandibular Disorders)","url":"https://www.nidcr.nih.gov/health-info/tmd","year":2026},{"title":"Disease database extension, part A (sections 09 onward)","url":"local:medical-data/disease-database-extension-a.pdf","year":null}]},{"id":"sans_visual_strain","name":"Pattern consistent with possible spaceflight-associated visual changes (SANS screening prompt)","category":"physiological","summary":"Spaceflight Associated Neuro-ocular Syndrome involves optic disc swelling, globe flattening and choroidal folds from headward fluid shift; crew notice reduced near vision (hyperopic shift up to 1.5 diopters), sometimes headaches or visual spots, from about 3 weeks into flight.","indicator_rules":[{"indicator":"q_mission_phase","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Near-vision changes can appear from about 3 weeks; risk rises with duration (EyeWiki SANS; NASA HRP)"},{"indicator":"q_headache","op":">=","threshold":1,"ref":"absolute","weight":25,"note":"Headaches reported less frequently with SANS (EyeWiki); headache plus vision change is the key combination"},{"indicator":"q_congestion","op":">=","threshold":1,"ref":"absolute","weight":15,"note":"Marker of headward fluid shift, the proposed cause of SANS (NASA HRP)"},{"indicator":"q_concentration","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Proxy for difficulty with near work; recommend adding a dedicated vision-change item"},{"indicator":"facial_tension","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Possible squinting/visual effort; expert opinion, no validated threshold"},{"indicator":"blink_rate_min","op":"<","threshold":-30,"ref":"baseline_pct","weight":10,"note":"Sustained visual effort reduces blinking (Abusharha 2017); non-specific"},{"indicator":"fatigue_level","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Non-specific"}],"questionnaire_triggers":["q_mission_phase>=2","q_headache>=1","q_congestion>=1","q_concentration>=2"],"probable_causes":["Chronic headward shift of blood and cerebrospinal fluid","Altered cerebral venous and CSF dynamics","Possible contributors under study: elevated CO2, resistive exercise intensity, salt intake, individual susceptibility"],"isolation_relevance":"Vision changes develop gradually over months and may first be noticed as tiredness when reading displays; on exploration missions far from ground ophthalmology, early self-report matters.","orientative_interpretation":"Headache together with difficulty on close work later in a mission may indicate visual changes that are common in long-duration flight. The camera cannot examine your eyes, so this is only a prompt. Any noticed change in near or distance vision is worth reporting to your flight surgeon for the scheduled eye checks.","countermeasure_ids":["cm_vision_check","cm_flight_surgeon_review","cm_screen_eye_rest","cm_thigh_cuffs","cm_co2_ventilation_check"],"escalation_criteria":"Report to the flight surgeon any new blurring of near or distance vision, visual spots or persistent headache, so that onboard eye imaging (fundoscopy/OCT) can be considered.","red_flags":["Sudden vision loss or new blind spots","Persistent headache with visual disturbance","Double vision","Eye pain"],"camera_limits":"A webcam cannot detect optic disc edema, globe flattening, choroidal folds or refractive shift; blink and facial-tension indicators are non-specific. This item is a self-report prompt only.","statistics":[{"measure":"Swelling in the back of the eye","value":"approximately 70% of astronauts","year":2025,"population":"ISS astronauts","region":"International (ISS)","source":"NASA HRP SANS risk page"},{"measure":"Near-vision disturbances reported","value":"about 23% after short-duration flight; up to 47% after long-duration ISS missions","year":2026,"population":"Astronauts","region":"Spaceflight","source":"EyeWiki SANS"}],"sources":[{"title":"NASA HRP: Risk of Spaceflight Associated Neuro-ocular Syndrome (SANS)","url":"https://www.nasa.gov/reference/risk-of-spaceflight-associated-neuro-ocular-syndrome-sans","year":2025},{"title":"EyeWiki (American Academy of Ophthalmology): Spaceflight-Associated Neuro-Ocular Syndrome (SANS)","url":"https://eyewiki.org/Spaceflight-Associated_Neuro-Ocular_Syndrome_(SANS)","year":2026},{"title":"Abusharha AA. Changes in blink rate and ocular symptoms during different reading tasks. Clin Optom 9:133-138","url":"https://rcastoragev2.blob.core.windows.net/a4c4ba95185916f9521c9177e6cc7d59/opto-9-133.PMC6118863.pdf","year":2017}],"weight_factor":0.7},{"id":"eye_strain_dry_eye","name":"Pattern consistent with digital eye strain or dry eye","category":"environmental","summary":"Long screen work reduces blinking (by about 56% in normal subjects during demanding computer tasks), causing eye fatigue, head pain, blurred vision, dry eyes and neck and shoulder soreness that can feed into fatigue scores.","indicator_rules":[{"indicator":"blink_rate_min","op":"<","threshold":-40,"ref":"baseline_pct","weight":25,"note":"Blinking fell 56% in normal subjects during a high-concentration computer task (Himebaugh 2009 via Abusharha 2017)"},{"indicator":"blink_rate_min","op":"<","threshold":12,"ref":"absolute","weight":10,"note":"Below the 12-15/min normal spontaneous blink rate (Doughty 2001 via Abusharha 2017)"},{"indicator":"q_headache","op":">=","threshold":1,"ref":"absolute","weight":15,"note":"Head pain is a digital eye strain symptom (AOA)"},{"indicator":"facial_tension","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Squinting/periocular effort; no validated threshold"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Eye fatigue and fuzzy vision impair focus (AOA)"},{"indicator":"fatigue_level","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Eye fatigue (AOA); non-specific"},{"indicator":"q_workload","op":">=","threshold":2,"ref":"absolute","weight":10,"note":"Long screen-based workloads; expert opinion"},{"indicator":"q_low_energy","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Non-specific"},{"indicator":"head_stability_pct","op":">","threshold":15,"ref":"baseline_pct","weight":5,"note":"Prolonged fixed posture; neck and shoulder soreness (AOA; MedlinePlus)"}],"questionnaire_triggers":["q_headache>=1","q_concentration>=1","q_workload>=2","q_low_energy>=1"],"probable_causes":["Prolonged screen or near work with reduced blinking","Low cabin humidity and constant airflow drying the eye surface","Poor screen distance, height or glare","Uncorrected or changing refraction (including spaceflight hyperopic shift)"],"isolation_relevance":"Most mission work and much leisure happen on screens in a small habitat with dry, moving air; eye discomfort and headache add to fatigue and irritability.","orientative_interpretation":"This session shows fewer blinks than your usual level and answers that may indicate eye strain from screen work. That can make you feel more tired and tense than you really are. Short eye breaks may help, and lasting vision changes are worth mentioning to your flight surgeon.","countermeasure_ids":["cm_screen_eye_rest","cm_microbreaks","cm_stretching_break","cm_thermal_comfort","cm_vision_check"],"escalation_criteria":"See the flight surgeon if eye pain, redness or blurred vision persists after rest, or any change in near or distance vision is noticed (to rule out SANS).","red_flags":["Eye pain or marked redness","Sudden vision change or light sensitivity","Discharge or foreign-body sensation that persists"],"camera_limits":"Blink rate from a webcam is affected by lighting, glasses and gaze angle and also drops during intense concentration; the camera cannot measure tear film or visual acuity.","statistics":[{"measure":"Adults reporting digital eye strain or vision problems from computer use","value":"58%","year":2015,"population":"US adults surveyed","region":"USA","source":"American Optometric Association survey"},{"measure":"Reduction in blinking during high-concentration computer task","value":"56% (normal subjects), 72% (dry-eye patients)","year":2009,"population":"Normal and dry-eye subjects","region":"Not stated","source":"Himebaugh et al. 2009, cited in Abusharha 2017"}],"sources":[{"title":"American Optometric Association: Most Americans Experience Digital Eye Strain from Overexposure to Computers According to Survey","url":"https://www.aoa.org/about-the-aoa/press-room/press-releases/most-americans-experience-digital-eye-strain-from-overexposure-to-computers-according-to-survey","year":2016},{"title":"Abusharha AA. Changes in blink rate and ocular symptoms during different reading tasks. Clin Optom 9:133-138","url":"https://rcastoragev2.blob.core.windows.net/a4c4ba95185916f9521c9177e6cc7d59/opto-9-133.PMC6118863.pdf","year":2017},{"title":"NASA OCHMO Technical Brief OCHMO-TB-002: Environmental Control and Life Support Systems (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/07/eclss-technical-brief-ochmo.pdf","year":2023},{"title":"Disease database extension, part A (sections 09 onward)","url":"local:medical-data/disease-database-extension-a.pdf","year":null}],"gate":{"any":["q_headache","q_concentration","q_workload"],"cap":34,"note":"Non-specific pattern: shown only when at least one more specific sign is present."},"weight_factor":0.8},{"id":"orthostatic_deconditioning","name":"Pattern consistent with cardiovascular deconditioning and orthostatic intolerance","category":"physiological","summary":"After weightlessness, many crew cannot maintain blood pressure when upright (about 20-30% after short flights and about 83% after long-duration flights when tested), causing lightheadedness, nausea, tunnel vision, fatigue and confusion that can be misread as anxiety.","indicator_rules":[{"indicator":"q_mission_phase","op":">=","threshold":4,"ref":"absolute","weight":15,"note":"Relevant near gravity re-exposure (landing, planetary surface) after long flight (NASA OI evidence report)"},{"indicator":"hr_bpm","op":">","threshold":15,"ref":"baseline_pct","weight":15,"note":"Compensatory tachycardia/palpitations (Cleveland Clinic); baseline-relative, camera is seated"},{"indicator":"rmssd_ms","op":"<","threshold":-20,"ref":"baseline_pct","weight":10,"note":"Reduced vagal modulation; non-specific, no validated absolute threshold"},{"indicator":"q_low_energy","op":">=","threshold":2,"ref":"absolute","weight":15,"note":"Fatigue or weakness (Cleveland Clinic)"},{"indicator":"q_headache","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Headaches (Cleveland Clinic)"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Confusion (Cleveland Clinic)"},{"indicator":"fatigue_level","op":">","threshold":20,"ref":"baseline_pct","weight":10,"note":"Non-specific"},{"indicator":"wellbeing_index","op":"<","threshold":-15,"ref":"baseline_pct","weight":10,"note":"Non-specific"},{"indicator":"q_med_change","op":">=","threshold":1,"ref":"absolute","weight":5,"note":"Some drugs (for example promethazine) list fainting or fast heartbeat (MedlinePlus)"}],"questionnaire_triggers":["q_mission_phase>=4","q_low_energy>=2","q_headache>=1","q_concentration>=1","q_med_change>=1"],"probable_causes":["Plasma volume loss (about 5-19% deficits despite fluid loading)","Cardiovascular and autonomic deconditioning in weightlessness","Altered cerebral autoregulation","Insufficient exercise or fluid/salt loading before gravity re-exposure"],"isolation_relevance":"On exploration missions crews may land on a planetary surface without ground support teams; dizziness, fatigue and confusion on standing can be mistaken for stress and can threaten safe egress.","orientative_interpretation":"Around gravity transitions, a raised resting heart rate with tiredness and headache may be consistent with the body re-adapting its blood pressure control. This is a common physical effect of long flights. A seated camera cannot test this, so a standing blood pressure check with your flight surgeon may help.","countermeasure_ids":["cm_bp_check","cm_hydration_check","cm_aerobic_session","cm_resistance_session","cm_head_elevation_rest","cm_flight_surgeon_review"],"escalation_criteria":"Involve the flight surgeon before landing or EVA if dizziness on standing, near-fainting or palpitations occur, or if orthostatic vital signs show a drop of more than 20 mmHg systolic or 10 mmHg diastolic within 3 minutes of standing.","red_flags":["Fainting or near-fainting","Chest pain or shortness of breath","Tunnel vision or confusion on standing","Systolic pressure below 70 mmHg"],"camera_limits":"The camera measures a seated face and cannot measure blood pressure or the response to standing; HR and HRV changes are non-specific and also follow stress, heat or dehydration.","statistics":[{"measure":"Post-flight orthostatic intolerance","value":"about 20-30% after short-duration flights; about 83% after long-duration flights when tested by stand or tilt","year":2015,"population":"NASA crewmembers","region":"USA/International (Shuttle, ISS)","source":"NASA HRP Evidence Report: Risk of Orthostatic Intolerance During Re-exposure to Gravity"},{"measure":"Failure to complete 10-min tilt on landing day","value":"4 of 6 (66%) after ~6-month ISS stays vs 13 of 66 (20%) Shuttle astronauts","year":2015,"population":"ISS and Shuttle astronauts","region":"USA/International","source":"NASA HRP Evidence Report: Risk of Orthostatic Intolerance During Re-exposure to Gravity"},{"measure":"Adults living with hypertension (context for BP monitoring)","value":"more than 1.28 billion","year":null,"population":"Adults","region":"Global","source":"Local file Disease_Epidemiology_Statistical_Report (citing WHO)"}],"sources":[{"title":"NASA HRP Evidence Report: Risk of Orthostatic Intolerance During Re-exposure to Gravity","url":"https://ntrs.nasa.gov/api/citations/20150007319/downloads/20150007319.pdf","year":2015},{"title":"Cleveland Clinic: Orthostatic Hypotension (Postural Hypotension)","url":"https://my.clevelandclinic.org/health/diseases/9385-low-blood-pressure-orthostatic-hypotension","year":2026},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null},{"title":"Disease epidemiology statistical report","url":"local:medical-data/disease-epidemiology-statistical-report.docx","year":null}]},{"id":"habitability_noise_thermal_strain","name":"Pattern consistent with habitability strain from noise or thermal discomfort","category":"environmental","summary":"Noise above sleep-area limits and temperatures outside the 20-25 C comfort zone can degrade sleep and cause irritation and headaches, which then show up as stress, irritability and fatigue.","indicator_rules":[{"indicator":"q_sleep_quality","op":">=","threshold":2,"ref":"absolute","weight":20,"note":"Noise degrades sleep and relaxation (OCHMO-TB-035); noise and uncomfortable temperatures linked to sleep alterations (local CNS file)"},{"indicator":"q_irritability","op":">=","threshold":1,"ref":"absolute","weight":15,"note":"Irritation from noise (OCHMO-TB-035)"},{"indicator":"q_headache","op":">=","threshold":1,"ref":"absolute","weight":15,"note":"Headaches from noise (OCHMO-TB-035)"},{"indicator":"q_concentration","op":">=","threshold":1,"ref":"absolute","weight":10,"note":"Habitability factors (noise, temperature, air quality) degrade performance (local CNS file)"},{"indicator":"q_sleep_hours","op":"<","threshold":6,"ref":"absolute","weight":10,"note":"ISS crews averaged 6.09 h vs 8.5 h scheduled (Barger 2014)"},{"indicator":"facial_tension","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Non-specific; no validated threshold"},{"indicator":"stress_index","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Non-specific"},{"indicator":"fatigue_level","op":">","threshold":15,"ref":"baseline_pct","weight":10,"note":"Non-specific"}],"questionnaire_triggers":["q_sleep_quality>=2","q_irritability>=1","q_headache>=1","q_concentration>=1","q_sleep_hours<6"],"probable_causes":["Continuous fan and equipment noise above NC-40 in sleep areas","Intermittent or impulse noise during sleep","Cabin temperature outside 20-25 C or humidity outside 30-60%","Poor airflow in sleep stations"],"isolation_relevance":"In a small habitat there is no escape from equipment noise or an uncomfortable temperature; chronic exposure erodes sleep and patience and can be mistaken for interpersonal or emotional strain.","orientative_interpretation":"Your answers about sleep, irritation and headache may indicate that the environment, such as noise or temperature, is part of the picture. Checking and adjusting your sleep area may help before interpreting this as stress.","countermeasure_ids":["cm_noise_reduction","cm_thermal_comfort","cm_co2_ventilation_check","cm_sleep_hygiene","cm_wind_down_routine"],"escalation_criteria":"Report persistent noisy hardware or temperature problems to the crew and ground; involve the flight surgeon if sleep remains poor for more than a week despite adjustments.","red_flags":["Ringing in the ears or hearing change","Signs of heat illness (confusion, rapid pulse)","Several crew reporting the same sleep disruption"],"camera_limits":"The camera cannot measure sound levels, temperature or humidity; stress, tension and fatigue indicators are non-specific. Confirm with environmental telemetry.","statistics":[{"measure":"Average sleep duration in flight","value":"5.96 h (Shuttle), 6.09 h (ISS) vs 8.5 h scheduled","year":2014,"population":"64 Shuttle and 21 ISS astronauts","region":"USA/International","source":"Barger et al., Lancet Neurology 2014 (via ScienceDaily)"}],"sources":[{"title":"NASA OCHMO Technical Brief OCHMO-TB-035: Acoustics (Rev C)","url":"https://www.nasa.gov/sites/default/files/atoms/files/acoustics_technical_brief_ochmo_0.pdf","year":2023},{"title":"NASA OCHMO Technical Brief OCHMO-TB-002: Environmental Control and Life Support Systems (Rev A)","url":"https://www.nasa.gov/wp-content/uploads/2023/07/eclss-technical-brief-ochmo.pdf","year":2023},{"title":"ScienceDaily: Sleep deficiency and sleep medication use among astronauts (Barger et al., Lancet Neurology 2014)","url":"https://www.sciencedaily.com/releases/2014/08/140807215803.htm","year":2014},{"title":"Central nervous system and space travel (Saavedra-Torres et al., University of Cauca)","url":"local:medical-data/central-nervous-system-and-space-travel.pdf","year":null}],"weight_factor":0.75,"gate":{"any":["q_headache","q_congestion","q_cold_intolerance"],"cap":34,"note":"Non-specific environmental pattern: down-weighted and shown only with a physical complaint."}}],"countermeasures":[{"id":"cm_paced_breathing_6","title":"Slow paced breathing (about 6 breaths per minute)","category":"breathing","steps":["Sit or float in a stable position and relax your shoulders.","Breathe in gently through your nose for about 4 seconds.","Breathe out slowly for about 6 seconds, so each full breath takes about 10 seconds (about 6 breaths per minute).","Use the on-screen pacer if available and keep the breath light, not forced.","Continue for 5 to 10 minutes, then notice how your body feels."],"duration":"5-10 min, once or twice daily or when stressed","evidence_level":"moderate","sources":[{"title":"Lehrer PM, Gevirtz R. Heart rate variability biofeedback: how and why does it work? Front Psychol 2014;5:756","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2014.00756/full","year":2014},{"title":"Laborde S, Allen M, Borges U, et al. Effects of voluntary slow breathing on heart rate and heart rate variability: a systematic review and a meta-analysis. Neurosci Biobehav Rev 2022","url":"https://pure.solent.ac.uk/en/publications/effects-of-voluntary-slow-breathing-on-heart-rate-and-heart-rate-/","year":2022},{"title":"NCCIH Clinical Digest: Mind and Body Approaches for Stress and Anxiety: What the Science Says","url":"https://www.nccih.nih.gov/health/providers/digest/mind-and-body-approaches-for-stress-science","year":2024}],"notes":"Resonance frequency for most adults is about 6 breaths per minute (0.1 Hz) (Lehrer & Gevirtz 2014). A meta-analysis of 223 studies found voluntary slow breathing increases vagally mediated HRV (Laborde 2022). The 4 s / 6 s split is one practical way to reach about 10 s per breath; stop if lightheaded."},{"id":"cm_box_breathing","title":"Box breathing (4-4-4-4)","category":"breathing","steps":["Breathe out slowly to empty your lungs.","Breathe in through your nose while counting slowly to four.","Hold your breath for a count of four.","Breathe out for a count of four, then hold for a count of four.","Repeat for three to four rounds."],"duration":"3-4 rounds (about 1-2 min), one or two sessions a day","evidence_level":"low","sources":[{"title":"Cleveland Clinic: Box Breathing","url":"https://health.clevelandclinic.org/box-breathing-benefits/amp","year":2021},{"title":"Balban MY, Neri E, Kogon MM, et al. Brief structured respiration practices enhance mood and reduce physiological arousal. Cell Rep Med 2023 (doi:10.1016/j.xcrm.2022.100895)","url":"https://hubermanlab.stanford.edu/publications/brief-structured-respiration-practices-enhance-mood-and-reduce-physiological-arousal","year":2023}],"notes":"Box breathing was one of the active arms in Balban et al. 2023; cyclic sighing produced larger mood benefits. Skip breath holds if they cause discomfort."},{"id":"cm_physiological_sigh","title":"Cyclic sighing (physiological sigh)","category":"breathing","steps":["Breathe in through your nose until your lungs feel comfortably full.","Take a second, short top-up inhale through the nose.","Breathe out slowly and fully through your mouth, making the exhale longer than the two inhales.","Repeat at a relaxed pace, emphasising the long exhale.","Continue for 5 minutes; once a day is the studied dose."],"duration":"5 min daily","evidence_level":"moderate","sources":[{"title":"Balban MY, Neri E, Kogon MM, et al. Brief structured respiration practices enhance mood and reduce physiological arousal. Cell Rep Med 2023 (doi:10.1016/j.xcrm.2022.100895)","url":"https://hubermanlab.stanford.edu/publications/brief-structured-respiration-practices-enhance-mood-and-reduce-physiological-arousal","year":2023}],"notes":"In a remote randomized controlled trial (about 1 month of daily 5-minute practice), cyclic sighing improved mood and reduced respiratory rate more than mindfulness meditation (Balban 2023)."},{"id":"cm_pmr","title":"Progressive muscle relaxation","category":"cognitive","steps":["Find a place where you will not be disturbed and secure yourself in position.","Tense one muscle group (for example fists) for about 5 seconds while breathing in; never hold your breath.","Release all at once while breathing out and notice the feeling of relaxation.","Move through the groups: hands, arms, forehead, eyes, jaw, neck, shoulders, stomach, back, legs, feet.","Ease off or skip any muscle that hurts or cramps."],"duration":"10-15 min","evidence_level":"moderate","sources":[{"title":"VA Whole Health Library: Progressive Muscle Relaxation (Mirgain SA, Singles J)","url":"https://www.va.gov/WHOLEHEALTHLIBRARY/tools/progressive-muscle-relaxation.asp","year":2016},{"title":"NCCIH Clinical Digest: Mind and Body Approaches for Stress and Anxiety: What the Science Says","url":"https://www.nccih.nih.gov/health/providers/digest/mind-and-body-approaches-for-stress-science","year":2024},{"title":"Edinger JD, Arnedt JT, Bertisch SM, et al. Behavioral and psychological treatments for chronic insomnia disorder in adults: an AASM clinical practice guideline. J Clin Sleep Med 2021 (NeurologyLive summary)","url":"https://www.neurologylive.com/view/new-aasm-guidelines-make-strong-recommendation-for-behavioral-therapy-in-chronic-insomnia","year":2021}],"notes":"Relaxation as a single-component insomnia therapy has a conditional recommendation (AASM, Edinger 2021)."},{"id":"cm_body_scan","title":"Body scan","category":"cognitive","steps":["Close your eyes or lower your gaze and take three slow breaths.","Move attention slowly from the top of your head down to your feet.","Notice tension, warmth or pressure in each area without trying to change it.","When the mind wanders, gently return to the body part you were on.","Finish with two slow breaths and notice the body as a whole."],"duration":"about 10 min","evidence_level":"low","sources":[{"title":"NCCIH Clinical Digest: Mind and Body Approaches for Stress and Anxiety: What the Science Says","url":"https://www.nccih.nih.gov/health/providers/digest/mind-and-body-approaches-for-stress-science","year":2024}],"notes":"Body scan is a common mindfulness practice; the cited evidence covers mindfulness programs in general rather than body scan alone."},{"id":"cm_mindfulness_10min","title":"Brief mindfulness practice","category":"cognitive","steps":["Set a 10-minute timer and settle into a stable position.","Rest attention on the sensation of breathing.","When thoughts arise, label them briefly ('thinking') and return to the breath.","Be patient with wandering; returning attention is the practice.","End by noting one thing you can see and one thing you can hear."],"duration":"10 min daily","evidence_level":"moderate","sources":[{"title":"NCCIH Clinical Digest: Mind and Body Approaches for Stress and Anxiety: What the Science Says","url":"https://www.nccih.nih.gov/health/providers/digest/mind-and-body-approaches-for-stress-science","year":2024}],"notes":"Mindfulness-based stress reduction was noninferior to escitalopram for anxiety disorders in a 2023 RCT, and a 2014 meta-analysis of 47 trials showed moderate evidence for anxiety and depression (NCCIH 2024). Some people report increased anxiety; stop if distressing."},{"id":"cm_grounding_54321","title":"5-4-3-2-1 grounding","category":"cognitive","steps":["Settle and take one slow, deep breath.","Notice 5 things you can see.","Notice 4 things you can feel.","Notice 3 things you can hear and 2 things you can smell.","Notice 1 thing you can taste, then take another slow breath."],"duration":"a few minutes","evidence_level":"expert opinion","sources":[{"title":"NHS inform: Grounding exercises","url":"https://www.nhsinform.scot/healthy-living/mental-wellbeing/breathing-and-relaxation-exercises/grounding-exercises","year":2025}]},{"id":"cm_cognitive_reframing","title":"Catch it, check it, change it (reframing unhelpful thoughts)","category":"cognitive","steps":["Catch it: notice the unhelpful thought as it happens (for example expecting the worst).","Write the thought down in a few words.","Check it: look at the evidence for and against it and consider other explanations.","Change it: write a more balanced thought that fits the evidence.","Notice how your feeling changes after the new thought."],"duration":"a few minutes per thought","evidence_level":"moderate","sources":[{"title":"NHS Every Mind Matters: Reframing unhelpful thoughts","url":"https://www.nhs.uk/every-mind-matters/mental-wellbeing-tips/self-help-cbt-techniques/reframing-unhelpful-thoughts","year":2022},{"title":"NIMH: I'm So Stressed Out! Fact Sheet","url":"https://www.nimh.nih.gov/health/publications/so-stressed-out-fact-sheet/index.shtml","year":null},{"title":"NIMH: Generalized Anxiety Disorder: When Worry Gets Out of Control","url":"https://www.nimh.nih.gov/health/publications/generalized-anxiety-disorder-gad","year":2025}],"notes":"Identifying and challenging unhelpful thoughts is a core CBT skill; NIMH describes CBT as the gold-standard psychotherapy for GAD."},{"id":"cm_worry_window","title":"Scheduled worry window (worry postponement)","category":"cognitive","steps":["Choose one fixed, short period each day for worrying, not close to bedtime.","When a worry appears outside that time, jot a brief note and postpone it.","Separate real, solvable problems from hypothetical 'what ifs'.","During the window, review the notes and plan an action for solvable items.","Over time, notice whether postponed worries feel less urgent."],"duration":"one short daily period (length not specified by source)","evidence_level":"low","sources":[{"title":"Psychology Tools: Worry Postponement (citing Borkovec TD, et al. Stimulus control applications to the treatment of worry. Behav Res Ther 1983;21(3):247-251)","url":"https://www.psychologytools.com/resource/worry-postponement","year":1983}],"notes":"Introduced as a stimulus-control task by Borkovec et al. (1983) and reported to reduce daily worry."},{"id":"cm_behavioral_activation","title":"Behavioral activation","category":"cognitive","steps":["Keep a simple daily log of activities and rate each for accomplishment and pleasure (0-10).","Identify activities linked to better mood and those you have been avoiding.","Schedule two small, specific activities for the coming week at set times.","Do them according to plan rather than waiting for motivation.","Break larger goals into small graded steps and review progress weekly."],"duration":"daily log; review weekly","evidence_level":"high","sources":[{"title":"Hunnicutt-Ferguson K. Behavioral Activation for Major Depressive Disorder. Emory University School of Medicine","url":"https://med.emory.edu/departments/psychiatry/_documents/behavioral_activation_for_mdd.pdf","year":null},{"title":"NIMH: Depression (NIH Publication No. 24-MH-8079)","url":"https://www.nimh.nih.gov/health/publications/depression","year":2024}],"notes":"BA is supported by randomized trials as effective for depression, comparable to cognitive therapy and medication at follow-up (Dimidjian 2006; Dobson 2008, as summarized by Emory)."},{"id":"cm_pleasant_activity_schedule","title":"Pleasant activity scheduling","category":"cognitive","steps":["List activities you enjoy or used to enjoy that are possible on board (music, films, photography, calls, games).","Choose one or two small ones and put them in your schedule at a fixed time.","Treat them as protected time, like a work task.","Afterwards, rate the enjoyment from 0 to 10.","Keep the ones that help and rotate in new ones."],"duration":"short, scheduled sessions; start with two per week","evidence_level":"moderate","sources":[{"title":"Hunnicutt-Ferguson K. Behavioral Activation for Major Depressive Disorder. Emory University School of Medicine","url":"https://med.emory.edu/departments/psychiatry/_documents/behavioral_activation_for_mdd.pdf","year":null},{"title":"Slack KJ, Schneiderman JS, Leveton LB, Whitmire AM, Picano JJ. Evidence Report: Risk of Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders. NASA Human Research Program","url":"https://ntrs.nasa.gov/api/citations/20150016966/downloads/20150016966.pdf","year":2016}]},{"id":"cm_gratitude_journal","title":"Three good things journal","category":"cognitive","steps":["At the end of the day, write down three things that went well.","Give each a short title.","Describe what happened and how it made you feel.","Note what you think caused it.","If you drift to negatives, refocus on the good event."],"duration":"10 min daily for at least one week","evidence_level":"moderate","sources":[{"title":"Greater Good in Action (UC Berkeley): Three Good Things (citing Seligman MEP, et al. Am Psychol 2005)","url":"https://ggia.berkeley.edu/practice/practice_as_pdf/three-good-things","year":2005}],"notes":"Seligman et al. (2005) reported increased happiness that persisted at six months."},{"id":"cm_expressive_writing","title":"Expressive writing","category":"cognitive","steps":["Find a private time and space.","Write continuously about a stressful or emotional experience, without worrying about spelling or grammar.","Write for 15-20 minutes per session on up to four consecutive days.","Avoid topics that feel too overwhelming right now.","If you feel very distressed, stop and use a calming activity such as slow breathing or talking with someone."],"duration":"15-20 min per session, 4 consecutive days","evidence_level":"moderate","sources":[{"title":"VA Whole Health Library: What Is Therapeutic Journaling? (Mirgain SA, Singles J)","url":"https://www.va.gov/WHOLEHEALTHLIBRARY/tools/therapeutic-journaling.asp","year":2016},{"title":"Stuster J. Behavioral Issues Associated With Long Duration Space Expeditions: Review and Analysis of Astronaut Journals (NASA JSC-CN-21128)","url":"https://ntrs.nasa.gov/citations/20100026549","year":2010}],"notes":"Feeling sad after writing is common and usually passes within hours. Astronauts reported that journaling helped them maintain perspective (Stuster 2010)."},{"id":"cm_task_chunking","title":"Task chunking and graded steps","category":"cognitive","steps":["Split a large or long task into small, clearly defined steps.","Do the first step only and check it off.","Insert a short break between blocks of demanding work.","Put the hardest steps at your most alert time of day.","Review what is done before moving on."],"duration":"applied during work blocks","evidence_level":"expert opinion","sources":[{"title":"Hunnicutt-Ferguson K. Behavioral Activation for Major Depressive Disorder. Emory University School of Medicine","url":"https://med.emory.edu/departments/psychiatry/_documents/behavioral_activation_for_mdd.pdf","year":null},{"title":"Lim J, Dinges DF. Sleep deprivation and vigilant attention. Ann N Y Acad Sci 2008;1129:305-322","url":"https://www.med.upenn.edu/uep/assets/user-content/documents/LimDinges2008VigilantAttention.pdf","year":2008}],"notes":"Graded task assignment is part of behavioral activation; vigilance declines with time on task, especially with sleep loss (Lim & Dinges 2008)."},{"id":"cm_microbreaks","title":"Micro-breaks","category":"schedule","steps":["Pause the current task for a short break of 10 minutes or less.","Change posture or move, look away from screens, or do a short breathing exercise.","Avoid starting another demanding task during the break.","Return to the task and notice energy and focus.","For very demanding cognitive work, plan longer breaks."],"duration":"10 min or less, several times per work period","evidence_level":"moderate","sources":[{"title":"Albulescu P, et al. 'Give me a break!' A systematic review and meta-analysis on the efficacy of micro-breaks for increasing wel
