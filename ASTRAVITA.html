/* ---------- toasts & dialogs ---------- */
ASTRAVITA.notify = (() => {
  const {esc, uid} = ASTRAVITA.util, {icon} = ASTRAVITA.icons;
  function toast(text, sev = 'info', ms = 5000) {
    const box = document.getElementById('toasts'); if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast ' + sev; if (sev === 'bad') el.setAttribute('role', 'alert');   // others are announced once by the polite #toasts live region
    el.innerHTML = icon(sev === 'ok' ? 'check' : sev === 'info' ? 'info' : 'alert') + `<div>${esc(text)}</div>`;
    box.append(el); while (box.children.length > 4) box.firstElementChild.remove();
    setTimeout(() => el.remove(), ms);
  }
  // Promise-based confirm using <dialog>
  function confirm({title, body, ok = 'Confirm', cancel = 'Cancel', danger = false}) {
    return new Promise(res => {
      const d = document.createElement('dialog');
      const id = 'cf-' + uid().slice(0, 8);
      d.setAttribute('aria-labelledby', id + '-t'); d.setAttribute('aria-describedby', id + '-b');
      d.innerHTML = `<form method="dialog"><div class="dlg-head"><h2 id="${id}-t">${esc(title)}</h2></div><div class="dlg-body"><p id="${id}-b">${esc(body)}</p></div><div class="dlg-foot"><button class="btn" value="cancel">${esc(cancel)}</button><button class="btn ${danger ? 'danger' : 'primary'}" value="ok">${esc(ok)}</button></div></form>`;
      document.body.append(d);
      d.addEventListener('close', () => { res(d.returnValue === 'ok'); d.remove(); }, {once: true});
      d.showModal();
    });
  }
  return {toast, confirm};
})();

/* =====================================================================
   ASTRAVITA.store — client-side persistence layer.
   IndexedDB key/value store (prefix "astravita:") + Web Crypto:
   - PBKDF2-SHA-256 (600,000 iterations, per-user salt) -> login verifier + vault key
   - AES-GCM 256 for every per-user vault and per-session sample blob
   - ECDH P-256 + HKDF -> one shared key per accepted doctor-patient link
   This layer is isolated so it can be replaced by calls to a .NET API later.
   ===================================================================== */
ASTRAVITA.store = (() => {
  const {b64} = ASTRAVITA.util;
  const PREFIX = 'astravita:';
  const ITER = 600000;
  const enc = new TextEncoder(), dec = new TextDecoder();

  /* ---------- IndexedDB key/value with localStorage fallback ---------- */
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no-idb'));
      const r = indexedDB.open('astravita', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    }).catch(e => { console.warn('[ASTRAVITA] IndexedDB unavailable, using localStorage', e); return null; });
    return dbp;
  }
  const tx = async (mode, fn) => {
    const d = await db();
    if (!d) return fn(null);
    return new Promise((res, rej) => {
      const t = d.transaction('kv', mode), s = t.objectStore('kv'); let out, failed = null;
      // errors inside fn must reject the call (and abort a write), not resolve with undefined
      let p; try { p = Promise.resolve(fn(s)); } catch (e) { p = Promise.reject(e); }
      p.then(v => { out = v; }, e => { failed = e; try { t.abort(); } catch { /* already finished */ } });
      t.oncomplete = () => failed ? rej(failed) : res(out); t.onerror = () => rej(failed || t.error); t.onabort = () => rej(failed || t.error || new Error('aborted'));
    });
  };
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const kv = {
    async get(k) {
      return tx('readonly', s => s ? req(s.get(PREFIX + k)) : JSON.parse(localStorage.getItem(PREFIX + k) || 'null'));
    },
    async set(k, v) {
      try { return await tx('readwrite', s => { if (s) s.put(v, PREFIX + k); else localStorage.setItem(PREFIX + k, JSON.stringify(v)); }); }
      catch (e) { if (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message))) { const err = new Error('Local storage is full. Export your data and delete old sessions.'); err.code = 'quota'; throw err; } throw e; }
    },
    async del(k) { return tx('readwrite', s => { if (s) s.delete(PREFIX + k); else localStorage.removeItem(PREFIX + k); }); },
    async keys(prefix = '') {
      return tx('readonly', async s => {
        if (!s) return Object.keys(localStorage).filter(k => k.startsWith(PREFIX + prefix)).map(k => k.slice(PREFIX.length));
        const all = await req(s.getAllKeys());
        return all.filter(k => String(k).startsWith(PREFIX + prefix)).map(k => String(k).slice(PREFIX.length));
      });
    }
  };

  /* ---------- crypto ---------- */
  const C = crypto.subtle;
  const randB64 = n => b64.enc(crypto.getRandomValues(new Uint8Array(n)));
  async function sha256B64(text) { return b64.enc(await C.digest('SHA-256', enc.encode(text))); }
  async function deriveFromPassword(password, saltB64, iterations = ITER) {
    const base = await C.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await C.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: b64.dec(saltB64), iterations}, base, 512));
    const verifier = b64.enc(await C.digest('SHA-256', bits.slice(0, 32)));
    const vaultKey = await C.importKey('raw', bits.slice(32, 64), {name: 'AES-GCM'}, false, ['encrypt', 'decrypt']);
    bits.fill(0);
    return {verifier, vaultKey};
  }
  async function encryptJSON(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await C.encrypt({name: 'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
    return {v: 1, iv: b64.enc(iv), ct: b64.enc(ct)};
  }
  async function decryptJSON(key, blob) {
    if (!blob || !blob.iv) return null;
    const pt = await C.decrypt({name: 'AES-GCM', iv: b64.dec(blob.iv)}, key, b64.dec(blob.ct));
    return JSON.parse(dec.decode(pt));
  }
  async function genKeyPair() {
    const kp = await C.generateKey({name: 'ECDH', namedCurve: 'P-256'}, true, ['deriveBits']);
    return {publicJwk: await C.exportKey('jwk', kp.publicKey), privateJwk: await C.exportKey('jwk', kp.privateKey)};
  }
  const importPriv = jwk => C.importKey('jwk', jwk, {name: 'ECDH', namedCurve: 'P-256'}, false, ['deriveBits']);
  const importPub = jwk => C.importKey('jwk', jwk, {name: 'ECDH', namedCurve: 'P-256'}, false, []);
  async function linkKey(privKey, peerPubJwk, linkId) {
    const bits = await C.deriveBits({name: 'ECDH', public: await importPub(peerPubJwk)}, privKey, 256);
    const hk = await C.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
    return C.deriveKey({name: 'HKDF', hash: 'SHA-256', salt: enc.encode('astravita:' + linkId), info: enc.encode('astravita link channel v1')}, hk, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  }
  const safeEq = (a, b) => { if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false; let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; };

  /* ---------- registry & links (metadata only, no health data) ---------- */
  async function registry() { return (await kv.get('registry')) || {users: {}}; }
  async function saveRegistry(r) { await kv.set('registry', r); }
  async function links() { return (await kv.get('links')) || {links: {}}; }
  async function saveLinks(l) { await kv.set('links', l); }

  /* ---------- link code ---------- */
  const CODE_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newLinkCode() { const r = crypto.getRandomValues(new Uint8Array(8)); return [...r].map(x => CODE_ALPHA[x % CODE_ALPHA.length]).join(''); }
  const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

  return {kv, ITER, randB64, sha256B64, deriveFromPassword, encryptJSON, decryptJSON, genKeyPair, importPriv, linkKey, safeEq, registry, saveRegistry, links, saveLinks, newLinkCode, normCode};
})();

/* =====================================================================
   ASTRAVITA.auth — accounts, roles, sessions and encrypted vaults
   ASTRAVITA.links — consent-based doctor/patient linking and shared channels
   ===================================================================== */
ASTRAVITA.auth = (() => {
  const S = ASTRAVITA.store, {uid} = ASTRAVITA.util;
  const SESSION_KEY = 'astravita:session';
  const IDLE_MS = 30 * 60 * 1000;
  let cur = null;   // {user (registry entry), vaultKey, privKey, vault}
  const listeners = new Set();
  const emit = () => listeners.forEach(f => { try { f(cur); } catch (e) { console.error(e); } });

  const emailHash = email => S.sha256B64('astravita|' + String(email).trim().toLowerCase());
  const pseudoId = prefix => prefix + '-' + S.randB64(6).replace(/[^A-Za-z0-9]/g, '').slice(0, 8).toLowerCase().padEnd(8, '0');

  function passwordChecks(pw) {
    pw = String(pw || '');
    return {len: pw.length >= 8, upper: /[A-Z]/.test(pw), lower: /[a-z]/.test(pw), symbol: /[^A-Za-z0-9\s]/.test(pw)};
  }
  function strength(pw) { const c = passwordChecks(pw); const base = [c.len, c.upper, c.lower, c.symbol].filter(Boolean).length; return pw && pw.length >= 14 && base === 4 ? 4 : Math.min(base, 3) || (pw ? 1 : 0); }

  async function register({email, password, name, role, title = '', mission = '', demo = false}) {
    if (!['patient', 'doctor'].includes(role)) throw new Error('Choose a role.');
    name = String(name ?? '').trim().slice(0, 120); title = String(title ?? '').trim().slice(0, 120); mission = String(mission ?? '').trim().slice(0, 160);
    if (!name) throw new Error('Enter your name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim())) throw new Error('Enter a valid email address.');
    const c = passwordChecks(password);
    if (!c.len || !c.upper || !c.symbol) throw new Error('Password must have 8+ characters, an uppercase letter and a symbol.');
    const reg = await S.registry(), eh = await emailHash(email);
    if (Object.values(reg.users).some(u => u.email_hash === eh)) throw new Error('An account with this email already exists. Sign in instead.');
    const salt = S.randB64(16);
    const {verifier, vaultKey} = await S.deriveFromPassword(password, salt);
    const kp = await S.genKeyPair();
    const user_id = uid();
    const entry = {
      user_id, email_hash: eh, role, demo: !!demo, salt, iter: S.ITER, verifier,
      pub_jwk: kp.publicJwk, wrapped_priv: await S.encryptJSON(vaultKey, kp.privateJwk),
      pseudo_id: role === 'patient' ? pseudoId('subj') : pseudoId('doc'),
      link_code: role === 'patient' ? S.newLinkCode() : null,
      created_at: new Date().toISOString()
    };
    const vault = {schema: 'astravita.vault.v1', profile: {display_name: name, title, mission, role, email: String(email).trim().toLowerCase()}, created_at: entry.created_at};
    if (role === 'patient') Object.assign(vault, {sessions: [], baseline: null, consent: null, received_notes_seen: [], cm_status: {}, alerts: []});
    else Object.assign(vault, {private_notes: {}, alert_reviews: {}});
    reg.users[user_id] = entry;
    await S.kv.set('vault:' + user_id, await S.encryptJSON(vaultKey, vault));
    await S.saveRegistry(reg);
    return {user: entry, user_id, vaultKey, vault, entry, privKey: await S.importPriv(kp.privateJwk)};
  }

  async function open(entry, password) {
    const {verifier, vaultKey} = await S.deriveFromPassword(password, entry.salt, entry.iter);
    if (!S.safeEq(verifier, entry.verifier)) return null;
    let vault, privKey;
    try {
      vault = await S.decryptJSON(vaultKey, await S.kv.get('vault:' + entry.user_id));
      if (vault) privKey = await S.importPriv(await S.decryptJSON(vaultKey, entry.wrapped_priv));
    } catch (x) { const e = new Error('Your encrypted data could not be opened. It may have been modified outside ASTRAVITA.'); e.code = 'integrity'; throw e; }
    if (!vault) throw new Error('Your encrypted data could not be opened.');
    // integrity check: role stored in the encrypted vault must match the registry
    if (vault.profile?.role !== entry.role) { const e = new Error('Account integrity check failed (role mismatch). Access was blocked.'); e.code = 'integrity'; throw e; }
    return {user: entry, vaultKey, privKey, vault};
  }

  async function signIn(email, password) {
    const reg = await S.registry(), eh = await emailHash(email);
    const entry = Object.values(reg.users).find(u => u.email_hash === eh);
    if (!entry) { await S.deriveFromPassword(password || 'x', S.randB64(16)); throw new Error('Email or password is incorrect.'); }   // equalize timing
    const c = await open(entry, password);
    if (!c) throw new Error('Email or password is incorrect.');
    cur = c; touch(); emit(); return cur;
  }
  async function unlock(password) {
    const s = pendingSession(); if (!s) throw new Error('Your session has expired. Please sign in again.');
    const reg = await S.registry(), entry = reg.users[s.user_id];
    if (!entry) { signOut(); throw new Error('This account no longer exists.'); }
    const c = await open(entry, password);
    if (!c) throw new Error('Password is incorrect.');
    cur = c; touch(); emit(); return cur;
  }
  function touch() { if (cur) sessionStorage.setItem(SESSION_KEY, JSON.stringify({user_id: cur.user.user_id, role: cur.user.role, name: cur.vault.profile.display_name, expires: Date.now() + IDLE_MS})); }
  function pendingSession() {
    try { const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); if (s && s.expires > Date.now()) return s; } catch { /* ignore */ }
    sessionStorage.removeItem(SESSION_KEY); return null;
  }
  function signOut() { cur = null; sessionStorage.removeItem(SESSION_KEY); emit(); }
  function current() { return cur; }
  function expired() { return !!cur && !pendingSession(); }

  async function saveVault() {
    if (!cur) throw new Error('Not signed in.');
    await S.kv.set('vault:' + cur.user.user_id, await S.encryptJSON(cur.vaultKey, cur.vault));
    touch();
  }
  async function saveSamples(sessionId, rows) { if (!cur) return; await S.kv.set(`samples:${cur.user.user_id}:${sessionId}`, await S.encryptJSON(cur.vaultKey, rows)); }
  async function loadSamples(sessionId) { if (!cur) return null; return S.decryptJSON(cur.vaultKey, await S.kv.get(`samples:${cur.user.user_id}:${sessionId}`)); }
  async function deleteSamples(sessionId) { if (cur) await S.kv.del(`samples:${cur.user.user_id}:${sessionId}`); }
  // re-read the registry entry (e.g. new link code) but never let it change role or demo status mid-session
  async function refreshEntry() {
    if (!cur) return; const reg = await S.registry(), e = reg.users[cur.user.user_id];
    if (e && e.role === cur.user.role && !!e.demo === !!cur.user.demo) cur.user = e;
  }
  async function regenerateLinkCode() {
    if (!cur || cur.user.role !== 'patient') return null;
    const reg = await S.registry(); const e = reg.users[cur.user.user_id];
    e.link_code = S.newLinkCode(); await S.saveRegistry(reg); cur.user = e; return e.link_code;
  }
  async function deleteAccount() {
    if (!cur) return;
    const id = cur.user.user_id, reg = await S.registry();
    const L = await S.links();
    for (const l of Object.values(L.links)) if (l.patient_id === id || l.doctor_id === id) { await S.kv.del('share:' + l.link_id); await S.kv.del('care:' + l.link_id); delete L.links[l.link_id]; }
    await S.saveLinks(L);
    for (const k of await S.kv.keys('samples:' + id + ':')) await S.kv.del(k);
    await S.kv.del('vault:' + id); delete reg.users[id]; await S.saveRegistry(reg);
    signOut();
  }
  return {register, signIn, unlock, signOut, current, expired, pendingSession, touch, saveVault, saveSamples, loadSamples, deleteSamples, refreshEntry, regenerateLinkCode, deleteAccount, passwordChecks, strength, open, onChange: f => listeners.add(f)};
})();

ASTRAVITA.links = (() => {
  const S = ASTRAVITA.store, A = ASTRAVITA.auth, {uid} = ASTRAVITA.util;
  const keyCache = new Map();
  const me = () => { const c = A.current(); if (!c) throw new Error('Not signed in.'); return c; };
  async function channelKeyFor(c, link) {
    const ck = c.user.user_id + '|' + link.link_id;
    if (keyCache.has(ck)) return keyCache.get(ck);
    const reg = await S.registry();
    const peerId = c.user.role === 'doctor' ? link.patient_id : link.doctor_id;
    const peer = reg.users[peerId]; if (!peer) throw new Error('The linked account no longer exists.');
    const k = await S.linkKey(c.privKey, peer.pub_jwk, link.link_id); keyCache.set(ck, k); return k;
  }
  const channelKey = link => channelKeyFor(me(), link);
  // ---- doctor side ----
  async function request(code) {

/* =====================================================================

   pyVHR/BVP/methods.py -> cpu_POS, cpu_CHROM, cpu_GREEN). Runs in a Web
   Worker when available; the same factory runs on the main thread as fallback.
   Experimental: optical estimates, not a medical device.
   ===================================================================== */
function astravitaSignalFactory() {
  const fin = v => typeof v === 'number' && Number.isFinite(v);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    const out = []; if (ts.length < 2) return out;
    const end = ts[ts.length - 1], start = Math.max(ts[0], end - dur * 1000);

  function bandpass(x, fs, lo, hi) {

    const b0 = al / a0, b2 = -al / a0, a1 = -2 * Math.cos(w) / a0, a2 = (1 - al) / a0;

        else pk.push(i);

    const p2 = pk.map(i => { const a = h[i - 1], b = h[i], c = h[i + 1], d = a - 2 * b + c; return i + (d ? clamp(0.5 * (a - c) / d, -0.5, 0.5) : 0); });

    return Math.sqrt(s / (ibi.length - 1));

  /* One analysis step: returns heart rate, SNR, pulse trace, RMSSD and respiration rate.

      const names = methods[msg.alg] ? [msg.alg] : ['POS', 'CHROM'];   // 'auto' or unknown -> best of POS/CHROM

ASTRAVITA.signal = (() => {
  const local = astravitaSignalFactory();
  let worker = null, busy = false, pending = null, cb = null;
  function ensureWorker() {
    if (worker !== null) return worker;
    try {
      const src = `${astravitaSignalFactory.toString()}\nconst S = astravitaSignalFactory();\nself.onmessage = e => { try { self.postMessage({ok: true, out: S.analyze(e.data)}); } catch (err) { self.postMessage({ok: false, error: String(err)}); } };`;
      const url = URL.createObjectURL(new Blob([src], {type: 'text/javascript'}));
      worker = new Worker(url); URL.revokeObjectURL(url);
      worker.onmessage = e => { busy = false; if (e.data.ok && cb) cb(e.data.out); else if (!e.data.ok) console.warn('[ASTRAVITA] signal analysis failed', e.data.error); if (pending) { const p = pending; pending = null; post(p); } };
      worker.onerror = e => { console.warn('[ASTRAVITA] signal worker failed, using main thread', e.message); worker.terminate(); worker = false; busy = false; pending = null; };
    } catch (e) { console.warn('[ASTRAVITA] Web Worker unavailable, using main thread', e); worker = false; }
    return worker;
  }
  function post(msg) { busy = true; worker.postMessage(msg); }
  // request an analysis; results arrive asynchronously through onResult
  function request(msg) {
    const w = ensureWorker();
    if (w) { if (busy) pending = msg; else post(msg); return; }
    const out = local.analyze(msg); if (cb) cb(out);
  }
  function onResult(f) { cb = f; }
  function terminate() { if (worker) worker.terminate(); worker = null; busy = false; pending = null; }
  return {request, onResult, terminate, local};
})();

ASTRAVITA.analysis = (() => {
  const U = ASTRAVITA.util, {fin, mean, std, rnd, clamp} = U;
  const MINUTE_KEYS = ['hr_bpm', 'rr_rpm', 'rmssd_ms', 'blink_rate_min', 'perclos_pct', 'facial_tension', 'head_stability_pct', 'microexpr_min', 'stress_index', 'fatigue_level', 'wellbeing_index', 'signal_quality',
    'emotion_neutral_pct', 'emotion_happy_pct', 'emotion_sad_pct', 'emotion_angry_pct', 'emotion_fear_pct', 'emotion_surprise_pct', 'emotion_disgust_pct'];
  const FEATURE_KEYS = ['hr_bpm', 'rmssd_ms', 'rr_rpm', 'blink_rate_min', 'perclos_pct', 'facial_tension', 'head_stability_pct', 'microexpr_min',
    'emotion_neutral_pct', 'emotion_happy_pct', 'emotion_sad_pct', 'emotion_angry_pct', 'emotion_fear_pct', 'emotion_surprise_pct', 'emotion_disgust_pct', 'stress_index', 'fatigue_level', 'wellbeing_index', 'signal_quality'];
  const col = (rows, k) => rows.map(r => r[k]).filter(fin);

  function minutes(rows, startIso) {
    const t0 = Date.parse(startIso || rows[0]?.timestamp || 0), out = [];
    for (const r of rows) {
      const m = Math.max(0, Math.floor((Date.parse(r.timestamp) - t0) / 60000));
      (out[m] ||= {minute: m, n: 0, acc: {}}).n++;
      for (const k of MINUTE_KEYS) if (fin(r[k])) { const a = out[m].acc[k] ||= [0, 0]; a[0] += r[k]; a[1]++; }
    }
    return out.filter(Boolean).map(x => ({minute: x.minute, ...Object.fromEntries(MINUTE_KEYS.map(k => [k, x.acc[k] ? rnd(x.acc[k][0] / x.acc[k][1], 1) : null]))}));
  }
  function features(rows, events = [], {start, end} = {}) {
    const dur = Math.max(1, (Date.parse(end || rows[rows.length - 1]?.timestamp || Date.now()) - Date.parse(start || rows[0]?.timestamp || Date.now())) / 1000);
    const f = {};
    for (const k of FEATURE_KEYS) { const v = col(rows, k); f[k] = v.length ? rnd(mean(v), 1) : null; }
    const yawns = rows.reduce((m, r) => fin(r.yawn_count) && r.yawn_count > m ? r.yawn_count : m, 0);   // no spread: safe for very long sessions
    f.yawn_per_10min = rnd(yawns / dur * 600, 2);
    const emoVar = ['happy', 'sad', 'angry', 'fear', 'surprise', 'disgust'].map(k => col(rows, `emotion_${k}_pct`)).filter(a => a.length > 5).map(a => std(a));
    f.affect_variability = emoVar.length ? rnd(clamp(mean(emoVar) * 6, 0, 100), 1) : null;
    f.local_hour = new Date(start || rows[0]?.timestamp || Date.now()).getHours();
    f.long_closures = events.filter(e => e.type === 'closure').length;
    f.microexpr_events = events.filter(e => e.type === 'micro').length;
    f.duration_s = Math.round(dur);
    f.quality_pct = rows.length ? rnd(100 * rows.filter(r => fin(r.hr_bpm)).length / rows.length, 0) : 0;
    return f;
  }
  // personal reference: rolling mean of recent good-quality sessions WITHOUT notable findings
  // (7 days; widened up to 28 days if needed, >= 3 sessions), else the calibration baseline.
  // Excluding flagged sessions keeps a slow drift from silently becoming the new "normal".
  function personalBaseline(sessions, calibration, beforeIso) {
    const end = beforeIso ? Date.parse(beforeIso) : Date.now();
    const ok = s => s.features && Date.parse(s.start) < end && (s.features.quality_pct ?? 0) >= 50 && (!s.result || s.result.status === 'nominal');
    for (const days of [7, 14, 28]) {
      const recent = (sessions || []).filter(s => ok(s) && Date.parse(s.start) >= end - days * 86400000);
      if (recent.length >= 3) {
        const b = {kind: 'rolling_' + days + 'd', n_sessions: recent.length};
        for (const k of [...FEATURE_KEYS, 'yawn_per_10min', 'affect_variability']) { const v = recent.map(s => s.features[k]).filter(fin); b[k] = v.length ? rnd(mean(v), 1) : null; }
        return b;
      }
    }
    if (calibration) return {kind: 'calibration', n_sessions: 0, ...calibration};
    return null;
  }
  // per-day aggregates for a week (Monday to Sunday, local time)
  function weekModel(sessions, offset = 0) {
    const ws = U.addDays(U.startOfWeek(new Date()), -7 * offset), days = [];
    for (let i = 0; i < 7; i++) {
      const d = U.addDays(ws, i), key = U.dayKey(d);
      const list = (sessions || []).filter(s => U.dayKey(s.start) === key && s.features);
      const m = k => { const v = list.map(s => s.features[k]).filter(fin); return v.length ? rnd(mean(v), 1) : null; };
      days.push({date: d.toISOString(), key, label: U.dateLong(d), sessions: list.length, minutes: rnd(list.reduce((a, s) => a + (s.duration_s || 0), 0) / 60, 1),
        wellbeing_index: m('wellbeing_index'), stress_index: m('stress_index'), fatigue_level: m('fatigue_level'), hr_bpm: m('hr_bpm'), rr_rpm: m('rr_rpm'), perclos_pct: m('perclos_pct'), rmssd_ms: m('rmssd_ms'), facial_tension: m('facial_tension')});
    }
    return {start: ws.toISOString(), end: U.addDays(ws, 7).toISOString(), days};
  }
  function weekKpis(W, P) {
    const avg = (M, k) => { const v = M.days.map(d => d[k]).filter(fin); return v.length ? mean(v) : null; };
    const sum = (M, k) => M.days.reduce((a, d) => a + (d[k] || 0), 0);
    const k = (key, label, unit, better) => ({key, label, unit, better, v: avg(W, key), p: avg(P, key)});
    return [k('wellbeing_index', 'Wellbeing index', '/100', 'up'), k('stress_index', 'Stress index', '/100', 'down'), k('fatigue_level', 'Fatigue level', '/5', 'down'), k('hr_bpm', 'Heart rate', 'bpm', 'flat'),
      {key: 'minutes', label: 'Time monitored', unit: 'min', better: 'up', v: sum(W, 'minutes'), p: sum(P, 'minutes')}, {key: 'sessions', label: 'Sessions', unit: '', better: 'up', v: sum(W, 'sessions'), p: sum(P, 'sessions')}];
  }
  return {minutes, features, personalBaseline, weekModel, weekKpis, MINUTE_KEYS, FEATURE_KEYS};
})();

ASTRAVITA.kb = (() => {
  let data = null;
  function load() {
    if (data) return data;
    const el = document.getElementById('astravita-kb');
    try { data = JSON.parse(el.textContent); } catch (e) { console.error('[ASTRAVITA] knowledge base failed to load', e); data = {conditions: [], countermeasures: [], reference_ranges: {}, questionnaire: {items: []}}; }
    data.cmIndex = Object.fromEntries((data.countermeasures || []).map(c => [c.id, c]));
    data.condIndex = Object.fromEntries((data.conditions || []).map(c => [c.id, c]));
    return data;
  }
  return {load, get: () => load(), condition: id => load().condIndex[id], countermeasure: id => load().cmIndex[id]};
})();

ASTRAVITA.engine = (() => {
  const U = ASTRAVITA.util, {fin, clamp, rnd} = U;
  const VERSION = 'astravita.engine.v1';
  const LABELS = {
    hr_bpm: ['Heart rate', 'bpm'], rmssd_ms: ['HRV (RMSSD)', 'ms'], rr_rpm: ['Breathing rate', '/min'], blink_rate_min: ['Blink rate', '/min'], perclos_pct: ['PERCLOS', '%'], yawn_per_10min: ['Yawns', 'per 10 min'],
    facial_tension: ['Facial tension', '/100'], head_stability_pct: ['Head stability', '%'], microexpr_min: ['Micro-expressions', '/min'], affect_variability: ['Expressivity', '/100'],
    emotion_neutral_pct: ['Neutral expression', '%'], emotion_happy_pct: ['Joy expression', '%'], emotion_sad_pct: ['Sadness expression', '%'], emotion_angry_pct: ['Anger expression', '%'], emotion_fear_pct: ['Fear expression', '%'], emotion_surprise_pct: ['Surprise expression', '%'], emotion_disgust_pct: ['Disgust expression', '%'],
    stress_index: ['Stress index', '/100'], fatigue_level: ['Fatigue level', '/5'], wellbeing_index: ['Wellbeing index', '/100'], local_hour: ['Session hour', 'h'], signal_quality: ['Signal quality', '/100']
  };
  const label = ind => {
    if (LABELS[ind]) return LABELS[ind][0];
    const q = (ASTRAVITA.kb.get().questionnaire?.items || []).find(i => i.id === ind);
    return q ? (q.short || q.text) : ind;
  };
  const unit = ind => LABELS[ind]?.[1] || '';
  const isQ = ind => ind.startsWith('q_');
  // minimum denominators for % change, so a near-zero baseline (e.g. stress 1/100) cannot produce absurd percentages
  const FLOOR = {stress_index: 10, wellbeing_index: 10, fatigue_level: 1, perclos_pct: 3, microexpr_min: 1, yawn_per_10min: 1, facial_tension: 10, affect_variability: 10, rmssd_ms: 10, blink_rate_min: 5};
  const OPS = {'>': (v, t) => v > t, '>=': (v, t) => v >= t, '<': (v, t) => v < t, '<=': (v, t) => v <= t};

  function activation(rule, v) {
    const t = Number(rule.threshold); if (!fin(v) || !fin(t)) return null;
    if (isQ(rule.indicator)) return OPS[rule.op]?.(v, t) ? 1 : 0;
    const margin = rule.ref === 'baseline_pct' ? 5 : Math.max(Math.abs(t) * 0.1, 0.5);
    const up = rule.op === '>' || rule.op === '>=';
    if (OPS[rule.op]?.(v, t)) return 1;
    const dist = up ? t - v : v - t;   // how far from triggering
    return dist < margin ? clamp(1 - dist / margin, 0, 1) * 0.5 : 0;
  }
  function value(rule, f, q, base) {
    const ind = rule.indicator;
    if (isQ(ind)) { const v = q?.[ind]; return {v: fin(v) ? v : null, raw: v}; }
    const raw = f?.[ind];
    if (!fin(raw)) return {v: null, raw: null};
    if (rule.ref === 'baseline_pct') { const b = base?.[ind]; if (!fin(b)) return {v: null, raw, noBase: true}; return {v: (raw - b) / Math.max(Math.abs(b), FLOOR[ind] ?? (ind.startsWith('emotion_') ? 5 : 1e-6)) * 100, raw, base: b}; }
    return {v: raw, raw};
  }
  function describe(rule, val) {
    const u = unit(rule.indicator);
    if (isQ(rule.indicator)) return `answer ${val.raw ?? '—'} (trigger ${rule.op} ${rule.threshold})`;
    if (rule.ref === 'baseline_pct') return fin(val.v) ? `${U.fmt(val.raw, 1)} ${u} (${U.sgn(val.v, 0)} % vs baseline; trigger ${rule.op} ${rule.threshold} %)` : val.noBase ? 'no personal baseline yet' : 'not measured';
    return fin(val.v) ? `${U.fmt(val.raw, 1)} ${u} (trigger ${rule.op} ${rule.threshold} ${u})` : 'not measured';
  }

  /* evaluate one session. f = session features, q = questionnaire answers (or null),
     base = personal baseline (or null). Returns a result object stored in the history. */
  function evaluate({f, q, base, kb = ASTRAVITA.kb.get()}) {
    const insufficient = !f || (f.duration_s ?? 0) < 60 || (f.quality_pct ?? 0) < 50 || (f.signal_quality ?? 0) < 40;
    const qAnswered = !!q && Object.keys(q).some(k => k !== 'q_safety' && fin(q[k]));
    const safety = !!q && q.q_safety === 1;
    const findings = [];
    for (const c of kb.conditions || []) {
      const rules = c.indicator_rules || [];
      const posW = rules.reduce((s, r) => s + Math.max(0, Number(r.weight) || 0), 0) || 1;
      let pts = 0, evalW = 0, camPts = 0, camW = 0, qPts = 0, qW = 0;
      const contributions = [], missing = [], inactive = [];
      for (const r of rules) {
        const w = Number(r.weight) || 0, cam = !isQ(r.indicator);
        if (cam && insufficient) { missing.push({indicator: r.indicator, label: label(r.indicator), reason: 'insufficient signal quality'}); continue; }
        const val = value(r, f, q, base);
        const a = activation(r, val.v);
        if (a == null) { missing.push({indicator: r.indicator, label: label(r.indicator), reason: isQ(r.indicator) ? 'question not answered' : val.noBase ? 'no personal baseline yet' : 'not measured'}); continue; }
        const p = w * a; pts += p; if (w > 0) evalW += w;
        if (cam) { camPts += Math.max(0, p); camW += Math.max(0, w); } else { qPts += Math.max(0, p); qW += Math.max(0, w); }
        const row = {indicator: r.indicator, label: label(r.indicator), points: rnd(p, 1), weight: w, detail: describe(r, val), note: r.note || '', active: a > 0};
        if (Math.abs(p) > 0.05) contributions.push(row); else if (w > 0) inactive.push(row);
      }
      let score = rnd(clamp(pts / posW * 100 * (c.weight_factor ?? 1), 0, 100), 0), gated = false;
      // non-specific patterns (e.g. nutritional, endocrine) need at least one more specific sign
      if (c.gate?.any?.length && !contributions.some(r => r.active && c.gate.any.includes(r.indicator))) { if (score > c.gate.cap) { score = c.gate.cap; gated = true; } }
      const coverage = evalW / posW;
      let agreement = 0.6;
      if (camW > 0 && qW > 0) agreement = 1 - Math.abs(camPts / camW - qPts / qW);
      const qual = insufficient ? 0.2 : clamp((f.signal_quality ?? 0) / 100, 0, 1);
      const durF = clamp((f?.duration_s ?? 0) / 300, 0, 1);
      const conf = 0.35 * qual + 0.2 * durF + 0.25 * coverage + 0.2 * agreement;
      const band = score >= 70 ? 'strong' : score >= 50 ? 'notable' : score >= 40 ? 'watch' : null;
      contributions.sort((a, b) => b.points - a.points);
      inactive.sort((a, b) => b.weight - a.weight);
      findings.push({id: c.id, name: c.name, category: c.category, score, band, coverage: rnd(coverage * 100, 0), confidence: rnd(conf * 100, 0), confidence_label: conf >= 0.7 ? 'high' : conf >= 0.45 ? 'medium' : 'low',
        gated, based_on: camPts > 0 && qPts > 0 ? 'camera + questionnaire' : qPts > 0 ? 'questionnaire only' : 'camera only',
        contributions, missing, counterfactual: inactive.slice(0, 3).map(r => ({label: r.label, weight: r.weight, detail: r.detail}))});
    }
    findings.sort((a, b) => b.score - a.score || b.confidence - a.confidence);
    const shown = findings.filter(x => x.band);
    const status = safety || shown.some(x => x.band === 'strong') ? 'alert' : shown.length ? 'watch' : 'nominal';
    let summary;
    // the safety answer always leads the summary, so status "alert" never sits next to "no findings"
    if (!shown.length && safety) summary = 'Support was requested in the check-in.' + (insufficient ? ' Camera signal quality was too low for a camera-based orientation.' : ' No other notable pattern was found in this session.');
    else if (insufficient && !shown.length) summary = 'Insufficient signal quality for a camera-based orientation. Try again with steady lighting, facing the camera, for at least 2 minutes.';
    else if (!shown.length) summary = 'No significant findings. Your indicators stayed close to your usual pattern.';
    else summary = `Pattern consistent with ${shown[0].name.replace(/^Pattern consistent with\s*/i, '').replace(/^(a|an)\s+/i, '')}` + (shown.length > 1 ? `, plus ${U.plural(Math.min(shown.length, 5) - 1, 'other pattern')} worth watching.` : '.');
    return {engine_version: VERSION, computed_at: new Date().toISOString(), insufficient, questionnaire_used: qAnswered, safety, status, summary, baseline_kind: base?.kind || null,
      findings: shown.slice(0, 5), more_patterns: Math.max(0, shown.length - 5), all_scores: findings.map(x => ({id: x.id, score: x.score}))};
  }
  return {evaluate, label, unit, VERSION, LABELS};
})();

/* =====================================================================
   ASTRAVITA.charts — dependency-free, accessible SVG charts (works offline).
   Every chart has role="img", a text summary, keyboard/pointer tooltips and
   an alternative data table. Missing readings leave gaps (never interpolated).
   ===================================================================== */
ASTRAVITA.charts = (() => {
  const U = ASTRAVITA.util, {fin, esc} = U;
  const PALETTE = {primary: '#147D52', tele: '#3478A8', vision: '#39A9DB', gold: '#C6A15B', warn: '#B7791F', bad: '#C34A4A', forest: '#102C28', slate: '#566476', violet: '#6B5CA5'};
  const niceRange = (lo, hi) => {
    if (!fin(lo) || !fin(hi)) return [0, 1];
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    const span = hi - lo, step = 10 ** Math.floor(Math.log10(span / 4)), m = [1, 2, 2.5, 5, 10].find(x => span / (x * step) <= 5) * step;
    return [Math.floor(lo / m) * m, Math.ceil(hi / m) * m, m];
  };

  function table(labels, series, caption) {
    return `<details class="alt-table"><summary>Show data table</summary><div class="table-wrap"><table class="data"><caption class="sr-only">${esc(caption)}</caption><thead><tr><th scope="col">Point</th>${series.map(s => `<th scope="col">${esc(s.name)}${s.unit ? ' (' + esc(s.unit) + ')' : ''}</th>`).join('')}</tr></thead><tbody>${labels.map((l, i) => `<tr><th scope="row">${esc(l)}</th>${series.map(s => `<td class="num">${fin(s.data[i]) ? U.fmt(s.data[i], s.dec ?? 1) : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  }
  function legend(series) { return `<div class="legend" aria-hidden="true">${series.map(s => `<span style="color:${s.color}"><i class="${s.dash ? 'dash' : ''}" style="background:${s.color}"></i><span style="color:var(--muted)">${esc(s.name)}</span></span>`).join('')}</div>`; }

  /* line / bar chart. opts: {labels, series:[{name, data, color, unit, dec, dash, axis:'y'|'y2', type:'line'|'bar'}],
     y:{min,max,label}, y2:{min,max,label}, bands:[{from,to,color,label}], title, summary, height} */
  const decOf = step => step >= 1 ? 0 : Math.min(3, (String(+step.toFixed(4)).split('.')[1] || '').length);
  // re-render when the container width changes so text and markers are never stretched
  const observed = new Set();
  const ro = 'ResizeObserver' in window ? new ResizeObserver(entries => { for (const e of entries) { const c = e.target, w = Math.round(e.contentRect.width); if (c.__chart && Math.abs(w - c.__chart.w) > 24) { c.__chart.w = w; render(c, c.__chart.opts); } } }) : null;
  function render(container, opts) {
    if (ro) { for (const c of observed) if (!c.isConnected) { ro.unobserve(c); observed.delete(c); } if (!observed.has(container)) { ro.observe(container); observed.add(container); } }
    container.__chart = {opts, w: Math.round(container.clientWidth || 640)};
    const {labels = [], series = [], title = 'Chart', summary = ''} = opts;
    const has = series.some(s => s.data.some(fin));
    if (!has) { container.innerHTML = `<div class="chart ${opts.size || ''}"><div class="chart-empty">${esc(opts.empty || 'No data yet for this chart.')}</div></div>`; return; }
    const W = Math.max(280, Math.round(container.clientWidth || 640)), H = opts.size === 'short' ? 180 : opts.size === 'tall' ? 300 : 240, L = 44, R = series.some(s => s.axis === 'y2') ? 44 : 14, T = 12, Bm = 28;
    const pw = W - L - R, ph = H - T - Bm;
    const rangeFor = axis => {
      const vals = series.filter(s => (s.axis || 'y') === axis).flatMap(s => s.data.filter(fin));
      const cfg = opts[axis] || {}; const lo = fin(cfg.min) ? cfg.min : Math.min(...vals, ...(cfg.include || [])), hi = fin(cfg.max) ? cfg.max : Math.max(...vals, ...(cfg.include || []));
      const [a, b, step] = niceRange(lo, hi); return {lo: fin(cfg.min) ? cfg.min : a, hi: fin(cfg.max) ? cfg.max : b, step: step || (b - a) / 4};
    };
    const ry = rangeFor('y'), ry2 = series.some(s => s.axis === 'y2') ? rangeFor('y2') : null;
    const n = labels.length, bars = series.filter(s => s.type === 'bar');
    const X = i => L + (n <= 1 ? pw / 2 : bars.length ? (i + 0.5) / n * pw : i / (n - 1) * pw);
    const Yof = (v, r) => T + ph * (1 - (v - r.lo) / ((r.hi - r.lo) || 1));
    let g = '';
    for (const b of opts.bands || []) { const y1 = Yof(Math.min(b.to, ry.hi), ry), y0 = Yof(Math.max(b.from, ry.lo), ry); g += `<rect x="${L}" y="${y1}" width="${pw}" height="${Math.max(0, y0 - y1)}" fill="${b.color}" opacity=".12"/>`; if (b.label) g += `<text x="${L + pw - 4}" y="${y1 + 12}" text-anchor="end" font-size="10" fill="#566476">${esc(b.label)}</text>`; }
    const ticks = []; for (let v = ry.lo; v <= ry.hi + 1e-9; v += ry.step) ticks.push(v);
    for (const v of ticks) { const y = Yof(v, ry); g += `<line x1="${L}" x2="${L + pw}" y1="${y}" y2="${y}" stroke="#E0E9E5"/><text x="${L - 6}" y="${y + 3}" text-anchor="end" font-size="10" fill="#566476" font-family="JetBrains Mono, monospace">${U.fmt(v, decOf(ry.step))}</text>`; }
    if (ry2) { for (let v = ry2.lo; v <= ry2.hi + 1e-9; v += ry2.step) g += `<text x="${L + pw + 6}" y="${Yof(v, ry2) + 3}" font-size="10" fill="#566476" font-family="JetBrains Mono, monospace">${U.fmt(v, decOf(ry2.step))}</text>`; }
    const every = Math.max(1, Math.ceil(n / (opts.maxTicks || 8)));
    labels.forEach((l, i) => { if (i % every === 0 || i === n - 1) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#566476">${esc(l)}</text>`; });
    if (opts.y?.label) g += `<text x="4" y="${T + 2}" font-size="10" fill="#566476" dominant-baseline="hanging">${esc(opts.y.label)}</text>`;
    // bars
    const bw = n ? Math.max(2, pw / n / (bars.length + 1)) : 0;
    bars.forEach((s, j) => { const r = s.axis === 'y2' ? ry2 : ry; s.data.forEach((v, i) => { if (!fin(v)) return; const y = Yof(v, r), y0 = Yof(Math.max(r.lo, 0), r); g += `<rect x="${X(i) - bw * bars.length / 2 + j * bw}" y="${Math.min(y, y0)}" width="${bw - 1}" height="${Math.abs(y0 - y)}" rx="2" fill="${s.color}" opacity=".85"/>`; }); });
    // lines with gaps
    for (const s of series.filter(s => s.type !== 'bar')) {
      const r = s.axis === 'y2' ? ry2 : ry; let d = '', pen = false;
      s.data.forEach((v, i) => { if (!fin(v)) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Yof(v, r).toFixed(1)}`; pen = true; });
      g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>`;
      if (n <= 31) s.data.forEach((v, i) => { if (fin(v)) g += `<circle cx="${X(i)}" cy="${Yof(v, r)}" r="2.6" fill="#fff" stroke="${s.color}" stroke-width="1.6"/>`; });
    }
    const id = 'ch' + Math.random().toString(36).slice(2, 8);
    container.innerHTML = `<figure style="margin:0"><div class="chart ${opts.size || ''}" tabindex="0" role="img" aria-label="${esc(title)}" aria-describedby="${id}-d">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">${g}<line class="cursor" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="#102C28" stroke-dasharray="3 3" opacity="0"/></svg><div class="tip" hidden></div></div>
      ${legend(series)}<p id="${id}-d" class="sr-only">${esc(summary)}</p>${table(labels, series, title)}</figure>`;

/* =====================================================================
   ASTRAVITA.data — crew-member data operations (sessions, baseline,
   alerts, countermeasure status) and ASTRAVITA.export (CSV / JSON).
   ===================================================================== */
ASTRAVITA.data = (() => {
  const U = ASTRAVITA.util, A = ASTRAVITA.auth, AN = ASTRAVITA.analysis, E = ASTRAVITA.engine, LK = ASTRAVITA.links, {fin, rnd} = U;
  const v = () => { const c = A.current(); if (!c || c.user.role !== 'patient') throw new Error('Not available for this account.'); return c.vault; };
  const sessions = () => [...(v().sessions || [])].sort((a, b) => Date.parse(b.start) - Date.parse(a.start));
  const latest = () => sessions()[0] || null;
  const byId = id => (v().sessions || []).find(s => s.id === id) || null;
  const baseline = (beforeIso) => AN.personalBaseline(v().sessions, v().baseline, beforeIso);

  function alertsFor(session) {
    const out = [], r = session.result; if (!r) return out;
    const mk = (severity, title, detail, kind) => ({id: U.uid(), at: session.end || session.start, session_id: session.id, severity, title, detail, kind, simulated: !!session.simulated});
    if (r.safety) out.push(mk('bad', 'Support requested in questionnaire', 'The crew member answered "yes" to the safety question. The support protocol was shown. Please check in personally and calmly.', 'safety'));
    for (const f of r.findings || []) if (f.band === 'strong' || f.band === 'notable') out.push(mk(f.band === 'strong' ? 'bad' : 'warn', f.name, `Score ${f.score}/100 · confidence ${f.confidence_label} · ${f.based_on}.`, f.id));
    return out;
  }

  /* build, evaluate and persist a finished monitoring session */
  async function saveSession({rec, source, questionnaire = null, simulated = false}) {
    const c = A.current(), vault = v();
    const rows = rec.samples;
    const f = AN.features(rows, rec.events, {start: rec.startedAt, end: rec.endedAt});
    const base = baseline(rec.startedAt);
    const result = E.evaluate({f, q: questionnaire, base});
    const s = {id: rec.meta.session_id, subject_id: c.user.pseudo_id, start: rec.startedAt, end: rec.endedAt, duration_s: f.duration_s, source, simulated,
      features: f, minutes: AN.minutes(rows, rec.startedAt), questionnaire, result, quality_pct: f.quality_pct,
      baseline_used: base ? {kind: base.kind, hr_bpm: base.hr_bpm, rmssd_ms: base.rmssd_ms, rr_rpm: base.rr_rpm, blink_rate_min: base.blink_rate_min, perclos_pct: base.perclos_pct, facial_tension: base.facial_tension, head_stability_pct: base.head_stability_pct, microexpr_min: base.microexpr_min, wellbeing_index: base.wellbeing_index, stress_index: base.stress_index} : null,
      micro_events: rec.events.filter(e => e.type === 'micro').slice(-300).map(e => ({t: e.timestamp, au: e.data?.au, type: e.data?.type, duration_ms: e.data?.duration_ms, intensity: e.data?.intensity})),
      counts: {micro: rec.events.filter(e => e.type === 'micro').length, yawns: rows.length ? Math.max(...rows.map(r => r.yawn_count || 0)) : 0, long_closures: rec.events.filter(e => e.type === 'closure').length},
      summary: result.summary, app_version: ASTRAVITA.version};
    vault.sessions = [...(vault.sessions || []), s];
    vault.alerts = [...(vault.alerts || []), ...alertsFor(s)].slice(-300);
    await A.saveSamples(s.id, rows);
    await A.saveVault();
    try { await LK.publishShare(); } catch (e) { console.warn('[ASTRAVITA] share update failed', e); }
    return s;
  }
  async function reevaluate(sessionId, questionnaire) {
    const vault = v(), s = byId(sessionId); if (!s) throw new Error('Session not found.');
    s.questionnaire = questionnaire;
    s.result = E.evaluate({f: s.features, q: questionnaire, base: baseline(s.start)});
    s.summary = s.result.summary;
    vault.alerts = [...(vault.alerts || []).filter(a => a.session_id !== s.id), ...alertsFor(s)].slice(-300);
    await A.saveVault(); try { await LK.publishShare(); } catch { /* not linked */ }
    return s;
  }
  async function deleteSession(id) {
    const vault = v(); vault.sessions = (vault.sessions || []).filter(s => s.id !== id);
    vault.alerts = (vault.alerts || []).filter(a => a.session_id !== id);
    await A.deleteSamples(id); await A.saveVault(); try { await LK.publishShare(); } catch { /* not linked */ }
  }
  async function setCalibration(b) { const vault = v(); vault.baseline = {...b, history: [...(vault.baseline?.history || []), {at: b.calibrated_at, hr_bpm: b.hr_bpm, rmssd_ms: b.rmssd_ms}].slice(-30)}; await A.saveVault(); try { await LK.publishShare(); } catch { /* not linked */ } }
  async function setConsent() { v().consent = {at: new Date().toISOString(), version: 1}; await A.saveVault(); }
  async function setCmStatus(cmId, status) { const vault = v(); vault.cm_status = {...(vault.cm_status || {}), [cmId]: {status, at: new Date().toISOString()}}; await A.saveVault(); try { await LK.publishShare(); } catch { /* not linked */ } }
  const totals = () => { const s = sessions(); return {count: s.length, seconds: s.reduce((a, x) => a + (x.duration_s || 0), 0)}; };
  return {sessions, latest, byId, baseline, saveSession, reevaluate, deleteSession, setCalibration, setConsent, setCmStatus, totals, alertsFor};
})();

ASTRAVITA.export = (() => {

  const SESSION_COLS = ['session_id', 'subject_id', 'start', 'end', 'duration_s', 'source', 'simulated', 'quality_pct', 'status', 'top_finding', 'top_score', 'confidence', 'hr_bpm', 'rmssd_ms', 'rr_rpm', 'blink_rate_min', 'perclos_pct', 'yawn_per_10min', 'facial_tension', 'head_stability_pct', 'microexpr_min', 'affect_variability', 'stress_index', 'fatigue_level', 'wellbeing_index', 'signal_quality', 'summary'];
  function sessionRows(list, subjectId) {

      status: s.result?.status, top_finding: s.result?.findings?.[0]?.id || '', top_score: s.result?.findings?.[0]?.score ?? '', confidence: s.result?.findings?.[0]?.confidence_label || '', ...Object.fromEntries(SESSION_COLS.filter(k => k in (s.features || {})).map(k => [k, s.features[k]])), summary: s.summary}));
  }

  const minuteRows = (list, subjectId) => list.flatMap(s => (s.minutes || []).map(m => ({session_id: s.id, subject_id: s.subject_id || subjectId, ...m})));

})();
